defaults:
  - base_rpent
  - override hydra/job_logging: stdout
  - _self_

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    rollout:
      node_group: rollout
      placement: '2'
    reward: '2'
    agentloop: '3'
  node_groups:
    - label: rollout
      node_ranks: all
      env_configs:
        - node_ranks: all
          env_vars:
            - PYTORCH_ALLOC_CONF: expandable_segments:False
            - PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False

runner:
  task_type: reasoning
  synchronous: true
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends:
      - tensorboard
  max_epochs: 10
  max_steps: 150
  val_check_interval: -1
  save_interval: 10
  seq_length: 65536
  enable_dynamic_batch_size: false
  max_tokens_per_mbs: ${runner.seq_length}
  resume_dir: null
  experiment_name: rpent-grpo
  output_dir: ${oc.env:RPENT_RUN_DIR,./logs}
  async_mode: false

algorithm:
  group_size: 8
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null
  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1
  recompute_logprobs: true
  importance_sampling_fix: true
  importance_sampling_clip: 2.0
  shuffle_rollout: false
  loss_type: actor
  loss_agg_func: token-mean
  use_valid_token_scale: true
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: false
  clip_ratio_c: 3.0
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  adv_type: grpo_dynamic
  gamma: 1.0
  gae_lambda: 1.0
  loss_scales:
    - group_level
    - agent_level
    - turn_level
  advantage_mode: trajectory
  normalize_advantages: false
  early_stop_imp_ratio: 5.0
  sampling_params:
    do_sample: true
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 8192
    min_new_tokens: 1
    presence_penalty: 0.0

data:
  type: reasoning
  max_prompt_length: 1792
  rollout_batch_size: 4
  val_rollout_batch_size: null
  num_workers: 0
  prompt_key: prompt
  answer_key: answer
  apply_chat_template: false
  shuffle: true
  validation_shuffle: false
  seed: 1234
  train_data_paths:
    - ${oc.env:RPENT_TRAIN_DATA}
  val_data_paths: null
  sampling_batch_size: 5

tools:
  rpent:
    env_gpus:
      - 3

rollout:
  enforce_eager: false
  record_token_weight_versions: true
  return_logprobs: true
  sglang:
    align_multimodal_inputs: true

reward:
  group_name: RewardGroup
  use_reward_model: false
  reward_type: null
  reward_scale: 1.0
  tokenizer: ${actor.tokenizer}

actor:
  group_name: ActorGroup
  training_backend: megatron
  mcore_gpt: true
  spec_name: decoder_gpt
  enable_dp_load_balance: true
  calculate_flops: false
  seed: 1234
  pack_traj: false
  offload_optimizer: true
  offload_weight: true
  offload_grad: true
  model:
    model_type: qwen3_5
    load_mtp: false
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    attention_backend: flash
    lm_head_chunk_size: 256
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    bf16: true
    fp16: false
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.0
    clip_grad: 1.0
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
    optimizer_cpu_offload: true
    optimizer_offload_fraction: 1.0
  lr_sched:
    lr_warmup_fraction: null
    lr_warmup_init: ${actor.optim.lr}
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: right
  megatron:
    mbridge: true
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 180
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}

rollout_buffer:
  max_inflight_groups: 4
  max_buffered_groups: 8
  max_dropped_groups_per_step: 16

hydra:
  run:
    dir: .
  output_subdir: null

session_server:
  enable: true
  chat_template_kwargs: ${agentloop.chat_template_kwargs}
  minimum_output_tokens: 256
  fold_continuous_turns: true

critic:
  use_critic_model: false
