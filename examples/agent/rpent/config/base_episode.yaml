defaults:
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 2
  component_placement:
    actor: 0-15
    critic: 0-15
    rollout: 0-15
    reward: 0-15
    agentloop: 0-15
runner:
  task_type: reasoning
  synchronous: true
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends:
    - tensorboard
  max_epochs: 10
  max_steps: 3
  val_check_interval: -1
  save_interval: 1
  seq_length: 262144
  enable_dynamic_batch_size: false
  max_tokens_per_mbs: 65536
  resume_dir: null
  experiment_name: rpent-episode-qwen3.5-4b-sync-ppo
  output_dir: ./logs
algorithm:
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null
  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1
  recompute_logprobs: true
  importance_sampling_fix: true
  importance_sampling_clip: 2
  shuffle_rollout: false
  loss_type: actor
  loss_agg_func: token-mean
  use_valid_token_scale: true
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: false
  clip_ratio_c: 3.0
  clip_ratio_low: 0.2
  gamma: 1.0
  gae_lambda: 1.0
  value_cliprange: 0.2
  loss_scales: []
  advantage_mode: trajectory
  normalize_advantages: true
  early_stop_imp_ratio: 5.0
  sampling_params:
    do_sample: true
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 32768
    min_new_tokens: 1
    presence_penalty: 0.0
    min_p: 0.0
data:
  type: reasoning
  max_prompt_length: 1792
  rollout_batch_size: 256
  val_rollout_batch_size: null
  num_workers: 0
  prompt_key: prompt
  answer_key: answer
  apply_chat_template: false
  shuffle: true
  validation_shuffle: false
  seed: 1234
  train_data_paths: ???
  val_data_paths: null
agentloop:
  group_name: AgentLoopGroup
  toolcall_parser: qwen3.5
  agentic_tokenizer: qwen3_5
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
  is_dynamic_rollout_batch: true
  print_outputs: false
  max_turns: 80
  model_request_timeout_s: 3600
  episode_timeout_s: 7200
  minimum_output_tokens: 32768
  merge_prefix_turns: true
  history_compaction:
    max_messages: 80
    keep_messages: 10
    context_window: 262144
    max_fraction: 0.7
    preserve_first_user_message: true
    receipts: false
  max_infra_retries: 1
  max_infra_retry_rate: 1.0
  thinking_token_budget: null
tools:
  rpent:
    python: /opt/venv/reason/bin/python
    libero_type: pro
    max_episode_steps: 10000
    env_gpus:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    episodes_per_worker: 16
    output_dir: ???
    keep_episodes: all
    process_timeout_s: 14400
    max_env_initializations_per_worker: 4
    store_images_on_disk: true
    repo_path: ???
    remote_toolkit_endpoint: ???
    max_actions_per_call: 3
    image_size: 1024
    reasoning_history: -1
    image_history: -1
rollout:
  group_name: RolloutGroup
  gpu_memory_utilization: 0.7
  model:
    model_path: ???
    model_type: qwen3_5
    precision: bf16
  enforce_eager: false
  distributed_executor_backend: mp
  disable_log_stats: false
  detokenize: false
  padding: null
  eos: null
  return_logprobs: true
  replica_affinity: true
  rollout_backend: sglang
  sglang:
    backend_type: server
    enable_weights_cpu_backup: true
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: false
    torch_compile_max_bs: 128
    enable_shared_multi_modal_processor: false
    enable_token_space_preprocess_cache: false
    token_space_preprocess_cache_dir: null
    token_space_preprocess_cache_trust_url: false
    token_space_preprocess_cache_check_rate: 0.0
    context_length: 262144
    mamba_full_memory_ratio: 0.2
    disable_overlap_schedule: true
    enable_custom_logit_processor: false
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_running_requests: 128
  cuda_graph_max_bs: 4
  validate_weight: false
  validate_weight_first_sync: true
  validate_save_dir: null
  print_outputs: false
  env_vars:
    SGLANG_EXTERNAL_MM_PROCESSOR_PACKAGE: rlinf.hybrid_engines.sglang.multimodal
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
    NCCL_MAX_CTAS: '8'
reward:
  group_name: RewardGroup
  use_reward_model: false
  reward_type: math
  reward_scale: 1.0
  tokenizer:
    tokenizer_model: ${actor.tokenizer.tokenizer_model}
    use_fast: false
    trust_remote_code: true
    padding_side: right
actor:
  group_name: ActorGroup
  training_backend: megatron
  mcore_gpt: true
  spec_name: decoder_gpt
  enable_dp_load_balance: true
  calculate_flops: false
  seed: 1234
  pack_traj: false
  offload_optimizer: true
  offload_weight: true
  offload_grad: true
  response_only_logits: true
  model:
    model_type: qwen3_5
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    attention_backend: flash
    load_mtp: false
    lm_head_chunk_size: 0
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    bf16: true
    fp16: false
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.0
    clip_grad: 1.0
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: right
  megatron:
    mbridge: true
    empty_cache_after_backward: true
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 180
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      model: Qwen3.5-4B
      hf_model_path: ${rollout.model.model_path}
  multimodal: {}
  expect_multi_modal_inputs: true
  trim_right_padding: true
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NCCL_MAX_CTAS: '8'
critic:
  value_head_init: normal
  group_name: CriticGroup
  training_backend: megatron
  mcore_gpt: true
  spec_name: decoder_gpt
  enable_dp_load_balance: true
  seed: 1234
  offload_optimizer: true
  offload_weight: true
  offload_grad: true
  model:
    model_type: qwen3_5
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    attention_backend: flash
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    bf16: true
    fp16: false
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.0
    clip_grad: 1.0
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 5.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: right
  megatron:
    mbridge: true
    empty_cache_after_backward: true
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 180
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      model: Qwen3.5-4B
      hf_model_path: ${rollout.model.model_path}
  multimodal: {}
  trim_right_padding: true
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    NCCL_MAX_CTAS: '8'
  update_epochs: 1
