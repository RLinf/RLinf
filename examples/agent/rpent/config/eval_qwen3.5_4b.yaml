defaults:
  - base_rpent
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    rollout,reward: '0'
    agentloop: '1'

runner:
  task_type: reasoning_eval
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends:
      - tensorboard
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  seq_length: 65536
  enable_dynamic_batch_size: false
  max_tokens_per_mbs: ${runner.seq_length}
  resume_dir: null
  experiment_name: rpent-eval
  output_dir: ${oc.env:RPENT_RUN_DIR,./logs}

algorithm:
  group_size: 1
  sampling_params:
    do_sample: true
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    repetition_penalty: 1.0
    max_new_tokens: 8192
    min_new_tokens: 1
    presence_penalty: 0.0
  val_rollout_batch_size_per_gpu: 1

data:
  type: reasoning
  max_prompt_length: 1792
  val_rollout_batch_size: 1
  num_workers: 0
  prompt_key: prompt
  answer_key: answer
  apply_chat_template: false
  validation_shuffle: false
  seed: 1234
  val_data_paths:
    - ${oc.env:RPENT_EVAL_DATA}

tools:
  rpent:
    env_gpus:
      - 1

rollout:
  enforce_eager: true
  return_logprobs: false
  sglang:
    capture_multi_modal_inputs: false
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
