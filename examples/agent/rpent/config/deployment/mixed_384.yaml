# Run the paired RPent deployment-384.yaml on all service nodes first.
runner:
  output_dir: /work/runs/mixed384
  experiment_name: grpo
  save_interval: 5

data:
  train_data_paths: null
  rollout_batch_size: 32
  sampling_batch_size: 48

agentloop:
  max_turns: 40

rollout:
  model:
    model_path: /work/models/checkpoint-216

tools:
  rpent:
    repo_path: /work/RPent
    python: /opt/venv/reason/bin/python
    output_dir: /work/runs/mixed384/episodes
    remote_toolkit_endpoint: null
    episodes_per_worker: 16
    max_env_initializations_per_worker: 8
    full_cohort_ready_timeout_s: 1800

env:
  rpent:
    libero:
      endpoint: http://10.23.0.11:29840
      train_data_paths: [/work/data/tasks/libero.jsonl]
      group_router: true
      rollout_episodes: 128
      sampling_episodes: 192
    robotwin:
      endpoint: http://10.23.0.11:29841
      train_data_paths: [/work/data/tasks/robotwin.jsonl]
      group_router: true
      rollout_episodes: 128
      sampling_episodes: 192
