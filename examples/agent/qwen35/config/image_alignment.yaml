hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    critic: ${cluster.component_placement.actor}
    rollout: ${cluster.component_placement.actor}
    reward: ${cluster.component_placement.actor}

runner:
  task_type: reasoning
  synchronous: true
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  val_check_interval: 25
  save_interval: 25
  seq_length: 512
  enable_dynamic_batch_size: true
  max_tokens_per_mbs: 1024
  resume_dir: null
  experiment_name: qwen35-image-alignment-check
  output_dir: ./logs

algorithm:
  group_size: 1
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null
  logprob_forward_micro_batch_size: 2
  recompute_logprobs: false
  shuffle_rollout: false
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: false
  clip_ratio_c: null
  clip_ratio_low: null
  clip_ratio_high: null
  adv_type: gae_dynamic
  gamma: 1.0
  gae_lambda: 1.0
  value_cliprange: 0.5
  loss_scales: []
  normalize_advantages: true
  early_stop_imp_ratio: null
  use_valid_token_scale: false
  sampling_params:
    do_sample: false
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    max_new_tokens: 1

data:
  type: math
  max_prompt_length: 480
  rollout_batch_size: 4

agentloop:
  is_dynamic_rollout_batch: true

session_server:
  enable: false

rollout:
  group_name: "RolloutGroup"
  gpu_memory_utilization: 0.45
  model:
    model_path: null
    model_type: qwen3_5
    precision: ${actor.model.precision}
  enforce_eager: true
  distributed_executor_backend: mp
  disable_log_stats: false
  detokenize: false
  padding: null
  eos: null
  return_logprobs: true
  rollout_backend: sglang
  sglang:
    backend_type: server
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: false
    torch_compile_max_bs: 16
    align_multimodal_inputs: true
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_running_requests: 16
  cuda_graph_max_bs: 16

reward:
  use_reward_model: false
  reward_type: null  # This check supplies fixed training targets.

actor:
  group_name: "ActorGroup"
  training_backend: megatron
  enable_dp_load_balance: true
  calculate_flops: false
  seed: 1234
  pack_traj: true
  mcore_gpt: true
  spec_name: decoder_gpt
  offload_weight: false
  offload_optimizer: false
  offload_grad: false
  model:
    model_type: qwen3_5
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    load_mtp: false
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    attention_backend: flash
    recompute_method: null
    recompute_granularity: null
    recompute_num_layers: null
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    # Vision encoder and projector stay frozen during this language-model update check.
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    min_lr: 0.0
    weight_decay: 0.01
    clip_grad: 0.8
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
    bf16: true
    fp16: false
    optimizer_cpu_offload: true
    optimizer_offload_fraction: 1.0
  lr_sched:
    lr_warmup_fraction: null
    lr_warmup_init: 1.0e-6
    lr_warmup_iters: 0
    max_lr: 1.0e-6
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: "right"
  megatron:
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    mbridge: true
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}

critic:
  use_critic_model: true
  value_head_init: normal
  group_name: "CriticGroup"
  training_backend: megatron
  enable_dp_load_balance: true
  seed: 1234
  spec_name: decoder_gpt
  offload_weight: false
  offload_optimizer: false
  offload_grad: false
  model:
    model_type: qwen3_5
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    attention_backend: flash
    recompute_method: null
    recompute_granularity: null
    recompute_num_layers: null
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    # Vision encoder and projector stay frozen during this value-head update check.
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    min_lr: 0.0
    weight_decay: 0.01
    clip_grad: 0.8
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
    bf16: true
    fp16: false
    optimizer_cpu_offload: true
    optimizer_offload_fraction: 1.0
  lr_sched:
    lr_warmup_fraction: null
    lr_warmup_init: 1.0e-6
    lr_warmup_iters: 0
    max_lr: 1.0e-6
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: "right"
  megatron:
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    mbridge: true
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}
