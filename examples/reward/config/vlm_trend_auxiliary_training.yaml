defaults:
  - reward_training
  - _self_

auxiliary:
  stage: teacher  # teacher or scalar_head

  teacher:
    raw_data_paths: []
    output_dir: logs/vlm_trend_state_teacher
    history_size: 5
    gamma: 0.97
    target_mode: discounted_success
    val_split: 0.1
    max_episodes: null
    hidden_dim: 256
    num_layers: 3
    dropout: 0.05
    batch_size: 8192
    epochs: 10
    max_steps: 3000
    eval_interval: 200
    lr: 3.0e-4
    weight_decay: 1.0e-4
    clip_grad: 1.0
    num_workers: 4
    device: cuda
    seed: 42

  scalar_head:
    train_pattern: logs/vlm_trend_features/train_potential_*.pt
    eval_pattern: logs/vlm_trend_features/eval_potential_*.pt
    train_progress_pattern: logs/vlm_trend_features/train_progress_*.pt
    progress_pattern: logs/vlm_trend_features/eval_progress_*.pt
    output_dir: logs/vlm_trend_scalar_head
    hidden_dim: 512
    dropout: 0.1
    batch_size: 256
    eval_batch_size: 1024
    epochs: 100
    eval_interval: 5
    lr: 3.0e-4
    weight_decay: 1.0e-3
    clip_grad: 1.0
    rank_weight: 0.2
    rank_min_gap: 0.1
    delta_weight: 10.0
    delta_beta: 0.03
    local_rank_weight: 0.2
    local_rank_min_gap: 0.01
    device: cuda:0
    seed: 42

