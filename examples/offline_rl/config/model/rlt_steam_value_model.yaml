model_type: "steam_value_model"
backbone_type: "rlt_stage1"
precision: fp32
is_lora: false

# Frozen RLT Stage 1 features consumed by the lightweight temporal critic.
z_dim: 2048
proprio_dim: 9
fusion_hidden_dim: 512
dropout: 0.1

# Four 10-step gaps in each direction map to eight signed progress bins.
label_smoothing: 0.05
num_bins: 8
stride_k: null
ensemble_size: 3
ensemble_head_seed_base: null

use_gradient_checkpointing: false

# Optional: trained RLT STEAM critic checkpoint.
# model_path: "/path/to/rlt_steam_value_model/checkpoints/global_step_N/actor"
