defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout,reward: all

runner:
  task_type: reasoning
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 5
  max_steps: -1

  val_check_interval: 10
  save_interval: 50

  seq_length: 8192

  enable_dynamic_batch_size: True
  max_tokens_per_mbs: 8192

  resume_dir: null
  experiment_name: grpo-moonlight-16b
  output_dir: ../results

algorithm:
  group_size: 8

  n_minibatches: 4
  training_batch_size_per_gpu: 1 # micro batch size
  rollout_batch_size_per_gpu: null # If set to null, rollout_batch_size will be evenly divided across all inference instances.

  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 4

  recompute_logprobs: True
  shuffle_rollout: True

  # GRPO loss params
  loss_type: actor
  loss_agg_func: "token-mean" # per-token loss
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: False
  clip_ratio_high: 0.28 # asymmetric eps-clip high
  clip_ratio_c: null # dual clip disabled

  adv_type: grpo
  normalize_advantages: True
  early_stop_imp_ratio: 1000000000.0 # disabled
  use_valid_token_scale: False

  sampling_params:
    do_sample: True
    temperature: 1.0
    top_k: 1000000
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 4096
    min_new_tokens: 1

rollout:
  group_name: "RolloutGroup"

  gpu_memory_utilization: 0.55 # collocated, leave room for actor

  model:
    model_path: /path/to/model/Moonlight-16B-A3B-Instruct/ # https://huggingface.co/moonshotai/Moonlight-16B-A3B-Instruct
    model_type: deepseek_v3
    precision: ${actor.model.precision}
  enforce_eager: False # sync weight reload requires cuda graph
  distributed_executor_backend: mp
  disable_log_stats: False
  detokenize: False
  padding: null
  eos: null

  rollout_backend: sglang

  sglang:
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: False
    torch_compile_max_bs: 128
    enable_ep_moe: true # expert-parallel rollout (SGLang forces ep_size == tp_size)

  vllm:
    attention_backend: FLASH_ATTN
    enable_chunked_prefill: True
    enable_prefix_caching: True
    enable_flash_infer_sampler: True
    max_num_batched_tokens: null
    torch_profiler_dir: null

  return_logprobs: ${not:${algorithm.recompute_logprobs}}

  weight_reload: sync # required for megatron-bridge models
  tensor_parallel_size: 8
  pipeline_parallel_size: 1

  validate_weight: False
  validate_save_dir: null
  print_outputs: False

  max_running_requests: 64
  cuda_graph_max_bs: 128

data:
  type: math
  dataset_name: boba
  max_prompt_length: 4096
  filter_prompt_by_length: False
  rollout_batch_size: 128
  val_rollout_batch_size: null
  num_workers: 2
  prompt_key: prompt
  answer_key: solutions
  apply_chat_template: True
  shuffle: True
  validation_shuffle: True
  seed: 42
  train_data_paths: ["/dataset/boba/AReaL-boba-106k.jsonl"]
  val_data_paths: ["/dataset/boba/AReaL-boba-106k.jsonl"]

actor:
  group_name: "ActorGroup"
  training_backend: megatron
  mcore_gpt: True
  spec_name: decoder_gpt

  offload_optimizer: True
  offload_weight: True
  offload_grad: True

  enable_dp_load_balance: True
  calculate_flops: False
  seed: 42

  model:
    megatron_checkpoint: null
    model_type: deepseek_v3
    precision: bf16
    add_bias_linear: False

    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    moe_grouped_gemm: te

    multi_latent_attention: True # DeepseekV3 MLA

    activation: swiglu
    sequence_parallel: True

    recompute_method: uniform
    recompute_granularity: full
    recompute_num_layers: 1

    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}

    normalization: rmsnorm
    position_embedding_type: rope
    apply_rope_fusion: False
    bias_dropout_fusion: False
    persist_layer_norm: False
    bias_activation_fusion: True
    attention_softmax_in_fp32: True
    batch_p2p_comm: False
    variable_seq_lengths: True
    gradient_accumulation_fusion: False # requires APEX, RLinf ships TE not APEX
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: False

    # MoE related
    moe_router_load_balancing_type: "aux_loss"
    init_method_std: 0.008
    moe_router_topk: 6 # Moonlight num_experts_per_tok
    moe_router_pre_softmax: False
    moe_aux_loss_coeff: 0.0 # override bridge hardcoded 0.0001 (suspected typo)
    moe_router_bias_update_rate: 0 # override bridge default 0.001

  optim:
    optimizer: adam
    bf16: False # bf16 master via precision_aware, not fp16
    fp16: False
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-8
    min_lr: 0.0
    weight_decay: 0.1
    use_distributed_optimizer: True
    overlap_grad_reduce: True
    overlap_param_gather: True
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: False
    optimizer_cpu_offload: True
    use_precision_aware_optimizer: True # precision-aware optimizer (Float8 master)
    clip_grad: 1.0
    loss_scale: 65536

  lr_sched:
    lr_warmup_fraction: 0.01
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-6
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10

  tokenizer:
    tokenizer_model: /path/to/model/Moonlight-16B-A3B-Instruct/
    use_fast: False
    trust_remote_code: True
    padding_side: 'right'

  megatron:
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: False
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: True
    use_profiler: False
    mbridge: True # use Megatron-Bridge for HF->Megatron weight conversion
    accumulate_allreduce_grads_in_fp32: True

    ckpt_convertor:
      model: Moonlight-16B-A3B-Instruct
      hf_model_path: ${rollout.model.model_path}
      save_path: ${runner.output_dir}/${runner.experiment_name}/converted_ckpts/actor
      use_gpu_num: 0
      use_gpu_index: null
      process_num: 8
      tensor_model_parallel_size: ${actor.model.tensor_model_parallel_size}
      pipeline_model_parallel_size: ${actor.model.pipeline_model_parallel_size}
      expert_model_parallel_size: ${actor.model.expert_model_parallel_size}
      expert_tensor_parallel_size: ${actor.model.expert_tensor_parallel_size}
      grouped_gemm: ${actor.model.moe_grouped_gemm}
      te_ln_linear_qkv: True
      te_ln_linear_mlp_fc1: True
      te_ln_add_extra_state: 'tensor_pickle_none'

    profiler:
      output_dir: ${runner.output_dir}/${runner.experiment_name}/profiler
      activities: ["cpu", "cuda"]
      record_shapes: False
      profile_memory: False
      with_stack: False
      with_flops: False
      with_modules: True
      export_tensorboard: True
      export_chrome_trace: False
      chrome_filename_prefix: "chrome_trace"
      schedule_warmup: 2
      schedule_active: 1
      schedule_repeat: 1

reward:
  group_name: "RewardGroup"
  use_reward_model: false
  reward_type: 'math'
  reward_scale: 5.0

  tokenizer:
    tokenizer_model: ${actor.tokenizer.tokenizer_model}
    use_fast: ${actor.tokenizer.use_fast}
    trust_remote_code: ${actor.tokenizer.trust_remote_code}
    padding_side: ${actor.tokenizer.padding_side}

critic:
  use_critic_model: false
