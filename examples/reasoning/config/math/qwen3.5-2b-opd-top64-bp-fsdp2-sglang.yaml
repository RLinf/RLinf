defaults:
  - qwen2.5-1.5b-opd-fsdp
  - _self_

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout,reward: 4
    teacher_default: 2-3

runner:
  execution_mode: sync
  experiment_name: qwen3.5-2b-opd-top64-bp
  output_dir: ./logs
  logger:
    project_name: qwen3_5_dapo_opd
  max_epochs: 1
  max_steps: 160
  save_interval: 40
  resume_dir: null
  seq_length: 10240
  enable_dynamic_batch_size: false
  max_tokens_per_mbs: 10240
  val_check_interval: -1

algorithm:
  group_size: 1
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  logprob_forward_micro_batch_size: 1
  recompute_logprobs: false
  shuffle_rollout: false
  loss_agg_func: token-mean
  sampling_params:
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    repetition_penalty: 1.0
    max_new_tokens: 8192

data:
  dataset_name: dapo
  max_prompt_length: 2048
  rollout_batch_size: 96
  num_workers: 8
  shuffle: false
  validation_shuffle: false
  seed: 42
  train_data_paths:
    - /mnt/public2/suheng/data/trainset/DAPO-Math-17k/data/DAPO-17K.jsonl
  val_data_paths: null
  prompt_key: prompt
  answer_key: reward_model
  apply_chat_template: true

rollout:
  rollout_backend: sglang
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.5
  max_model_len: 10241
  max_running_requests: 4
  cuda_graph_max_bs: 4
  enforce_eager: false
  return_logprobs: true
  seed: 42
  sglang:
    attention_backend: flashinfer
    use_torch_compile: false
  model:
    model_type: qwen3_5
    model_path: /mnt/public2/suheng/models/Qwen3.5-2B
    precision: bf16

actor:
  training_backend: fsdp
  enable_offload: true
  global_batch_size: 96
  micro_batch_size: 1
  seed: 42
  model:
    model_type: qwen3_5
    model_path: /mnt/public2/suheng/models/Qwen3.5-2B
    precision: fp32
    seq_length: 10240
    encoder_seq_length: 10240
    variable_seq_lengths: true
  tokenizer:
    tokenizer_model: /mnt/public2/suheng/models/Qwen3.5-2B
    use_fast: true
  optim:
    optimizer: adamw
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 0
    lr_warmup_steps_ratio: 0.0
    total_training_steps: 160
  lr_sched:
    max_lr: 1.0e-6
    lr_warmup_fraction: 0.0
    lr_warmup_iters: 0
  fsdp_config:
    strategy: fsdp2
    cpu_offload: false
    reshard_after_forward: true
    enable_gradient_accumulation: false
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
    grad_scaler:
      enabled: false

distillation:
  enabled: true
  teacher_models:
    default:
      model_path: /mnt/public2/suheng/models/Qwen3.5-35B-A3B
      num_replicas: 1
      inference:
        backend: sglang
        tensor_parallel_size: 2
        pipeline_parallel_size: 1
        max_model_len: 10241
        max_concurrency: 1
        engine_kwargs:
          mem_fraction_static: 0.80
          random_seed: 42
          dtype: bfloat16
          attention_backend: flashinfer
          chunked_prefill_size: 2048
          max_prefill_tokens: 2048
          max_running_requests: 1
          disable_cuda_graph: true
          skip_tokenizer_init: true
  distillation_loss:
    loss_mode: forward_kl_topk
    topk_source: teacher
    topk: 64
    use_policy_gradient: false
    use_task_rewards: false
    distillation_loss_coef: 1.0
    policy_loss_mode: vanilla
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0
    loss_max_clamp: null
    log_prob_min_clamp: null
