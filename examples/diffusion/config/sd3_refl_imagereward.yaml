defaults:
  - env/image_reward@env.train
  - env/image_reward@env.eval
  - model/sd3@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:DIFFUSION_PATH}/config/
    - file://${oc.env:REPO_PATH}/examples/embodiment/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sd3_refl_imagereward"
    logger_backends: ["tensorboard"]
  max_epochs: 40
  max_steps: -1
  only_eval: False
  val_check_interval: 5
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  kl_penalty_type: kl

  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: raw
  loss_type: embodied_refl
  loss_agg_func: "token-mean"

  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.0001
  clip_ratio_low: 0.0001
  clip_ratio_c: null
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: False

  refl_margin: 2.0
  refl_grad_scale: 1.0e-3
  # 0 trains on Lreward alone. Set it above 0 to enable the pre-training step.
  refl_pre_loss_weight: 0.0
  # rollout: stored late latents. resample: x0 re-noised to a late t.
  refl_xt_source: rollout

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    total_num_envs: 128
    group_size: ${algorithm.group_size}
    max_episode_steps: 1
    max_steps_per_rollout_epoch: 1
    rollout_epoch: 4
    dataset:
      type: "visual.prompt_dataset"
      # data/refl_data.json from https://github.com/zai-org/ImageReward.
      path: /path/to/ImageReward/data/refl_data.json
      exclude_path: /path/to/ImageReward/data/test.json
    reward:
      type: "single"
      model: "visual.image_reward"
      key: "avg"
      use_gpu: True
      batch_size: 32
      model_path: ${actor.refl_reward_model.model_path}
      med_config: ${actor.refl_reward_model.med_config}
      precision: ${actor.refl_reward_model.precision}
  eval:
    total_num_envs: 128
    group_size: 1
    max_episode_steps: 1
    max_steps_per_rollout_epoch: 1
    is_eval: True
    sequential_eval: True
    rollout_epoch: 4
    dataset:
      type: "visual.prompt_dataset"
      # data/test.json from https://github.com/zai-org/ImageReward.
      path: /path/to/ImageReward/data/test.json
    reward:
      type: "single"
      model: "visual.image_reward"
      key: "avg"
      use_gpu: True
      batch_size: 32
      model_path: ${actor.refl_reward_model.model_path}
      med_config: ${actor.refl_reward_model.med_config}
      precision: ${actor.refl_reward_model.precision}

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  collect_prev_infos: True
  collect_final_values: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    sd3:
      # Guidance 1.0 keeps training rollouts on the conditional branch while
      # evaluation samples with real CFG.
      cfg: True
      guidance_scale: 1.0
      eval_guidance_scale: 4.5

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 64
  seed: 42
  enable_offload: False

  refl_reward_model:
    # ImageReward.pt and med_config.json from https://huggingface.co/THUDM/ImageReward.
    model_path: /path/to/ImageReward/ImageReward.pt
    med_config: /path/to/ImageReward/med_config.json
    precision: "bf16"

  # Read only when algorithm.refl_pre_loss_weight is above 0.
  refl_pre_data:
    type: "visual.image_text_dataset"
    # img2dataset `files` output: every image has a sibling .txt caption.
    path: /path/to/image_text_dataset
    resolution: 512
    caption_prefix: "The image shows "
    num_workers: 4

  model:
    # Download from https://huggingface.co/stabilityai/stable-diffusion-3.5-medium.
    model_path: /path/to/stable-diffusion-3.5-medium
    precision: "bf16"
    sd3:
      rl_mode: refl
      refl_late_fraction: 0.25
      reward_tokenizer_path: bert-base-uncased
      reward_max_tokens: 35
      resolution: 512
      num_steps: 10
      eval_num_steps: 40
      timestep_fraction: 0.99
      guidance_scale: 1.0
      eval_guidance_scale: 1.0
      cfg: False
      noise_level: 0.7
      eval_noise_level: 0.0
      train_sampler: dpm2
      eval_sampler: ode
      max_sequence_length: 128
      output_type: "pt"
      use_lora: True
      lora_rank: 32
      lora_alpha: 64
      lora_path: null
      offload_auxiliary_modules: False

  optim:
    lr: 1.0e-4
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 1.0e-4
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    enable_gradient_accumulation: True
    reshard_after_forward: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
