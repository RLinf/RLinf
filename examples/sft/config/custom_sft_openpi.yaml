defaults:
  - model/pi0@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "test_openpi"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: -1
  max_steps: 1000
  val_check_interval: -1
  save_interval: 10

data:
  train_data_paths: "/path/to/custom-data"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 0

  # Override the default values in model/pi0
  model:
    precision: fp32
    model_path: "/path/to/pi0-model"
    num_action_chunks: 4 # env-executed length, not network horizon
    add_value_head: False
    openpi:
      task: sft
      embed_dtype: bf16
      config_name: "pi0_custom"
      detach_critic_input: True

  optim:
    lr: 7.91e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    wrappers:
      state_projection:
        module_names: [state_proj]
    mixed_precision_rules:
      state_projection: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32