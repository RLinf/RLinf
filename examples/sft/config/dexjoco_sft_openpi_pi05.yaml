defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dexjoco_sft_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: "/path/to/dexjoco/dexjoco_lerobot_datasets/water_plant"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 0

  model:
    precision: fp32
    # Download JAX base: https://huggingface.co/DexJoCo/DexJoCo-Pi05/tree/main/pi05_base
    # Convert with jax_to_openpi; model_path must point to the local output
    # directory containing RLinf OpenPI model.safetensors.
    # Download/conversion steps: docs/source-en/rst_source/examples/embodied/dexjoco.rst
    model_path: "/path/to/pi05_base_openpi"
    num_action_chunks: 30
    action_dim: 22
    openpi:
      embed_dtype: bf16
      task: sft
      config_name: "pi05_dexjoco"
      num_images_in_input: 2
    openpi_data:
      norm_stats_path: "/path/to/dexjoco/dexjoco_lerobot_datasets/water_plant/norm_stats.json"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
