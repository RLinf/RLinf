model_type: lingbotvlav2
model_path: ${oc.env:LINGBOT_VLA_V2_CHECKPOINT}
tokenizer_path: ${oc.env:QWEN3VL_PATH}
precision: bf16
num_action_chunks: 50
action_dim: 14
num_steps: 10
noise_level: 0.5
forward_micro_batch_size: 1
is_lora: false
add_value_head: false
attn_implementation: flash_attention_2
moe_implementation: fused

lingbotvlav2:
  config_path: ${oc.env:LINGBOT_VLA_V2_PATH}
  training_config_path: ${oc.env:LINGBOT_VLA_V2_MODEL_ROOT}/lingbotvla_cli.yaml
  robot_config_path: ${oc.env:LINGBOT_VLA_V2_PATH}/configs/robot_configs/robotwin.yaml
  robot_config_root: ${oc.env:LINGBOT_VLA_V2_PATH}/configs/robot_configs
  stats_path: ${oc.env:LINGBOT_VLA_V2_PATH}/assets/norm_stats/robotwin.json
  attention_implementation: flex
  data_name: robotwin
  chunk_size: ${..num_action_chunks}
  use_auxiliary_alignment: false
