# FastWAM SFT model config.
#
# This follows the official LIBERO SFT recipe: load the pretrained Wan2.2 video
# DiT, initialize ActionDiT from the official interpolated backbone payload, and
# train only FastWAM's MoT (model.dit alias) plus the proprio encoder.
model_type: "fastwam"
precision: bf16
# Required by rlinf get_model dispatcher; FastWAM is not loaded via LoRA.
is_lora: false
# Official training starts from the Wan2.2 base model. Set this explicitly to a
# released FastWAM checkpoint only when intentionally reproducing checkpoint
# fine-tuning rather than the official base-model SFT recipe.
model_path: null
# huggingface-cli download yuanty/fastwam \
#   libero_uncond_2cam224_dataset_stats.json --local-dir /your_path_to/fastwam
dataset_stats_path: /your_path_to/fastwam/libero_uncond_2cam224_dataset_stats.json

# Only MoT experts (+ proprio encoder) are trainable.
freeze_non_dit: true

fastwam:
  config_dir: null
  config_name: sim_libero
  overrides:
    # The official training task loads pretrained Wan2.2 + ActionDiT weights.
    - model.skip_dit_load_from_pretrain=false
    # Generate this file with FastWAM's scripts/preprocess_action_dit_backbone.py.
    - model.action_dit_pretrained_path=/your_path_to/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
    - model.mot_checkpoint_mixed_attn=false
    # Training reads cached text embeddings, so the model itself need not load T5.
    - model.load_text_encoder=false
    # Use the same converted common-file redirect as the official model config.
    - model.redirect_common_files=true
