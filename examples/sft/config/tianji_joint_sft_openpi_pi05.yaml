# Tianji 16D Joint Pi0.5 SFT (60-step horizon @ 30 Hz = 2.0 s chunks).
#
# Quickstart:
#   1. Compute quantile norm_stats on the exported LeRobot dataset:
#      python toolkits/lerobot/calculate_norm_stats.py \
#        --config_name tianji_stage1_joint_h60 \
#        --repo_id /path/to/tianji_lerobot_dataset
#   2. Launch SFT (override paths via env vars or Hydra CLI):
#      TIANJI_SFT_DATA_PATH=/path/to/tianji_lerobot_dataset \
#      TIANJI_PI05_BASE_PATH=/path/to/pi05_base_openpi \
#      TIANJI_SFT_NORM_STATS_PATH=/path/to/tianji_lerobot_dataset/norm_stats.json \
#      bash examples/sft/run_vla_sft.sh tianji_joint_sft_openpi_pi05
#   3. Export SFT weights -> OpenPI safetensors + norm_stats.json:
#      python -m rlinf.utils.ckpt_convertor.openpi.convert --mode sft_to_openpi \
#        --config-name tianji_stage1_joint_h60 --dtype bf16 \
#        --ckpt /path/to/checkpoints/global_step_N \
#        --input-norm-stats /path/to/tianji_lerobot_dataset/norm_stats.json \
#        --output-model /path/to/exported_tianji_pi05 \
#        --output-norm-stats /path/to/exported_tianji_pi05/norm_stats.json

defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "tianji_joint_sft_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  # Local LeRobot dataset root (must contain data/ and meta/).
  # Override via TIANJI_SFT_DATA_PATH or CLI: data.train_data_paths=/path/to/data
  train_data_paths: ${oc.env:TIANJI_SFT_DATA_PATH,/path/to/tianji_lerobot_dataset}
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 42

  model:
    precision: fp32
    model_type: "openpi"
    pi05: True
    is_lora: False
    # Convert official JAX pi05_base via `convert --mode jax_to_openpi`;
    # model_path must point to the directory containing model.safetensors.
    model_path: ${oc.env:TIANJI_PI05_BASE_PATH,/path/to/pi05_base_openpi}
    num_action_chunks: 60
    action_dim: 16
    add_value_head: False
    num_steps: 4
    openpi_data:
      # Used as OpenPI's norm-stats asset id.
      repo_id: "tianji_stage1_joint_h60"
      norm_stats_path: ${oc.env:TIANJI_SFT_NORM_STATS_PATH,/path/to/tianji_lerobot_dataset/norm_stats.json}

    openpi:
      embed_dtype: bf16
      task: sft
      config_name: "tianji_stage1_joint_h60"
      num_images_in_input: 3
      train_expert_only: False
      # Network prediction horizon (Pi0Config.action_horizon). Must match
      # TrainConfig for config_name tianji_stage1_joint_h60.
      action_horizon: 60
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True

      # Set use_rlt: True (plus rlt_* below and fsdp_config rlt_features fp32
      # rules from realworld_rlt_stage1_sft_openpi_pi05.yaml) when training
      # Stage1 jointly for RLinf Stage2 RLT residual RL:
      #   noise_method: "flow_noise"
      #   noise_params: [0.16, 0.12, 200]
      #   joint_logprob: True
      #   detach_critic_input: True
      #   rlt_alpha: 1.0
      #   rlt_prefix_seq_len: 1024
      #   rlt_image_only: False
      #   rlt_use_mask: True
      use_rlt: False

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    # If use_rlt: True is enabled above, also add:
    # wrappers:
    #   rlt_features:
    #     module_names: [rlt_module]
    #     wrap_mode: subtree
    # mixed_precision_rules:
    #   rlt_features: fp32
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
