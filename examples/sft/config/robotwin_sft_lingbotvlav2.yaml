defaults:
  - model/lingbotvlav2@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:LINGBOT_VLA_SFT_OUTPUT,../results}
    project_name: rlinf
    experiment_name: robotwin_sft_lingbotvlav2
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  train_data_paths: ${oc.env:LINGBOT_VLA_SFT_DATASET}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 1234
  enable_offload: false

  fsdp_config:
    strategy: fsdp2
    use_orig_params: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
      cast_forward_inputs: false

  optim:
    lr: 1.0e-5
    clip_grad: 1.0
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr_rate: 0.1
