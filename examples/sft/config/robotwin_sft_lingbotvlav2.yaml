# 4 卡版 SFT（官方 8 卡 → 本机 4 卡：global_batch 8→4）
defaults:
  - model/lingbotvlav2@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3     # 4 卡（官方为 0-7）

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:LINGBOT_VLA_SFT_OUTPUT,/mnt/public/zhangyuzhuo/results}
    project_name: rlinf
    experiment_name: robotwin_sft_lingbotvlav2
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  train_data_paths: ${oc.env:LINGBOT_VLA_SFT_DATASET}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 4        # 官方 8；4 卡减半
  seed: 1234
  enable_offload: false

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
