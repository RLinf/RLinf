defaults:
  - model/pi0_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_pi0_openpi_rlinf_sft"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: "/path/to/robotwin-data"
  # Passed to openpi.training.data_loader; all dataset semantics (including
  # action timestamps) stay in the official OpenPI configuration.
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 32
  seed: 0

  model:
    precision: fp32
    model_path: "/path/to/pi0_base_pytorch_new"
    num_action_chunks: 50 # interface for the env
    action_dim: 14
    add_value_head: False
    openpi:
      config_name: "pi0_aloha_robotwin"
      # The JAX-to-new conversion copies norm_stats.json here. Override these
      # two fields when the statistics are stored outside model_path.
      assets_dir: ${actor.model.model_path}
      asset_id: "physical-intelligence/robotwin/adjust_bottle"
      num_images_in_input: 3
    # Explicitly select this task's statistics for the official OpenPI loader.
    # Override ``openpi.asset_id`` for other RoboTwin tasks.
    openpi_data:
      norm_stats_path: ${actor.model.openpi.assets_dir}/${actor.model.openpi.asset_id}/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      # fp32 is the SFT master-weight dtype; bf16 is the compute dtype.
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
