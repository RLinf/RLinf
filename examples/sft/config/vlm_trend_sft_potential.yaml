defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"]
  # Dual-line Success dense potential LoRA recipe
  # (former run_train_dense_potential_vlm.sh). For the single-line Trend
  # reward (docs §2.3), use vlm_trend_sft_reward.yaml instead.
  max_epochs: 400
  max_steps: 400
  val_check_interval: 100
  save_interval: 100
  experiment_name: vlm_trend_potential_sft
  output_dir: ${oc.env:OUTPUT_ROOT,logs/vlm_trend_dense_potential_sft}
  resume_dir: null
  per_worker_log: true

# Build data with preprocess_vlm_trend_state_value_potential_dataset.py and
# point VLM_TREND_REWARD_DATA_ROOT to that output root.
# Requires VLM_TREND_REWARD_DATA_ROOT; set VLM_MODEL_PATH (and optionally OUTPUT_ROOT).
data:
  type: vlm
  dataset_name: "vlm_trend_reward_sft"
  apply_chat_template: true
  use_chat_template: true
  train_data_paths: "${oc.env:VLM_TREND_REWARD_DATA_ROOT}/train/segments.jsonl"
  val_data_paths: "${oc.env:VLM_TREND_REWARD_DATA_ROOT}/eval/segments.jsonl"
  video_root: "${oc.env:VLM_TREND_REWARD_DATA_ROOT}"
  data_root: "${oc.env:VLM_TREND_REWARD_DATA_ROOT}"
  prompt_key: "prompt"
  answer_key: "answer"
  image_keys: []
  max_prompt_length: 4096
  lazy_loading: true
  num_workers: 32
  video_nframes: 5
  video_fps: null
  video_max_pixels: 200704
  shuffle: true
  seed: 42

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  eval_batch_size: 16
  global_batch_size: 256
  seed: 42

  model:
    model_type: qwen3_vl
    precision: bf16
    model_path: ${oc.env:VLM_MODEL_PATH}
    attn_implementation: flash_attention_2
    is_lora: true
    lora_rank: 16
    format_ce_coef: 2.0
    trainable_modules:
      - model.visual.merger
      - model.visual.deepstack_merger_list
      - model.language_model
      - lm_head
    sample_reweight:
      enabled: true
      target_label_ratio:
        positive: 1.0
        negative: 1.0
        unclear: 1.0
      success_weight: 1.0
      non_success_weight: 1.0
      use_meta_sample_weight: false
    success_head:
      enabled: false
    extra_label_loss:
      enabled: false

  optim:
    lr: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: cosine
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 20

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null

reward:
  use_reward_model: false

critic:
  use_critic_model: false
