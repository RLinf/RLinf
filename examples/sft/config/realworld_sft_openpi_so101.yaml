defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# SO-101 joint-space SFT on the OpenPI Pi0.5 path. The custom LeRobot
# loader handles sampling and collation; model-facing transforms come from the
# canonical RLinf pi05_so101_joint data config.
#
# Replace the path and repository placeholders below before launching. When
# train_data_paths points directly at a dataset, repo_id may remain empty. When
# it points at an HF_LEROBOT_HOME-style parent, set repo_id to the dataset's
# relative repository ID.
#
# Norm stats are loaded from <assets_dir>/<asset_id>/norm_stats.json and should
# match the padded model tensors (state/actions last dim = openpi.model_action_dim).

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_joint_openpi_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 100
  max_steps: 30000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: /path/to/so101_dataset
  repo_id: "<repo_id>/so101_joint_v1"
  num_workers: 4

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  eval_batch_size: 1
  global_batch_size: 32
  seed: 0

  model:
    model_path: /path/to/pi05_base_pytorch_new
    # SO-101 follower action space: five joints plus one continuous gripper.
    # The leader is an input device, not a second policy action vector.
    num_action_chunks: 20
    action_dim: 6
    openpi:
      config_name: "pi05_so101_joint"
      # Network prediction horizon (Pi0Config.action_horizon). Matches official
      # TrainConfig for pi05_so101_joint. Distinct from action_chunk /
      # num_action_chunks (env-executed / SFT window).
      action_horizon: 20
      # State stays continuous; do not discretize into the prompt (Pi0.5 default
      # would set discrete_state_input=True when this key is omitted).
      discrete_state_input: false
      assets_dir: /path/to/openpi_assets
      asset_id: "<repo_id>"
    openpi_data:
      # The SO-101 statistics are external to the base model checkpoint. Keep
      # this path explicit so the official OpenPI loader and the RLinf model
      # factory consume the same normalization file.
      norm_stats_path: ${actor.model.openpi.assets_dir}/${actor.model.openpi.asset_id}/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
