# SO-101 supervised fine-tuning with OpenPI
# Trains OpenPi π0.5 on SO-101 demonstration data

defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: so101-openpi
    experiment_name: "realworld-sft-openpi-so101"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
  ckpt_path: null

data:
  # Replace: node-0 path to LeRobot-format dataset root
  train_data_paths: "/path/to/so101-lerobot-dataset"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 32
  seed: 0

  model:
    precision: null
    # Replace: node-0 path to π0.5 base checkpoint
    model_path: "/path/to/pi0.5-base-model"
    num_action_chunks: 20
    action_dim: 8  # SO-101: 6 joints + 2 gripper dims
    add_value_head: False
    openpi:
      config_name: "pi05_so101_joint"
      train_expert_only: False
      detach_critic_input: True
      action_chunk: ${actor.model.num_action_chunks}
    openpi_data:
      repo_id: "id_0"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 100
    total_training_steps: 2000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
