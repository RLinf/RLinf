defaults:
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:SO101_OUTPUT_DIR,../results}
    project_name: rlinf
    experiment_name: realworld_sft_openpi_so101
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: ${oc.env:SO101_MAX_STEPS,2000}
  val_check_interval: -1
  save_interval: ${oc.env:SO101_SAVE_INTERVAL,100}

data:
  train_data_paths: ${oc.env:SO101_DATASET_PATH,/path/to/so101-dataset}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 32
  seed: 0
  model:
    precision: null
    model_path: ${oc.env:PI0_BASE_CHECKPOINT,/path/to/pi0-model}
    num_action_chunks: 10
    action_dim: 6
    add_value_head: false
    openpi:
      config_name: pi0_so101
      detach_critic_input: true
      num_images_in_input: 2
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: cosine
    lr_warmup_steps: 1000
    total_training_steps: ${oc.env:SO101_MAX_STEPS,30000}
