# OpenWAM full-parameter SFT on VLABench.
# Everything but the paths comes from libero_sft_openwam.yaml: the checkpoint's own
# config.yaml (dataloader section: type=vlabench, cameras, action mode) drives the
# native OpenWAM reader, so a vlabench checkpoint must be paired with vlabench data.
defaults:
  - libero_sft_openwam
  - _self_

runner:
  logger:
    experiment_name: "vlabench_sft_openwam"

data:
  train_data_paths: /path/to/vlabench_data

actor:
  model:
    model_path: /path/to/openwam-vlabench-checkpoint
