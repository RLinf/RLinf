defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:SO101_OUTPUT_DIR,./results/so101-sft}
    project_name: rlinf
    experiment_name: so101_pi05_sft
    logger_backends: []
  max_epochs: -1
  max_steps: ${oc.decode:${oc.env:SO101_MAX_STEPS,30000}}
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:SO101_SAVE_INTERVAL,5000}}

data:
  train_data_paths: ${oc.env:SO101_DATASET_PATH}
  num_workers: 0

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0
  model:
    precision: null
    model_path: ${oc.env:PI05_BASE_CHECKPOINT}
    num_action_chunks: 20
    action_dim: 6
    add_value_head: false
    openpi:
      config_name: pi05_so101
      norm_stats_path: ${oc.env:SO101_NORM_STATS_PATH}
      asset_id: so101
      num_images_in_input: 1
      train_expert_only: false
  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${oc.decode:${oc.env:SO101_MAX_STEPS,30000}}
    lr_warmup_steps: 500
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
