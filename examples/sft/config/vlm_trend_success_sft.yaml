# Sparse terminal-success LoRA; all common Qwen3-VL SFT settings come from Trend.
defaults:
  - qwen3vl_sft_vlm_trend_reward
  - _self_

paths:
  pipeline_root: /path/to/vlm_trend_success_potential
  model_path: /path/to/Qwen3-VL-4B-Instruct

runner:
  max_epochs: 2
  max_steps: 400
  val_check_interval: 100
  save_interval: 100
  experiment_name: vlm_trend_success_sft
  output_dir: ${paths.pipeline_root}/success_sft

data:
  data_root: ${paths.pipeline_root}/success_data
  train_data_paths: ${data.data_root}/train/segments.jsonl
  val_data_paths: ${data.data_root}/eval/segments.jsonl
  video_root: ${data.data_root}
  video_do_sample_frames: true
  video_fps: 24.0
  num_workers: 16

actor:
  micro_batch_size: 4
  eval_batch_size: 16
  global_batch_size: 256
  model:
    model_path: ${paths.model_path}
  optim:
    lr_warmup_steps: 20
