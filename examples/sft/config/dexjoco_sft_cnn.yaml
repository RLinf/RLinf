defaults:
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dexjoco_sft_cnn"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 2000

data:
  # Exported with toolkits/lerobot/export_image_action_chunks.py
  train_data_paths: "/path/to/dexjoco/dexjoco_cnn_datasets/water_plant"
  num_workers: 4

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 256
  seed: 0

  model:
    model_path: "/path/to/RLinf-ResNet10-pretrained" # https://huggingface.co/RLinf/RLinf-ResNet10-pretrained
    image_num: 2
    state_dim: 23
    action_dim: 22
    num_action_chunks: 10
    action_norm_stats: "/path/to/dexjoco/dexjoco_cnn_datasets/water_plant/meta.json"
    sft_loss_type: mse
    add_value_head: True # Match the PPO checkpoint layout.
    add_q_head: False

  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 500
    lr_scheduler: "cosine"
    num_cycles: 0.5

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
