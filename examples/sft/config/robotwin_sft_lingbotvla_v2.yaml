defaults:
  - model/lingbotvla_v2@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:LINGBOT_VLA_SFT_OUTPUT,../results}
    project_name: rlinf
    experiment_name: robotwin_sft_lingbotvla_v2
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  train_data_paths: ${oc.env:LINGBOT_VLA_SFT_DATASET}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 1234
  enable_offload: false

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-4
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 1.0e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: false
    cpu_offload: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false
