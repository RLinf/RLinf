defaults:
  - model/streamingvla@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "streamingvla_libero_sft"
    logger_backends: ["tensorboard"] # wandb, swanlab
  max_epochs: -1
  max_steps: 100000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null

data:
  train_data_paths: "/path/to/libero_lerobot_dataset"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 16
  seed: 42

  model:
    model_path: "/path/to/pi05_libero_pytorch"
    streamingvla:
      data:
        repo_id: ${data.train_data_paths}
        assets:
          assets_dir: "/path/to/dataset-parent"
          asset_id: "libero_lerobot_dataset"

  optim:
    lr: 1.0e-5
    lr_scheduler: "openpi_cosine"
    min_lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_warmup_steps: 10000
    total_training_steps: 100000

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "shard_grad_op"
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      # StreamingVLA owns its bf16-backbone/fp32-SFP mixed layout.
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    wrap_policy:
      transformer_layer_cls_to_wrap:
        - "Block"
        - "Encoder1DBlock"
      no_split_names:
        - "action_in_proj"
        - "action_out_proj"
        - "time_mlp_in"
        - "time_mlp_out"
