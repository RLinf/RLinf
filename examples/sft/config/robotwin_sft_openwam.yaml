# OpenWAM full-parameter SFT on RoboTwin 2.0 (aloha-agilex, 20-D EEF).
# Everything but the paths comes from libero_sft_openwam.yaml: the checkpoint's own
# config.yaml (dataloader section: type=robotwin, cameras, action mode) drives the
# native OpenWAM reader, so a robotwin checkpoint must be paired with robotwin data.
defaults:
  - libero_sft_openwam
  - _self_

runner:
  logger:
    experiment_name: "robotwin_sft_openwam"

data:
  train_data_paths: /path/to/robotwin_data

actor:
  model:
    model_path: /path/to/openwam-robotwin-checkpoint
