# 4 卡版 SFT（官方 8 卡 → 本机 4 卡：global_batch 8→4）
defaults:
  - model/lingbotvlav2@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7     # 8 卡（官方配置）

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:LINGBOT_VLA_SFT_OUTPUT,/mnt/public/zhangyuzhuo/results}
    project_name: rlinf
    experiment_name: robotwin_sft_adjust_bottle
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 3000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  press_oversample: 0.0
  press_frames: 0
  train_data_paths: ${oc.env:LINGBOT_VLA_SFT_DATASET}
  num_workers: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8         # 官方 8
  seed: 1234
  enable_offload: false

  fsdp_config:
    strategy: fsdp2      # V2 模型按 FSDP2 设计（混合 requires_grad）
    use_orig_params: true

  optim:
    lr: 1.0e-5
    clip_grad: 1.0
    weight_decay: 0.01
    value_lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
