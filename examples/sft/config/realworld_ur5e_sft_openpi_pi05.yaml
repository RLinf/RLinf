defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: ur5e_openpi_sft
    logger_backends: [tensorboard]
  max_epochs: 100
  max_steps: 30000
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: /path/to/ur5e_dataset
  num_workers: 4

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  eval_batch_size: 1
  global_batch_size: 8
  seed: 0
  model:
    precision: fp32
    model_path: /path/to/pi05_base_openpi
    num_action_chunks: 20
    action_dim: 7
    openpi:
      task: sft
      embed_dtype: bf16
      config_name: pi05_ur5e
      num_images_in_input: 1
      discrete_state_input: true
      action_horizon: 20
    openpi_data:
      norm_stats_path: /path/to/ur5e_dataset/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
