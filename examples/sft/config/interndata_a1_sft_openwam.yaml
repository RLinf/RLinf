# OpenWAM full-parameter SFT on InterData A1.
# Everything but the paths comes from libero_sft_openwam.yaml: the checkpoint's own
# config.yaml (dataloader section: type=interndata_a1, cameras, action mode) drives the
# native OpenWAM reader, so a interndata_a1 checkpoint must be paired with interndata_a1 data.
defaults:
  - libero_sft_openwam
  - _self_

runner:
  logger:
    experiment_name: "interndata_a1_sft_openwam"

data:
  train_data_paths: /path/to/interndata_a1_data

actor:
  model:
    model_path: /path/to/openwam-interndata_a1-checkpoint
