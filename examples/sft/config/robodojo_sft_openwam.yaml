# OpenWAM full-parameter SFT on RoboDojo real-robot data.
# Everything but the paths comes from libero_sft_openwam.yaml: the checkpoint's own
# config.yaml (dataloader section: type=robodojo, cameras, action mode) drives the
# native OpenWAM reader, so a robodojo checkpoint must be paired with robodojo data.
defaults:
  - libero_sft_openwam
  - _self_

runner:
  logger:
    experiment_name: "robodojo_sft_openwam"

data:
  train_data_paths: /path/to/robodojo_data

actor:
  model:
    model_path: /path/to/openwam-robodojo-checkpoint
