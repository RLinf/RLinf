defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - model/openwam@actor.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_sft_openwam"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  log_interval: 10
  resume_dir: null

data:
  train_data_paths: /path/to/libero
  num_workers: 0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 2
  seed: 42

  optim:
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000

  fsdp_config:
    # The policy is a single FSDP unit (OpenWAM's joint denoising driver reads
    # block weights outside their forward), so FSDP2 is used: FSDP1 would keep
    # a 46 GiB full-precision unsharded flat parameter per rank.
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    use_orig_params: true
    reshard_after_forward: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false
