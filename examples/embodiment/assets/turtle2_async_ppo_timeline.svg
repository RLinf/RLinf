<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
  <title id="title">Turtle2 4-stream Async PPO 实测单步时间线</title>
  <desc id="desc">Captured metric step 13 的实际 Actor NVTX 阶段、Rollout predict 间隔和 Rollout-side NCCL weight sync；四个 Env 异步请求进入单个 Rollout。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #20242a; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #5b6470; }
      .lane { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #4f5965; }
      .tiny { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .tick { font-size: 12px; fill: #707985; }
      .grid { stroke: #dfe3e8; stroke-width: 1; stroke-dasharray: 4 5; }
      .axis { stroke: #9aa3ad; stroke-width: 1.2; }
      .request-link { stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0.30; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66707c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="14" fill="#ffffff"/>
  <text x="48" y="43" class="title">4-stream Async PPO：实测单步时间线</text>
  <text x="48" y="69" class="subtitle">Captured metric step 13 · 3.803s；Actor 阶段与 Rollout predict / idle 均按当前 Nsight trace 绘制</text>

  <!-- Actual 0–3.803 s time grid -->
  <line x1="220" y1="92" x2="220" y2="570" class="grid"/>
  <line x1="456.6" y1="92" x2="456.6" y2="570" class="grid"/>
  <line x1="693.3" y1="92" x2="693.3" y2="570" class="grid"/>
  <line x1="929.9" y1="92" x2="929.9" y2="570" class="grid"/>
  <line x1="1120" y1="92" x2="1120" y2="570" class="grid"/>
  <text x="220" y="88" text-anchor="middle" class="tick">0.0s</text>
  <text x="456.6" y="88" text-anchor="middle" class="tick">1.0s</text>
  <text x="693.3" y="88" text-anchor="middle" class="tick">2.0s</text>
  <text x="929.9" y="88" text-anchor="middle" class="tick">3.0s</text>
  <text x="1120" y="88" text-anchor="middle" class="tick">3.803s</text>

  <!-- Actor lane, actual step-13 ranges -->
  <text x="48" y="143" class="lane">Actor / Train</text>
  <rect x="220" y="108" width="238.3" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="339.2" y="132" text-anchor="middle" class="label">等待 / 构造 trajectory</text>
  <text x="339.2" y="153" text-anchor="middle" class="small">1.007s</text>
  <rect x="459.0" y="108" width="397.4" height="58" rx="8" fill="#dcfce7" stroke="#22a447"/>
  <text x="657.7" y="132" text-anchor="middle" class="label">PPO training · 4 × mbs=1</text>
  <text x="657.7" y="153" text-anchor="middle" class="small">1.679s</text>
  <rect x="857.1" y="108" width="262.9" height="58" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="988.6" y="132" text-anchor="middle" class="label">Weight sync / runner wait</text>
  <text x="988.6" y="153" text-anchor="middle" class="small">1.110s wall · Actor sync NVTX 0.621s</text>

  <!-- Links from logical Env streams to measured Rollout requests.
       Current predict NVTX does not contain env-rank, so colors are topology only. -->
  <g fill="none">
    <g stroke="#2563eb" class="request-link">
      <line x1="304.2" y1="255" x2="304.2" y2="338"/><line x1="416.8" y1="255" x2="416.8" y2="338"/>
      <line x1="639.9" y1="255" x2="639.9" y2="338"/><line x1="869.6" y1="255" x2="869.6" y2="338"/>
      <line x1="985.4" y1="255" x2="985.4" y2="338"/>
    </g>
    <g stroke="#e08a00" class="request-link">
      <line x1="331.5" y1="255" x2="331.5" y2="398"/><line x1="457.5" y1="255" x2="457.5" y2="398"/>
      <line x1="669.0" y1="255" x2="669.0" y2="398"/><line x1="897.1" y1="255" x2="897.1" y2="398"/>
      <line x1="1104.9" y1="255" x2="1104.9" y2="398"/>
    </g>
    <g stroke="#0f9f8f" class="request-link">
      <line x1="360.2" y1="255" x2="360.2" y2="458"/><line x1="540.7" y1="255" x2="540.7" y2="458"/>
      <line x1="697.2" y1="255" x2="697.2" y2="458"/><line x1="926.7" y1="255" x2="926.7" y2="458"/>
    </g>
    <g stroke="#d84b4b" class="request-link">
      <line x1="387.8" y1="255" x2="387.8" y2="518"/><line x1="568.1" y1="255" x2="568.1" y2="518"/>
      <line x1="768.4" y1="255" x2="768.4" y2="518"/><line x1="955.0" y1="255" x2="955.0" y2="518"/>
    </g>
  </g>

  <!-- Rollout lane: exact predict starts/durations and the measured no-predict gaps -->
  <text x="48" y="246" class="lane">Rollout</text>
  <rect x="220" y="205" width="900" height="63" rx="8" fill="#f7f8fa" stroke="#a5adb7"/>
  <text x="670" y="199" text-anchor="middle" class="small">单 rollout rank · queue=1 · bs=1 · 灰色 = no predict / GPU idle，主要在等待 Env</text>
  <rect x="220.0" y="218" width="70.4" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="290.4" y="218" width="27.6" height="37" rx="4" fill="#2563eb"/><text x="304.2" y="241" text-anchor="middle" class="tiny">E0</text>
  <rect x="318.0" y="218" width="26.9" height="37" rx="4" fill="#e08a00"/><text x="331.5" y="241" text-anchor="middle" class="tiny">E1</text>
  <rect x="345.0" y="218" width="1.3" height="37" rx="1" fill="#cbd5e1"/>
  <rect x="346.3" y="218" width="27.9" height="37" rx="4" fill="#0f9f8f"/><text x="360.2" y="241" text-anchor="middle" class="tiny">E2</text>
  <rect x="374.2" y="218" width="27.2" height="37" rx="4" fill="#d84b4b"/><text x="387.8" y="241" text-anchor="middle" class="tiny">E3</text>
  <rect x="401.4" y="218" width="1.4" height="37" rx="1" fill="#cbd5e1"/>
  <rect x="402.8" y="218" width="27.9" height="37" rx="4" fill="#2563eb"/><text x="416.8" y="241" text-anchor="middle" class="tiny">E0</text>
  <rect x="430.7" y="218" width="12.9" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="443.6" y="218" width="27.8" height="37" rx="4" fill="#e08a00"/><text x="457.5" y="241" text-anchor="middle" class="tiny">E1</text>
  <rect x="471.4" y="218" width="55.6" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="527.0" y="218" width="27.4" height="37" rx="4" fill="#0f9f8f"/><text x="540.7" y="241" text-anchor="middle" class="tiny">E2</text>
  <rect x="554.4" y="218" width="27.4" height="37" rx="4" fill="#d84b4b"/><text x="568.1" y="241" text-anchor="middle" class="tiny">E3</text>
  <rect x="581.8" y="218" width="44.3" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="626.0" y="218" width="27.7" height="37" rx="4" fill="#2563eb"/><text x="639.9" y="241" text-anchor="middle" class="tiny">E0</text>
  <rect x="653.7" y="218" width="1.3" height="37" rx="1" fill="#cbd5e1"/>
  <rect x="654.9" y="218" width="28.2" height="37" rx="4" fill="#e08a00"/><text x="669.0" y="241" text-anchor="middle" class="tiny">E1</text>
  <rect x="683.1" y="218" width="28.0" height="37" rx="4" fill="#0f9f8f"/><text x="697.2" y="241" text-anchor="middle" class="tiny">E2</text>
  <rect x="711.2" y="218" width="43.4" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="754.6" y="218" width="27.6" height="37" rx="4" fill="#d84b4b"/><text x="768.4" y="241" text-anchor="middle" class="tiny">E3</text>
  <rect x="782.2" y="218" width="73.6" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="855.8" y="218" width="27.7" height="37" rx="4" fill="#2563eb"/><text x="869.6" y="241" text-anchor="middle" class="tiny">E0</text>
  <rect x="883.5" y="218" width="27.3" height="37" rx="4" fill="#e08a00"/><text x="897.1" y="241" text-anchor="middle" class="tiny">E1</text>
  <rect x="910.8" y="218" width="1.3" height="37" rx="1" fill="#cbd5e1"/>
  <rect x="912.1" y="218" width="29.1" height="37" rx="4" fill="#0f9f8f"/><text x="926.7" y="241" text-anchor="middle" class="tiny">E2</text>
  <rect x="941.2" y="218" width="27.5" height="37" rx="4" fill="#d84b4b"/><text x="955.0" y="241" text-anchor="middle" class="tiny">E3</text>
  <rect x="968.7" y="218" width="2.1" height="37" rx="1" fill="#cbd5e1"/>
  <rect x="970.8" y="218" width="29.1" height="37" rx="4" fill="#2563eb"/><text x="985.4" y="241" text-anchor="middle" class="tiny">E0</text>
  <rect x="1000.0" y="218" width="91.1" height="37" rx="2" fill="#cbd5e1"/>
  <rect x="1091.1" y="218" width="27.5" height="37" rx="4" fill="#e08a00"/><text x="1104.9" y="241" text-anchor="middle" class="tiny">E1</text>
  <rect x="1118.6" y="218" width="1.4" height="37" rx="1" fill="#cbd5e1"/>

  <!-- Rollout-side weight sync, actual step-13 sync/NCCL window -->
  <text x="48" y="299" class="label">Rollout weight sync</text>
  <line x1="220" y1="294" x2="1120" y2="294" stroke="#d8dce2" stroke-width="2"/>
  <rect x="911.5" y="280" width="93.6" height="28" rx="6" fill="#d8b4fe" stroke="#9333ea"/>
  <text x="958.3" y="299" text-anchor="middle" class="small">0.396s</text>
  <text x="1014" y="299" class="small">227 × NCCL broadcast</text>

  <!-- Four logical Env streams -->
  <g>
    <text x="48" y="343" class="lane">Env 0</text><text x="112" y="343" class="small">chunk ≈ 2.503s</text>
    <rect x="220" y="324" width="900" height="28" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="304.2" cy="338" r="7" fill="#2563eb"/><circle cx="416.8" cy="338" r="7" fill="#2563eb"/>
    <circle cx="639.9" cy="338" r="7" fill="#2563eb"/><circle cx="869.6" cy="338" r="7" fill="#2563eb"/><circle cx="985.4" cy="338" r="7" fill="#2563eb"/>

    <text x="48" y="403" class="lane">Env 1</text><text x="112" y="403" class="small">chunk ≈ 2.510s</text>
    <rect x="220" y="384" width="900" height="28" rx="7" fill="#fff8e8" stroke="#f3d18a"/>
    <circle cx="331.5" cy="398" r="7" fill="#e08a00"/><circle cx="457.5" cy="398" r="7" fill="#e08a00"/>
    <circle cx="669.0" cy="398" r="7" fill="#e08a00"/><circle cx="897.1" cy="398" r="7" fill="#e08a00"/><circle cx="1104.9" cy="398" r="7" fill="#e08a00"/>

    <text x="48" y="463" class="lane">Env 2</text><text x="112" y="463" class="small">chunk ≈ 2.597s</text>
    <rect x="220" y="444" width="900" height="28" rx="7" fill="#eafaf7" stroke="#9edbd2"/>
    <circle cx="360.2" cy="458" r="7" fill="#0f9f8f"/><circle cx="540.7" cy="458" r="7" fill="#0f9f8f"/>
    <circle cx="697.2" cy="458" r="7" fill="#0f9f8f"/><circle cx="926.7" cy="458" r="7" fill="#0f9f8f"/>

    <text x="48" y="523" class="lane">Env 3</text><text x="112" y="523" class="small">chunk ≈ 2.548s</text>
    <rect x="220" y="504" width="900" height="28" rx="7" fill="#fff0f0" stroke="#efb3b3"/>
    <circle cx="387.8" cy="518" r="7" fill="#d84b4b"/><circle cx="568.1" cy="518" r="7" fill="#d84b4b"/>
    <circle cx="768.4" cy="518" r="7" fill="#d84b4b"/><circle cx="955.0" cy="518" r="7" fill="#d84b4b"/>
  </g>

  <line x1="220" y1="570" x2="1120" y2="570" class="axis" marker-end="url(#arrow)"/>
  <text x="220" y="594" class="tick">step 13 start</text>
  <text x="1120" y="594" text-anchor="end" class="tick">step 13 end</text>
  <text x="48" y="623" class="small">实测 step 13：灰色为 Rollout idle / wait Env；紫色为 Rollout weight sync，与部分 predict 重叠。</text>
  <text x="48" y="644" class="small">E0–E3 表示四路逻辑请求；当前 NVTX 不包含逐请求 env-rank。</text>
</svg>
