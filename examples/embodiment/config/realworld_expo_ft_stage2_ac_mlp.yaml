defaults:
  - env/realworld_peg_insertion@env.train
  - env/realworld_peg_insertion@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "4090"
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: ROBOT_IP
            node_rank: 1
            controller_node_rank: 1
            disable_validate: false

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf-expo-ft
    experiment_name: "realworld_expo_ft_stage2_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  actor_agg_q: mean
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: expo_ft_ac
  loss_agg_func: "token-mean"

  q_weight: 1.0
  num_min_qs: ${actor.model.num_min_qs}
  residual_actor_base_source: ref_chunk

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 1.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  backup_entropy: False

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_spacemouse: True
    use_gello: False
    use_pico: False
    no_gripper: False
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 300
      target_ee_pose: TARGET_EE_POSE
      success_hold_steps: 1

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    use_fixed_reset_state_ids: False
    group_size: 1
    use_spacemouse: True
    use_gello: False
    use_pico: False
    no_gripper: False
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 300
      target_ee_pose: TARGET_EE_POSE
      success_hold_steps: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_type: ${actor.model.model_type}
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_value_head: ${actor.model.add_value_head}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    num_q_heads: ${actor.model.num_q_heads}
    num_base_candidates: ${actor.model.num_base_candidates}
    num_edit_samples: ${actor.model.num_edit_samples}
    num_min_qs: ${actor.model.num_min_qs}
    edit_scale: ${actor.model.edit_scale}
    residual_logstd_min: ${actor.model.residual_logstd_min}
    residual_logstd_max: ${actor.model.residual_logstd_max}
    is_lora: False

  rlt_feature_model:
    model_type: "openpi"
    precision: null
    is_lora: False
    model_path: "/path/to/stage1/checkpoint"
    openpi_data:
      repo_id: "realworld_peg_insertion_rlt_stage1"
    openpi:
      config_name: "pi05_franka_state"
      num_images_in_input: 1
      action_chunk: ${actor.model.ref_num_action_chunks}
      num_steps: 4
      state_indices: []
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      use_rlt: True
      rlt_num_base_candidates: ${actor.model.num_base_candidates}
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: "expo_ft_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    is_lora: False

    z_dim: 2048
    proprio_dim: 19
    action_dim: 7
    num_action_chunks: 10
    ref_num_action_chunks: 20
    num_q_heads: 10
    num_base_candidates: 8
    num_edit_samples: 8
    num_min_qs: 2
    edit_scale: 0.2
    residual_logstd_min: -20.0
    residual_logstd_max: 2.0

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
