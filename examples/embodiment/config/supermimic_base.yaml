# Shared SuperMimic hyperparameters. Not launched by itself.
# 320000 counts update iterations (Algorithm A.1). That reading is not
# author-confirmed. With updates_per_env_step=0.4 it is 800000 vectorized
# sim steps. Appendix D.1 specifies 1 s bins, the 50/40/10 mixture, and a
# softmax temperature. The temperature 25 and the EMA rates are local.
defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  # Replay and simulation stay in the one worker. Ray's default object
  # store is about 30% of host RAM and is what pushed an 8 GB machine
  # over the memory monitor. This does not disable that monitor.
  object_store_memory_mb: 512
  # One SuperMimic rank per listed GPU, e.g. "0-3" for four ranks.
  # env.num_envs, wm_window_batch and imagine_batch are global sizes
  # split evenly over ranks; updates_per_env_step counts global updates.
  component_placement:
    supermimic: 0

runner:
  task_type: supermimic
  logger:
    # One directory per config, so TensorBoard and config.yaml under
    # log_path/tensorboard do not mix across SuperMimic experiments.
    # run_supermimic.sh also adds a timestamped log_path per launch.
    log_path: "../results/${runner.logger.experiment_name}"
    project_name: rlinf
    experiment_name: supermimic
    logger_backends: []
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  per_worker_log: false
  # Also log each rank's metrics under rank_<r>/.
  log_per_rank_metrics: false

algorithm:
  k: 8
  H: 32
  gamma: 0.99
  lam: 0.95
  updates_per_env_step: 0.4
  total_updates: 320000
  lr_decay_updates: 250000
  lr: 2.0e-4
  wm_batches: 10
  wm_window_batch: 2048
  imagine_batch: 4096
  critic_epochs: 5
  critic_minibatches: 4
  warmup_sim_steps: 40
  # Updates that fit the world model before the first actor update.
  # 0 is the paper loop. zita-ch used 500.
  wm_only_updates: 0
  # These four are written so a paper config does not follow zita-ch.
  # Code that finds a key missing uses zita-ch: pelvis, running, body, running.
  # torso: root and body-pose reward on torso_link. pelvis: on the pelvis.
  reward_anchor: torso
  # none: raw observations, goals and xi. running: Welford norm, and xi
  # is divided by zita-ch's fixed scales before that norm.
  input_norm: none
  # heading: position and linear velocity in the yaw frame, body-rate
  # angular residual. body: zita-ch's full-body linear velocity and the
  # world-rate angular residual, stored back as a body rate.
  residual_frame: heading
  # paper: unweighted squared state error. Rotation is the relative
  # rotvec at scale 1. scaled divides each block by STATE_LOSS_SCALES.
  # running divides the frame-local error by the running residual std.
  wm_state_loss: paper
  # root4: invariant state, goal, xi, and a 4-d root error.
  # zita: zita-ch's extra tracking errors, then the goal.
  critic_features: root4
  # tf32 keeps every matmul in float32 with tensor cores. bf16 autocasts
  # only the linear stacks; their outputs are cast back to float32 before
  # integration, kinematics and the losses. Adam weights stay float32.
  matmul: tf32
  action_noise_std: 0.1
  goal_anchor: false
  goal_encoding: paper
  velocity_tracking: false
  obs_dim: 93
  goal_frame_dim: 68
  goal_frames: 10
  history_len: 10
  action_dim: 29
  termination_body: pelvis
  max_episode_seconds: 10.0
  G_max: 10.0
  bce_weight: 1.0
  # learned: the termination head fit by BCE on predicted states (Eq. 1).
  # analytic: an experimental soft threshold with no weights; not the paper run.
  termination_head: learned
  # Experimental. null keeps PyTorch's default init (output about 0.5). A
  # logit such as -4.6 starts the head at a 1% failure prior; see the
  # algorithm docs for why this matters with rare failure labels.
  termination_bias_init: null
  # Rank r draws envs and noise from seed + r. null leaves a single rank
  # unseeded; several ranks then still start from 0.
  seed: 0
  # Ranks must hold identical weights; checked every N updates (0 = off).
  param_check_interval: 100
  # Steps with a non-finite gradient are skipped on every rank. More than
  # this many in a row stops the run.
  max_nonfinite_skips: 20

env:
  backend: mjlab
  num_envs: 4096
  num_clips: 40
  replay_length: 1000
  motion_path: ""
  motion_format: lafan1
  device: cuda
  # Keep motion frames in host memory; queries copy only the gathered rows.
  motion_on_cpu: false

worker:
  group_name: SuperMimicGroup
