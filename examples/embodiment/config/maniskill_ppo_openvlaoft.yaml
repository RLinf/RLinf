defaults:
  - base/embodied_rl
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_ood_template@env.eval
  - model/openvla_oft@actor.model
  - algorithm/ppo@algorithm
  - _self_
  - override /cluster@cluster: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    env: 0-3
    rollout: 4-7

runner:
  logger:
    experiment_name: "maniskill_ppo_openvlaoft"

algorithm:
  logprob_type: token_level
  entropy_type: token_level
  bootstrap_type: always
  clip_ratio_high: 0.28

env:
  train:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_steps_per_rollout_epoch: 160
  eval:
    rollout_epoch: 1
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

actor:
  micro_batch_size: 40
  global_batch_size: 640
  model:
    model_path: "/path/to/model/RLinf-OpenVLAOFT-ManiSkill-Base-Main/" # https://huggingface.co/RLinf/RLinf-OpenVLAOFT-ManiSkill-Base-Main
    lora_path: /path/to/model/RLinf-OpenVLAOFT-ManiSkill-Base-Lora # https://huggingface.co/RLinf/RLinf-OpenVLAOFT-ManiSkill-Base-Lora
    unnorm_key: bridge_orig
    add_value_head: True
    is_lora: True
    max_prompt_length: 30
  optim:
    adam_beta2: 0.999
    clip_grad: 10.0
  fsdp_config:
    gradient_checkpointing: True
