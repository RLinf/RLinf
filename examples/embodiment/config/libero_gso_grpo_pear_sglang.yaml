defaults:
  - env/libero_spatial_vlm@env.train
  - env/libero_spatial_vlm@env.eval
  - model/qwen3_8_27b@actor.model
  - model/qwen3_8_27b@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - hybrid_engines/sglang_router_server@rollout.sglang
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  # Shared placement: actor, rollout, and env time-share every GPU.
  # SGLang stays TP8 on the actor ranks and is released before FSDP training.
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_gso_grpo_pear_sglang"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  # Shortened stage 1. The paper runs about 148 steps at 160k response tokens.
  max_steps: 2
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: sequence_token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: pear_reinforce
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: False
  # pear_reinforce does not use old_logprobs; skipping recompute saves a full 27B forward pass.
  recompute_logprobs: False
  pear:
    # Synchronous on-policy updates do not use the paper's async correction.
    score_centering: False
    episode_sequence: True
    dapo_filter: True
    dapo_resample: True
    # Paper target is 128 variable groups and unlimited replacement.
    # This run still stops at one kept group, after at most four batches.
    dapo_target_groups: 1
    dapo_max_batches: 4

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    task_suite_name: libero_gso
    num_steps_wait: 10
    rollout_epoch: 1
    # One GRPO group of 8 per GPU. 8 workers x 8 envs.
    total_num_envs: 64
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    # Sample across all LIBERO-GSO episodes rather than locking to reset_state_id=0.
    use_fixed_reset_state_ids: False
    specific_reset_id: null
    # PEAR does not cap model turns. 300 is libero_goal's native budget, the
    # longest suite in libero_gso (spatial 220, object 280, goal 300). An
    # episode still ends on success, a bad action, or that suite's budget.
    max_episode_steps: 8
    max_steps_per_rollout_epoch: 8
    video_cfg:
      save_video: True
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      camera_heights: 512
      camera_widths: 512
  eval:
    task_suite_name: libero_gso
    num_steps_wait: 10
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: False
    ignore_terminations: False
    early_stop_on_done: True
    use_fixed_reset_state_ids: False
    use_ordered_reset_state_ids: True
    specific_reset_id: null
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    group_size: 1
    is_eval: True
    init_params:
      camera_heights: 512
      camera_widths: 512
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
    # Episode response budget, matching PEAR stage 1. Each turn receives
    # only the tokens still left in this budget.
    max_new_tokens: 160000
  group_name: "RolloutGroup"
  rollout_backend: "sglang"
  # The patched scheduler refuses weight sync unless CUDA graphs are enabled.
  enforce_eager: False
  # PEAR has no value head, so the last step must not request another forward.
  collect_final_values: False
  recompute_logprobs: ${algorithm.recompute_logprobs}
  enable_offload: False
  pipeline_stage_num: 1
  sglang:
    apply_rlinf_patch: True
    launch_router: False
    tensor_parallel_size: 8
    actor_world_size: 8
    reasoning_effort: xhigh
    response_budget: 160000
    fp32_modules: ["visual", "A_log", "lm_head"]
    dtype: bf16
    # Decode each rollout turn into ${runner.logger.log_path}/sglang_decode.log.
    log_decode_text: true
    http_timeout_s: 3600
    model_path: "/mnt/public/guozhen/models/Qwen/Qwen3.8-27B"
    server:
      model_path: "/mnt/public/guozhen/models/Qwen/Qwen3.8-27B"
      tp_size: 8
      # Leave room for the FSDP parameters during the CUDA-IPC copy. KV stays
      # released until the actor has offloaded.
      mem_fraction_static: 0.45
      max_running_requests: 16
      cuda_graph_max_bs_decode: 16
      enable_memory_saver: True
      disable_cuda_graph: False
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    is_lora: False
    reasoning_effort: xhigh
    max_new_tokens: 160000

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  # 64 collected trajectories, one group of 8 on each actor rank.
  global_batch_size: 64
  seed: 42
  # Offload parameters and Adam state before rollout, and again after training.
  enable_offload: True
  model:
    model_path: "/mnt/public/guozhen/models/Qwen/Qwen3.8-27B"
    action_dim: 8
    num_action_chunks: 1
    add_value_head: False
    # Full parameters, matching the paper. LoRA rank 16 is a non-paper fallback.
    is_lora: False
    reasoning_effort: xhigh
    max_new_tokens: 160000
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
