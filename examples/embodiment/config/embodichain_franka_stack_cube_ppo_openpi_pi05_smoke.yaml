defaults:
  - embodichain_franka_stack_cube_ppo_openpi_pi05
  - _self_

runner:
  logger:
    experiment_name: embodichain_stack_cube_ppo_pi05_smoke
  max_epochs: 10
  val_check_interval: 5
  save_interval: 5

env:
  train:
    total_num_envs: 8
  eval:
    total_num_envs: 8

actor:
  # Match rollout batch shape when recomputing the sampled flow logprobs.
  micro_batch_size: 8
  # 8 * 450 / 5 * 2 = 1,440 chunks; keep full batches in the smoke run.
  global_batch_size: 32
