defaults:
  - env/maniskill_rlt@env.train
  - env/maniskill_rlt@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_rlt_stage2_td3_mlp_steam"
    logger_backends: ["wandb"]

  max_epochs: 5000
  max_steps: -1
  only_eval: False
  weight_sync_interval: 1
  val_check_interval: 25
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 5
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 400
    warmup_min_size: 10000
    warmup_post_collect_updates: 30000
    train_every_episodes: 0
    train_every_transitions: 5
  group_size: 1

  adv_type: rlt_td3
  loss_type: rlt_td3
  loss_agg_func: "token-mean"

  agg_q: min
  actor_agg_q: min
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  # TD3 actor objective: -q_weight * Q + bc_weight * BC.
  q_weight: 1.0
  bc_weight: 1.0
  actor_update_action_noise: True
  reference_dropout_prob: 0.5
  # Schedule for the BC/Q weights in the actor objective. Disable it to use
  # the fixed bc_weight and q_weight above for the entire run.
  actor_weight_schedule:
    enable: True
    warmup_updates: 20000
    ramp_updates: 50000
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.8
    online_q_weight: 0.50

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 10000
    sample_window_size: 50000
    max_num_samples: 50000
    min_buffer_size: 1000
    auto_save: False

  # Save the STEAM decisions and geometry-only labels used by both calibrators.
  rlt_gate_calibration:
    enable: True
    save_path: ${runner.logger.log_path}/${runner.logger.experiment_name}/gate_calibration
    chunk_size: 10
    max_trace_files: 0

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1000
  critic_actor_ratio: 2
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 64
    seed: 2026
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    wrap_obs_mode: rlt_openpi_joint
    reward_mode: only_success
    rlt_policy_switch:
      enable: True
      # STEAM owns routing; the geometry gate below is calibration-only.
      routing_source: rollout
      task_mode: full_task
      trigger_mode: auto
      latch_until_done: True
      auto_gate:
        require_grasp: True
        require_not_success: True
        near_hole_x_min: -0.16
        near_hole_yz_margin: 1.5
        fallback_hole_radius: 0.03
      expert_takeover:
        enable: False
        oracle_metrics:
          enable: True
          trigger_mode: stalled_progress
          gate:
            require_grasp: True
            require_not_success: True
            near_hole_x_min: -0.10
            near_hole_yz_margin: 2.0
            stuck_chunks_before_takeover: 3
            min_x_progress: 0.003
            min_yz_progress: 0.0015
            min_score_progress: 0.002
            progress_yz_weight: 1.0
            fallback_hole_radius: 0.03
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    init_params:
      id: "PegInsertionSideWideClearance-v1"
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      reward_mode: "sparse"
      sim_config:
        sim_freq: 100
        control_freq: 10
      sensor_configs:
        width: 384
        height: 384
  eval:
    rollout_epoch: 1
    total_num_envs: 256
    seed: 2026
    group_size: 1
    auto_reset: False
    ignore_terminations: False
    use_fixed_reset_state_ids: True
    wrap_obs_mode: rlt_openpi_joint
    reward_mode: only_success
    rlt_policy_switch:
      enable: True
      routing_source: rollout
      task_mode: full_task
      trigger_mode: auto
      latch_until_done: True
      auto_gate:
        require_grasp: True
        require_not_success: True
        near_hole_x_min: -0.16
        near_hole_yz_margin: 1.5
        fallback_hole_radius: 0.03
      expert_takeover:
        enable: False
        oracle_metrics:
          enable: True
          trigger_mode: stalled_progress
          gate:
            require_grasp: True
            require_not_success: True
            near_hole_x_min: -0.10
            near_hole_yz_margin: 2.0
            stuck_chunks_before_takeover: 3
            min_x_progress: 0.003
            min_yz_progress: 0.0015
            min_score_progress: 0.002
            progress_yz_weight: 1.0
            fallback_hole_radius: 0.03
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 500
    policy_mode: eval
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    video_cfg:
      save_video: False
      fps: 10
      record_every: 1
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "PegInsertionSideWideClearance-v1"
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      reward_mode: "sparse"
      sim_config:
        sim_freq: 100
        control_freq: 10
      sensor_configs:
        width: 384
        height: 384

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True

  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    policy_setup: ${actor.model.policy_setup}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    mlp_hidden_dim: ${actor.model.mlp_hidden_dim}
    mlp_num_hidden_layers: ${actor.model.mlp_num_hidden_layers}
    actor_noise_sigma: ${actor.model.actor_noise_sigma}
    is_lora: False
    lora_rank: 32

  rlt_feature_model:
    model_type: "openpi_rlinf"
    model_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/tests/RLinf-dev/logs/20260804-16:28:10-maniskill_rlt_stage1_sft_openpi_pi05/maniskill_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_1000/actor"
    precision: bf16
    num_action_chunks: 10
    action_dim: ${actor.model.action_dim}
    num_steps: 5
    add_value_head: False
    is_lora: False
    lora_rank: 32
    openpi_data:
      repo_id: "maniskill_peginsertionside_joint"
      default_prompt: "insert the peg in the hole"
      norm_stats_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/maniskill_peginsertionside_joint/norm_stats.json"
    openpi:
      task: eval
      config_name: "pi05_rlt_maniskill_joint"
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 8
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

  # Independent STEAM base-to-actor and actor-to-expert routing. The critic
  # compares raw ManiSkill image pairs at 10-step chunk boundaries.
  rlt_critical_phase_gate:
    enable: True
    actor_switch:
      enable: True
      mode: active
      phase_head_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/data/steam_phase_head.pt"
      # Keep frozen STEAM features in calibration traces so the phase head can
      # be recalibrated without changing the active routing path.
      collect_phase_features: True
      # By default the gate reads the calibrated threshold and patience from
      # this checkpoint. Set these fields explicitly only for an ablation.
    chunk_size: 10
    lookback_chunks: 2
    latch_until_done: True
    main_image_key: image
    wrist_image_key: wrist_image
    expert_takeover:
      enable: True
      # Balanced profile calibrated from actor-only shadow traces.
      mode: active
      warmup_chunks: 8
      patience_chunks: 3
      enter_threshold: -0.236502
      latch_until_done: True
    model:
      model_type: "steam_value_model"
      model_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/tests/RLinf-dev/logs/steam_sft/rlt_steam_value_model_sft-20260813-10:01:45/rlt_steam_value_model_sft/checkpoints/global_step_2000/actor"
      precision: bf16

  # The simulation expert is invoked by the learned actor-to-expert gate.
  expert_model:
    model_type: "openpi_rlinf"
    model_path: "/mnt/public2/xiekaizhi/rlt-openpi-sim/tests/RLinf-dev/logs/20260804-16:28:10-maniskill_rlt_stage1_sft_openpi_pi05/maniskill_rlt_stage1_sft_openpi_pi05/checkpoints/global_step_3000/actor"
    precision: bf16
    num_action_chunks: 10
    action_dim: 8
    num_steps: 5
    add_value_head: False
    openpi:
      task: eval
      config_name: "pi05_rlt_maniskill_joint"
      num_images_in_input: 2
      action_chunk: 10
      action_horizon: 10
      action_env_dim: 8
      num_steps: 5
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: False

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 512
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_td3_mlp_policy"
    # RLT TD3 keeps the small Stage2 head in fp32 for Q-learning stability.
    precision: fp32
    policy_setup: "panda-qpos"
    action_dim: 8
    num_action_chunks: 10
    ref_num_action_chunks: 10
    z_dim: 2048
    proprio_dim: 9
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    mlp_hidden_dim: 256
    mlp_num_hidden_layers: 2
    actor_noise_sigma: 0.1
    is_lora: False
    lora_rank: 32

  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    wrap_policy:
      module_classes_to_wrap:
        - TwinQCritic
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
