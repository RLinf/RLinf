# One OpenVLA-OFT policy co-trains with GRPO on LIBERO-10 and a ManiSkill
# scene. The two env configurations keep their own horizons and rollout epochs:
# LIBERO-10 runs eight 512-step epochs per step, ManiSkill four 80-step epochs.
defaults:
  - env/libero_10@env.train.envs.libero_10
  - env/maniskill_put_on_plate_in_scene_25_main@env.train.envs.maniskill
  - env/libero_10@env.eval.envs.libero_10
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval.envs.maniskill
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_libero_grpo_openvlaoft"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 25
  resume_dir: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  # Every trajectory counts the same in the loss, whatever its env's horizon.
  env_weighting: trajectory

env:
  group_name: "EnvGroup"

  train:
    # LIBERO sends a main and a wrist view, ManiSkill one view. OpenVLA-OFT reads
    # the main view and the task, so both send just those at one size and share
    # one forward pass.
    policy_obs:
      keys: [main_images, task_descriptions]
      image_size: [256, 256]
    # Override the default values in env/libero_10 and
    # env/maniskill_put_on_plate_in_scene_25_main.
    envs:
      libero_10:
        total_num_envs: 32
        rollout_epoch: 8
        max_episode_steps: 512
        max_steps_per_rollout_epoch: 512
        group_size: ${algorithm.group_size}
        reward_coef: 5.0
        use_fixed_reset_state_ids: True
        use_ordered_reset_state_ids: True
        reset_gripper_open: False
      maniskill:
        total_num_envs: 32
        rollout_epoch: 4
        max_episode_steps: 80
        max_steps_per_rollout_epoch: 80
        group_size: ${algorithm.group_size}
        # ManiSkill actions use the Bridge action statistics, LIBERO-10 the
        # model's unnorm_key.
        unnorm_key: bridge_orig
  eval:
    policy_obs:
      keys: [main_images, task_descriptions]
      image_size: [256, 256]
    envs:
      libero_10:
        total_num_envs: 32
        auto_reset: True
        ignore_terminations: True
        max_episode_steps: 512
        max_steps_per_rollout_epoch: 512
        use_fixed_reset_state_ids: True
        reset_gripper_open: False
        is_eval: True
        video_cfg:
          save_video: False
          video_base_dir: ${runner.logger.log_path}/video/eval
      maniskill:
        total_num_envs: 32
        auto_reset: True
        ignore_terminations: True
        max_episode_steps: 80
        max_steps_per_rollout_epoch: 80
        unnorm_key: bridge_orig
        video_cfg:
          save_video: False
          video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/Openvla-oft-SFT-libero10-traj1/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  # Each actor gets 4096 LIBERO-10 and 320 ManiSkill samples per step, so a
  # step makes three optimizer steps of 1472 samples per actor.
  micro_batch_size: 32
  global_batch_size: 5888
  seed: 1234
  enable_offload: True

  model:
    model_path: "/path/to/model/Openvla-oft-SFT-libero10-traj1/"
    model_type: "openvla_oft"
    unnorm_key: libero_10_no_noops
    max_prompt_length: 128
    # A fresh LoRA adapter keeps the 7B policy, both simulators and rollout on
    # 4 GPUs.
    is_lora: True
    lora_rank: 32

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
