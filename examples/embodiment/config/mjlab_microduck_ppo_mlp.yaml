defaults:
  - env/mjlab_microduck@env.train
  - env/mjlab_microduck@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "mjlab_microduck_ppo_mlp"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 5000
  max_steps: -1

  only_eval: False
  val_check_interval: 250
  save_interval: 250

  seq_length: 1
  max_prompt_length: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 5
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.01

  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  value_loss_coef: 1.0
  value_loss_type: mse
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95
  bootstrap_type: standard

  reward_coef: 1.0

env:
  group_name: EnvGroup

  train:
    rollout_epoch: 1
    total_num_envs: 4096
    group_size: ${algorithm.group_size}
    is_eval: False
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    max_steps_per_rollout_epoch: 1000
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  value_only_bootstrap: true

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 24576
  global_batch_size: 24576
  seed: 1234
  enable_offload: false

  model:
    policy_setup: locomotion
    obs_dim: 61
    critic_obs_dim: 76
    action_dim: 14
    num_action_chunks: 1
    hidden_sizes: [512, 256, 128]
    critic_hidden_sizes: [512, 256, 128]
    activation: elu
    init_logstd: 0.0
    obs_normalization: true
    obs_norm_eps: 1.0e-2

  optim:
    lr: 1.0e-3
    value_lr: 1.0e-3
    lr_scheduler: adaptive_kl
    desired_kl: 0.01
    min_lr: 1.0e-5
    max_lr: 1.0e-2
    kl_factor: 1.5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0

  fsdp_config:
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
