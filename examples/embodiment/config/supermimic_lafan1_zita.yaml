# Complete LAFAN1 recipe used for the reported 16,000-update run.
# Keep observation, goal, normalization and critic settings with its checkpoint.
defaults:
- override hydra/job_logging: stdout
cluster:
  num_nodes: 1
  object_store_memory_mb: 512
  component_placement:
    supermimic: 0
runner:
  task_type: supermimic
  logger:
    log_path: ../results/${runner.logger.experiment_name}
    project_name: rlinf
    experiment_name: supermimic_lafan1_zita
    logger_backends: []
  only_eval: false
  val_check_interval: -1
  save_interval: 2000
  resume_dir: null
  per_worker_log: false
  log_per_rank_metrics: false
algorithm:
  k: 8
  H: 32
  gamma: 0.99
  lam: 0.95
  updates_per_env_step: 0.4
  total_updates: 16000
  lr_decay_updates: 250000
  lr: 0.0002
  wm_batches: 10
  wm_window_batch: 2048
  imagine_batch: 4096
  critic_epochs: 5
  critic_minibatches: 4
  warmup_sim_steps: 64
  wm_only_updates: 500
  reward_anchor: pelvis
  input_norm: running
  residual_frame: body
  wm_state_loss: running
  critic_features: zita
  matmul: bf16
  action_noise_std: 0.1
  goal_anchor: false
  goal_encoding: goal730
  velocity_tracking: false
  obs_dim: 99
  goal_frame_dim: 73
  goal_frames: 10
  history_len: 10
  action_dim: 29
  termination_body: pelvis
  max_episode_seconds: 10.0
  G_max: 10.0
  bce_weight: 1.0
  termination_head: analytic
  termination_bias_init: null
  seed: 0
  param_check_interval: 100
  max_nonfinite_skips: 20
env:
  backend: mjlab
  num_envs: 4096
  num_clips: 40
  replay_length: 1000
  motion_path: ${oc.env:SUPERMIMIC_MOTION_PATH,""}
  motion_format: lafan1
  device: cuda
  com_sampling: per_env
  motion_on_cpu: false
worker:
  group_name: SuperMimicGroup
hydra:
  run:
    dir: .
  output_subdir: null
