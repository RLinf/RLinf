defaults:
  - libero_10_grpo_pear_stage2
  - _self_

runner:
  logger:
    experiment_name: "pear_stage3_libero_robodojo"

# The paper calls stage 3 RoboDojo-only. The released PEAR recipe instead mixes
# the 2,000 LIBERO rows with 328 RoboDojo pickup/align layouts repeated six
# times. Keep those recipes separate. RoboDojo execution uses
# rlinf.envs.sim.robodojo.vlm_action and still requires Isaac Sim plus cuRobo.
algorithm:
  group_size: 8
  loss_type: pear_reinforce
  recompute_logprobs: False
  pear:
    score_centering: True
    episode_sequence: True
    dapo_filter: True
    max_off_policy_threshold: 5
    stage3_recipe: "mixed_libero_robodojo"
    paper_stage3_recipe: "robodojo_only"

actor:
  model:
    embodiment: "robodojo"
    max_new_tokens: 4096

rollout:
  sampling_params:
    max_new_tokens: 4096
