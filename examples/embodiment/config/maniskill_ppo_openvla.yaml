defaults:
  - base/embodied_rl
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_ood_template@env.eval
  - model/openvla@actor.model
  - algorithm/ppo@algorithm
  - _self_
  - override /cluster@cluster: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    env: 0-3
    rollout: 4-7

runner:
  logger:
    experiment_name: "maniskill_ppo_openvla"

algorithm:
  bootstrap_type: always

env:
  train:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_steps_per_rollout_epoch: 160
    enable_offload: True
  eval:
    rollout_epoch: 1
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    enable_offload: True

rollout:
  pipeline_stage_num: 2
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 7

actor:
  micro_batch_size: 80
  global_batch_size: 640
  model:
    model_path: "/path/to/model/rl4vla/openvla-7b-rlvla-warmup/" # https://huggingface.co/gen-robot/openvla-7b-rlvla-warmup
    add_value_head: True
    is_lora: True
  optim:
    adam_beta2: 0.999
    clip_grad: 10.0
  fsdp_config:
    gradient_checkpointing: True
