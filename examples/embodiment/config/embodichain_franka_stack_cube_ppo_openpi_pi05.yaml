# Start after the selected SFT checkpoint passes the frozen validation gate.
# Verify batched runtime/reward parity before the first PPO update.
defaults:
- env/embodichain_stack_cube@env.train
- env/embodichain_stack_cube@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,rollout:
      node_group: policy
      placement: "0"
    env:
      node_group: simulation
      placement: "1"
  node_groups:
  - label: policy
    node_ranks: all
    env_configs:
    - node_ranks: all
      python_interpreter_path: ${oc.env:STACK_CUBE_MODEL_PYTHON}
      env_vars:
      - PYTHONPATH: ${oc.env:REPO_PATH}
      - RLINF_PATH_ENV_MERGE_MODE: override
      - JAX_PLATFORMS: cpu
  - label: simulation
    node_ranks: all
    env_configs:
    - node_ranks: all
      python_interpreter_path: ${oc.env:STACK_CUBE_ENV_PYTHON}
      env_vars:
      - PYTHONPATH: ${oc.env:REPO_PATH}
      - RLINF_PATH_ENV_MERGE_MODE: override
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: embodichain_stack_cube_ppo_pi05
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: 10
  save_interval: 50
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 32
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: false
    seed: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 27
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: false
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    video_cfg:
      save_video: true
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 0
    request_manifest: ${oc.env:STACK_CUBE_PPO_VAL_REQUESTS}
    is_eval: true
rollout:
  group_name: RolloutGroup
  seed: ${actor.seed}
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Match rollout batch shape when recomputing the sampled flow logprobs.
  micro_batch_size: 32
  global_batch_size: 128
  seed: 0
  enable_offload: false
  model:
    model_path: ${oc.env:STACK_CUBE_SFT_MODEL}
    model_type: openpi
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: true
    openpi:
      torch_compile: false
      task: rl
      config_name: pi05_isaaclab_stack_cube
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: false
      num_steps: ${actor.model.num_steps}
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      action_horizon: 10
      action_chunk: 5
      noise_method: flow_sde
      discrete_state_input: false
      eval_sft_image_crop: true
    openpi_data:
      norm_stats_path: ${oc.env:STACK_CUBE_NORM_STATS}
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    checkpoint_format: dcp
    checkpoint_communication_backend: gloo
    save_full_model_weights: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
