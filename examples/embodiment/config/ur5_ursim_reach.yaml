# UR5 joint-reach driven through the Universal Robots ROS2 driver, against URSim.
#
# Unlike the state/pixel robosuite tasks, this talks to a real UR control stack:
# the `ur_ros2` arm backend commands an already-running
# `Universal_Robots_ROS2_Driver` over the ROS graph (joint_states +
# scaled_joint_trajectory_controller). URSim stands in for the real UR5 and
# shares its interface, so the same config drives real hardware -- but only
# after pointing that external driver and its ROS graph at the real arm, not
# by changing `robot_ip` here: this backend always commands the fixed action
# endpoint on the ROS graph it is configured for. Set `robot_ip` to the same
# address regardless, since it also keys the device claim that stops two
# backends from driving the controller at once.
#
# Prerequisites on the robot/controller node, before launching:
#   1. Boot URSim with a Host-Only network adapter (e.g. VirtualBox's
#      vboxnet0) so it is reachable at the `robot_ip` below (192.168.56.101);
#      on its teach pendant, under Installation > URCaps > External Control,
#      set "Host IP" to this machine's address on that same network.
#   2. Launch the Universal_Robots_ROS2_Driver, pointed at URSim and matching
#      `headless_mode` below:
#        ros2 launch ur_robot_driver ur_control.launch.py \
#          ur_type:=ur5 robot_ip:=192.168.56.101 \
#          launch_rviz:=false headless_mode:=true
#      This brings up `scaled_joint_trajectory_controller` (the controller
#      this backend commands) and starts publishing `/joint_states`.
#   3. The env-worker process needs ROS2 on its path:
#        source /opt/ros/jazzy/setup.bash   (alongside the usual venv/XPU env)
# URSim has no scene, contact, or cameras, so this validates the control link
# and joint-space motion only -- not a manipulation task's success.
defaults:
  - env/ur5_reach@env.train
  - env/ur5_reach@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    # The env worker must sit in the group that carries the robot.
    env:
      node_group: ur5
      placement: 0
  node_groups:
    - label: ur5
      node_ranks: 0
      hardware:
        type: UR5
        configs:
          - node_rank: 0
            backend: ur_ros2
            # URSim's docker bridge IP; for hardware, match whatever arm the
            # externally configured ROS2 driver is pointed at.
            robot_ip: 192.168.56.101
            # URSim exposes no cameras.
            camera_serials: []

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "ur5_ursim_reach"
    logger_backends: ["tensorboard"]

  max_epochs: 50
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -6  # -action_dim (6 arm joints)
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 1000
    sample_window_size: 1000
    min_buffer_size: 0
    auto_save: False

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      enable_camera_player: False
      use_dense_reward: True
      max_num_steps: 50
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      enable_camera_player: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ""
    precision: ${actor.model.precision}

  # triton on XPU is the CUDA build; keep compile off.
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: mlp_policy
    model_path: ""
    action_dim: 6     # six arm joints, commanded and observed; no gripper
    obs_dim: 6
    image_num: 0
    precision: "32"
    add_value_head: False
    add_q_head: True

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
