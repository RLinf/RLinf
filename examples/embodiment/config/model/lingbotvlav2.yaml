model_type: lingbotvlav2
# Set the checkpoint and source paths through the environment before running.
model_path: ${oc.env:LINGBOT_VLA_V2_ROBOTWIN_ROOT}/checkpoints/global_step_50000/hf_ckpt
tokenizer_path: ${oc.env:QWEN3VL_PATH}
# Storage dtype of the trainable weights. Rollout and eval use bf16; the PPO
# actor overrides this to fp32. Compute is bf16 in both.
precision: bf16
num_action_chunks: 50
action_dim: 14
is_lora: false
num_steps: 10
# Keep the MoE/GEMM batch shape identical in rollout and actor likelihood replay.
forward_micro_batch_size: 1
noise_level: 0.3
add_value_head: true
enable_alignment_heads: true
value_type: chunk_level
value_head:
  hidden_sizes: [512, 128]
  activation: relu
lingbotvlav2:
  training_config_path: ${oc.env:LINGBOT_VLA_V2_ROBOTWIN_ROOT}/lingbotvla_cli.yaml
  robot_config_path: ${oc.env:LINGBOT_VLA_V2_PATH}/configs/robot_configs/robotwin.yaml
  stats_path: ${oc.env:LINGBOT_VLA_V2_PATH}/assets/norm_stats/robotwin.json
  attention_implementation: eager
