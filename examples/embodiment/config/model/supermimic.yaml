model_type: "supermimic"

model_path: ""
precision: "32"
is_lora: False

num_action_chunks: 1
action_dim: 29

# gencoord: root pose and joint state; maxcoord: tracked-body poses and twists.
# A checkpoint only loads into the representation it was trained with.
representation: gencoord

# Compile the training scans, the env's observation and reward pieces and the
# G1 kinematics on large CUDA batches; False keeps them eager.
torch_compile: True
