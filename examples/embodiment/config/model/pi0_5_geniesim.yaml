# pi0.5 configuration for GenieSim G2 dual-arm checkpoints.
model_type: "openpi"

model_path: "/path/to/checkpoint/sft_pi05_genie_sim_..._torch"

precision: null # OpenPI selects its own precision.
pi05: True

# The checkpoint predicts 10 actions over 14 joints and 2 grippers.
num_action_chunks: 10
action_dim: 16

# LoRA settings
is_lora: False
lora_rank: 32

# Training settings
num_steps: 10
add_value_head: False

# Use normalization statistics from the checkpoint.
openpi_data:
  norm_stats_path: ${..model_path}/assets/norm_stats.json

# openpi specific parameters
openpi:
  task: rl
  config_name: "pi05_geniesim_g2_ah10"
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: null
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200
  torch_compile: True

  # DSRL specific configurations (disabled by default)
  use_dsrl: False
  dsrl_state_dim: 8
  dsrl_action_noise_dim: 32
  dsrl_num_q_heads: 10
  dsrl_image_latent_dim: 64
  dsrl_state_latent_dim: 64
  dsrl_hidden_dims: [128, 128, 128]
