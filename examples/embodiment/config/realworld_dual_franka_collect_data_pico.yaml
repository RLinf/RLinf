defaults:
  - env/realworld_dual_franka_tcp_rot6d@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # One workstation owns both arms, both grippers, and the cameras.
  # Split the arms by raising num_nodes and the controller ranks below.
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: DualFranka
        configs:
          - left_robot_ip: LEFT_ROBOT_IP                    # Replace: left arm FCI IP
            right_robot_ip: RIGHT_ROBOT_IP                  # Replace: right arm FCI IP
            # RealSense ASIC serials from librealsense, not V4L USB serials.
            # Swap left/right/base if the images land on the wrong arm.
            # A wrist that is Lumos uses that camera's by-id path and type lumos.
            base_camera_serials:
              - BASE_CAMERA_SERIAL                          # Replace: librealsense device serial
            base_camera_type: realsense
            left_camera_serials:
              - LEFT_CAMERA_SERIAL                          # Replace: librealsense device serial
            left_camera_type: realsense
            right_camera_serials:
              - RIGHT_CAMERA_SERIAL                         # Replace: librealsense device serial
            right_camera_type: realsense
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: LEFT_GRIPPER_CONNECTION    # Replace: /dev/serial/by-id/...
            right_gripper_connection: RIGHT_GRIPPER_CONNECTION  # Replace: /dev/serial/by-id/...
            left_controller_node_rank: 0
            right_controller_node_rank: 0
            node_rank: 0
            # Defaults only act on 8 mm / 0.04 rad of error (~8 N, ~2 Nm), so
            # the TCP lags the hand and then keeps creeping after grip release.
            # K_r stays at 60: 80 Nm/rad with a 0.12 rad clip shook on takeover.
            # max_step stays under the 3 cm/step that trips joint_velocity_violation.
            compliance:
              translational_stiffness: 1000
              rotational_stiffness: 60
              translational_clip: 0.02
              rotational_clip: 0.06
              max_step: 0.02
              max_step_rad: 0.08
              max_delta_tau: 0.2

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data-pico-dual-franka"
    logger_backends: ["tensorboard"]
  num_data_episodes: 20
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    no_gripper: False
    ignore_terminations: False
    auto_reset: False
    teleop:
      - {pico: {drives: left}}
      - {pico: {drives: right}}

    # Keep long enough for manual collection. The keyboard wrapper normally
    # terminates successful episodes before this limit.
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000

    # Episode keys come from this evdev node, not the collect terminal and not
    # Pico A/B/X/Y (those drive the grippers). A USB keyboard or a pedal that
    # emits a/b/c both work. Replace the by-id path on this machine.
    keyboard_device: /dev/input/by-id/usb-KEYBOARD-event-kbd  # Replace
    #   a (pre)  → start recording at the current pose
    #   a (rec)  → abort, drop buffer, stay at current pose
    #   b (rec)  → bump segment_id (1 s debounce)
    #   c (rec)  → success, info["success"]=True, write LeRobot shard
    keyboard_reward_wrapper: "start_end"

    # PICO teleoperation hyperparameters.
    #
    # Shared keys are copied to both PicoExpert instances. The per-hand blocks
    # below only override values that differ between controllers:
    # left controller -> left arm action slice, right controller -> right arm
    # action slice. PicoTcp composes each controller's delta onto the
    # measured TCP pose, as the 20D DualFrankaTCPEnv rot6d action.
    pico:
      # Address of the external VR publisher. It should publish one JSON stream
      # containing headset_pose, left_controller, right_controller, and buttons.
      # Same machine: ipc:///tmp/vr_data.ipc. Across machines: tcp://<publisher>:<port>.
      zmq_addr: "ipc:///tmp/vr_data.ipc"

      # "dual" creates one PicoExpert per controller and binds left/right
      # controllers to the matching arm.
      hand: "dual"

      # When inactive, command the current TCP pose so the absolute TCP env
      # holds both arms steady instead of consuming a zero absolute pose.
      hold_current_when_inactive: True

      # A controller starts overriding its arm when this trigger exceeds the
      # threshold. If only one hand is active, only that arm is replaced.
      control_trigger: "grip"
      control_threshold: 0.85

      # One button closes and one button opens; no button sends 0.0 so the
      # gripper keeps its current state. Button names are hand-specific below.
      gripper_close_threshold: 0.5

      # Motion gain from controller movement/rotation to TCP delta command.
      # Keep these at or below 1.0. compliance.max_step is the hard per-step cap.
      position_scale: 1.0
      rotation_scale: 1.0

      # If no fresh VR packet arrives within this time, the wrapper stops
      # intervening and holds the current TCP pose.
      max_stale_s: 0.2

      calibration:
        enabled: True
        required: True
        auto_calibrate_on_start: True
        button: "trigger"
        threshold: 0.5
        head_forward_axis: "-z"
        base_position: [0.0, 0.0, 0.0]

      # Per-hand button overrides. The common PICO naming convention is
      # left controller X/Y and right controller A/B. If your VR publisher uses
      # different names, change these strings to match the JSON keys in buttons.
      left:
        gripper_close_button: "X"
        gripper_open_button: "Y"
      right:
        gripper_close_button: "A"
        gripper_open_button: "B"

    override_cfg:
      max_num_steps: 10000
      task_description: TASK_DESCRIPTION  # Replace: prompt written into LeRobot
      # Preview needs a display. Headless OpenCV disables the window and continues.
      enable_camera_player: False
      # xyz must sit inside env ee_pose_limit_min/max (x in [0.3, 0.9], z in [0.02, 0.7]).
      # joint_reset_qpos, when set, is 7 joint angles per arm, not this pose.
      target_ee_pose:                         # Replace if your workspace differs
        - [0.5, -0.2, 0.5, -3.14, 0.0, 0.0]
        - [0.5,  0.2, 0.5, -3.14, 0.0, 0.0]
      success_hold_steps: 1
      use_dense_reward: False


    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      resume: True
      export_format: "lerobot"
      only_success: True
      robot_type: "dual_FR3"
      fps: 10
