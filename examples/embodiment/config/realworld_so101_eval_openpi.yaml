# Fixed-checkpoint SO-101 evaluation through the standard embodied runner.
defaults:
  - env/so101_reach@env.eval
  - model/so101_pi05@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    rollout:
      node_group: inference
      placement: 0
    env:
      node_group: so101
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM1
            calibration_id: FOLLOWER_CALIB
            max_relative_target: 5
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  task_type: embodied_eval
  only_eval: true
  ckpt_path: null
  val_check_interval: -1
  rtc:
    enabled: true
    inject_delay_ms: 0
    fixed_delay_steps: 0
    chunk_pause_seconds: 0.0
    min_exec_horizon: 2
    initial_delay_steps: 1
    delay_buffer_size: 8
  logger:
    log_path: ../results
    project_name: so101-openpi
    experiment_name: realworld-so101-eval-openpi
    logger_backends: [tensorboard]

env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    # One episode is capped at about two minutes at the 15 Hz hardware rate.
    # The horizon is divisible by the SO-101 policy's 20-step action chunk.
    rollout_epoch: 1
    total_num_envs: 1
    ignore_terminations: false
    auto_reset: true
    teleop: none
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 1800
    max_steps_per_rollout_epoch: 1800
    override_cfg:
      max_num_steps: 1800
      reset_joint_qpos:
        [-0.06981317, -1.11317483, 0.58689094, 1.45993915, -1.60263420]
      reset_duration: 3.0
      reset_joint_speed: 1.3089969390
      target_joint_qpos: [0, 0, 0, 0, 0]
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false
      task_description: "Finish the user's task."

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
