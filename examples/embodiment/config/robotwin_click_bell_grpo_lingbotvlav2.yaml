defaults:
  - env/robotwin_click_bell@env.train
  - env/robotwin_click_bell@env.eval
  - model/lingbotvlav2@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_grpo_lingbotvlav2"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10

  resume_dir: null # RLinf checkpoint directory for training resume.
  ckpt_path: null # Optional full model weights for evaluation.

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  # Rollouts per seed; the group mean return is the baseline.
  group_size: 8
  reward_coef: 1.0
  log_group_success_metrics: true

  reward_type: chunk_level
  # One PPO ratio per scored coordinate of the sampled SDE step.
  logprob_type: token_level
  entropy_type: token_level

  update_epoch: 1
  recompute_logprobs: true
  # Stop when rollout and actor disagree on a sampled SDE step.
  max_recompute_logprob_gap: 1.0e-3
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"
  # Override the default values in env/robotwin_click_bell
  train:
    rollout_epoch: 1
    total_num_envs: 64
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/train_seeds.json
    center_crop: False
    enable_offload: True
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 400
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 400
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    enable_offload: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: bf16

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Must equal actor.model.forward_micro_batch_size so every replay chunk has
  # the rollout's GEMM shape.
  micro_batch_size: 16
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  model:
    add_value_head: false
    # The 36-layer action expert is launch-bound at batch 1: one velocity call
    # costs the same for 1 and 16 samples. 16 is every env a rollout worker
    # owns (env.train.total_num_envs / cluster ranks) and divides the actor's
    # per-rank batch, so rollout and replay chunk to the same shape.
    forward_micro_batch_size: 16
    # fp32 trainable weights keep each optimizer step; FSDP2 computes in bf16.
    precision: fp32

  optim:
    lr: 5.6e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp2"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      # The adapter casts network inputs; recorded SDE samples must remain FP32.
      cast_forward_inputs: false

reward:
  use_reward_model: False

critic:
  use_critic_model: False
