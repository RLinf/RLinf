defaults:
  - base/embodied_rl
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0@actor.model
  - algorithm/grpo@algorithm
  - _self_

runner:
  logger:
    experiment_name: "libero_spatial_grpo_openpi"

algorithm:
  update_epoch: 2

env:
  train:
    rollout_epoch: 8
    total_num_envs: 64
    group_size: ${algorithm.group_size}
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    is_eval: True
    video_cfg:
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False

actor:
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 42
  enable_offload: False
  model:
    model_path: "/path/to/model/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT" # https://huggingface.co/RLinf/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT
    num_action_chunks: 5
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
  fsdp_config:
    sharding_strategy: "no_shard"
