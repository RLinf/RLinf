normalize_advantages: True
kl_penalty: kl
group_size: 1

reward_type: action_level
logprob_type: action_level
entropy_type: action_level

adv_type: gae
loss_type: actor_critic
loss_agg_func: "token-mean"

kl_beta: 0.0
entropy_bonus: 0
clip_ratio_high: 0.2
clip_ratio_low: 0.2
clip_ratio_c: 3.0
value_clip: 0.2

huber_delta: 10.0

gamma: 0.99
gae_lambda: 0.95
