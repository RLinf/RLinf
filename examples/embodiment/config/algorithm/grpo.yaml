normalize_advantages: True
kl_penalty: kl
group_size: 8
reward_coef: 1.0

reward_type: chunk_level
logprob_type: chunk_level
entropy_type: token_level

adv_type: grpo
loss_type: actor
loss_agg_func: "token-mean"

kl_beta: 0.0
entropy_bonus: 0
clip_ratio_high: 0.2
clip_ratio_low: 0.2
clip_ratio_c: 3.0
value_clip: 0.2

huber_delta: 10.0

gamma: 0.99
gae_lambda: 0.95

filter_rewards: True
rewards_lower_bound: 0.1
rewards_upper_bound: 0.9
