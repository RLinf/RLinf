defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/cosmos3@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

weight_syncer:
  bucket:
    # Verify synchronized student parameters before each scheduled evaluation.
    verify_interval: 300

runner:
  task_type: embodied
  logger:
    log_path: /path/to/log
    project_name: rlinf
    experiment_name: cosmos3_dagger_libero_10
    logger_backends: ["tensorboard"]

  max_epochs: 6000
  max_steps: -1

  only_eval: false
  val_check_interval: 100
  save_interval: 600

  resume_dir: null
  ckpt_path: /path/to/student
  expert_ckpt_path: /path/to/expert

algorithm:
  reward_coef: 1.0
  
  dagger:
    init_beta: 1.0
    beta_schedule: exponential
    beta_decay: 0.999
    beta_min: 0.05
    only_save_expert: false
    online_lerobot:
      enabled: True
      only_success: True
      robot_type: "panda"
      fps: 10
      training_action_horizon: 16
      finalize_interval: 8
      data_path: /path/to/dataset
      rolling_lerobot_window_size: 20000
      lerobot_num_workers: 0
      # Start training once this many complete training windows are available.
      min_frames: 1024

  update_epoch: 4
  loss_type: embodied_dagger
  adv_type: gae

env:
  group_name: EnvGroup
  train:
    init_params: {ignore_done: true}
    skip_intermediate_renders: False
    rollout_epoch: 1
    total_num_envs: 16
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 512
    # Cover the episode horizon with complete ten-action chunks.
    max_steps_per_rollout_epoch: 520
    group_size: 1
    auto_reset: true
    seed: 42
    video_cfg:
      save_video: false
  eval:
    init_params: {ignore_done: true}
    rollout_epoch: 1
    total_num_envs: 256
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  enable_offload: false
  enable_torch_compile: false
  enable_cuda_graph: false
  pipeline_stage_num: 1
  collect_prev_infos: false
  model:
    model_path: /path/to/Cosmos3-Edge-DCP
    action_model_mode: wam
    sft_objective: joint
    precision: ${actor.model.precision}
    load_to_device: true
    ema_enabled: false
  expert_model:
    model_path: /path/to/Cosmos3-Edge-DCP
    precision: ${actor.model.precision}
    load_to_device: true
    ema_enabled: false
    action_model_mode: wam
    sft_objective: joint

actor:
  group_name: ActorGroup
  model:
    model_path: /path/to/Cosmos3-Edge-DCP
    action_model_mode: wam
    sft_objective: joint
    num_inference_steps: 30
    ema_enabled: true
    keys_to_select:
      - moe_gen
      - time_embedder
      - vae2llm
      - llm2vae
      - action2llm
      - llm2action
      - action_modality_embed
      - k_norm_und_for_gen
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 512
  seed: 42
  enable_offload: false
  optim:
    lr: 5e-5
    adam_beta1: 0.9
    adam_beta2: 0.99
    adam_eps: 1.0e-08
    weight_decay: 0.05
    clip_grad: 1.0
    lr_warmup_steps: 20

  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: False
    reshard_after_forward: true
    enable_gradient_accumulation: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: fp32
      buffer_dtype: null
      cast_forward_inputs: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
