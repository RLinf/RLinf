# Success + Potential overrides for the existing maniskill_ppo_mlp recipe.
# Use the base recipe without this overlay for ordinary environment-reward PPO.

cluster:
  component_placement:
    env,rollout,actor,reward: 0-3

runner:
  logger:
    experiment_name: vlm_trend_success_potential_ppo
  max_epochs: 160
  max_steps: 160
  val_check_interval: 5
  save_interval: 20
  ckpt_path: ${oc.env:POLICY_CHECKPOINT}

algorithm:
  update_epoch: 2
  kl_beta: 0.01
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  gamma: 0.99

data:
  rollout_batch_size: 1024

env:
  train:
    total_num_envs: 1024
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    use_full_state: true
    wrap_obs_mode: simple
    reward_mode: only_success
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    init_params:
      id: PickCube3View-v1
      obs_mode: rgb
      control_mode: pd_joint_delta_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 100
        control_freq: 20
      sensor_configs:
        shader_pack: minimal
        width: 224
        height: 224
      human_render_camera_configs:
        shader_pack: minimal
        width: 224
        height: 224
      render_mode: all
    use_3rd_view_as_extra: true
  eval:
    total_num_envs: 1024
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    use_full_state: true
    wrap_obs_mode: simple
    reward_mode: only_success
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    init_params:
      id: PickCube3View-v1
      obs_mode: rgb
      control_mode: pd_joint_delta_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 100
        control_freq: 20
      sensor_configs:
        shader_pack: minimal
        width: 224
        height: 224
      human_render_camera_configs:
        shader_pack: minimal
        width: 224
        height: 224
      render_mode: all
    use_3rd_view_as_extra: true
    video_cfg:
      save_video: false

rollout:
  model: ${actor.model}
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  micro_batch_size: 1600
  global_batch_size: 6400
  optim:
    lr: 1.0e-5
    value_lr: 3.0e-5

reward:
  use_reward_model: true
  group_name: RewardGroup
  reward_mode: history_buffer
  history_reward_assign: false
  reward_weight: 1.0
  env_reward_weight: 0.0
  model:
    model_path: ${oc.env:VLM_MODEL_PATH,/path/to/Qwen3-VL-4B-Instruct}
    model_type: buffered_vlm
    lora_path: ${oc.env:VLM_TREND_POTENTIAL_CHECKPOINT}
    scalar_head_path: ${oc.env:VLM_TREND_SCALAR_HEAD}
    success_lora_path: ${oc.env:VLM_TREND_SUCCESS_CHECKPOINT}
    precision: bf16
    gt_success_bonus: 0.0
    inference_mode: scalar_head
    input_builder_name: vlm_trend_reward_input_builder
    input_builder_params:
      default_task_description: Pick up the red cube and place it on the green spot on the table.
      include_task: true
      num_bins: 10
      prompt_template: >-
        You are estimating task-conditioned success potential for a robot
        manipulation state.{task_text} The two synchronized videos show the same
        5-frame history from two camera views. Predict the final state's
        potential as exactly one digit from 0 to {num_bins_max}, where 0 is
        furthest from eventual success and {num_bins_max} is closest.
    success_input_builder_name: vlm_trend_reward_input_builder
    success_input_builder_params:
      default_task_description: Pick up the red cube and place it on the green spot on the table.
      include_task: true
      prompt_template: >-
        Estimate task-conditioned success potential for this robot manipulation
        state.{task_text} The two synchronized videos show the same 5-frame
        history from two camera views.
    success_reward_parser_name: vlm_trend_binary_digit_reward_parser
    success_reward_parser_params:
      positive_reward: 1.0
      negative_reward: 0.0
      invalid_reward: 0.0
    potential_scale: 1.0
    potential_gamma: 1.0
    potential_ema_alpha: 0.5
    potential_clip: 0.15
    success_threshold: 0.5
    success_confirmation_windows: 1
    success_bonus: 1.0
    success_max_new_tokens: 3
    history_buffers:
      history_window:
        history_size: 5
        min_history_size: 5
        input_interval: 5
        history_keys: [main_images, extra_view_images]
        input_on_done: true
        input_on_done_full_window: true
    interval_reward: 0.0
    enable_history_offload: true
    infer_micro_batch_size: 32
    subprocessor_kwargs:
      video_processor:
        do_sample_frames: true
    max_new_tokens: 16
    do_sample: false
    temperature: 0.0
    use_chat_template: true
