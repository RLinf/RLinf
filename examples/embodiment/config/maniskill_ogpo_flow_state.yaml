defaults:
  - env/maniskill_pick_cube@env.train
  - env/maniskill_pick_cube@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  ckpt_path: /path/to/ogpo_bc.pt
  ckpt_allowed_missing_prefixes: ["q_head.", "action_scale", "action_bias"]
  use_training_pipeline: False
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_ogpo_flow_state"
    logger_backends: ["tensorboard"]
  max_epochs: 8000
  max_steps: -1
  only_eval: False
  val_check_interval: 100
  save_interval: 20000

algorithm:
  loss_type: embodied_ogpo
  adv_type: raw
  loss_agg_func: token-mean
  group_size: 32
  update_epoch: 8
  gamma: 0.99
  replay_buffer:
    enable_cache: True
    cache_size: 200000
    sample_window_size: 200000
    min_buffer_size: 100
  ogpo:
    constant_noise_std: 0.005
    clip_epsilon: 0.01
    bc_coeff: 0.1
    q_warmup_steps: 100
    q_utd: 8
    pi_utd: 2
    actor_tau: 0.005
    critic_tau: 0.01

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 32
    init_params:
      reward_mode: "sparse"
    auto_reset: True
    ignore_terminations: False
    use_fixed_reset_state_ids: False
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
  eval:
    rollout_epoch: 1
    total_num_envs: 32
    init_params:
      reward_mode: "sparse"
    auto_reset: True
    ignore_terminations: False
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    use_fixed_reset_state_ids: False
    group_size: 32
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: False
  pipeline_stage_num: 1
  collect_prev_infos: False
  collect_transitions: True
  collect_final_values: False
  model:
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 512
  global_batch_size: 512
  seed: 1234
  enable_offload: False
  model:
    model_type: flow_policy
    input_type: state
    policy_setup: panda-ee-dpos
    obs_dim: 42
    action_dim: 4
    num_action_chunks: 4
    use_state_encoder: False
    precision: "32"
    add_value_head: False
    add_q_head: True
    num_q_heads: 10
    q_hidden_dims: [512, 512, 512, 512]
    flow_actor_type: OGPOFlowActor
    denoising_steps: 10
    flow_mlp_hidden_dims: [512, 512, 512, 512]
    is_lora: False
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 1.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
