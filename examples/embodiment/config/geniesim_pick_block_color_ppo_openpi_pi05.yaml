# GenieSim pick_block_color π0.5 PPO training configuration.
defaults:
  - env/geniesim@env.train
  - env/geniesim@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # The batch sizes assume one actor GPU: global_batch_size must divide by
    # micro_batch_size times the actor GPU count.
    actor,rollout: 0
    env: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "geniesim_pick_block_color_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 200
  max_steps: -1

  only_eval: False
  eval_policy_path: null

  val_check_interval: -1
  save_interval: 20

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 4
    total_num_envs: 32
    auto_reset: False
    max_steps_per_rollout_epoch: 200
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
    override_cfg:
      addresses:
        - tcp://${oc.env:GENIESIM_HOST_0}:5601
        - tcp://${oc.env:GENIESIM_HOST_0}:5602
      task_name: table_task_1_g2_op
      sub_task_name: pick_block_color

  eval:
    seed: -1
    # 32 envs over 4 epochs = 128 trajectories across two eval slots.
    rollout_epoch: 4
    total_num_envs: 32
    auto_reset: False
    max_steps_per_rollout_epoch: 200
    video_cfg:
      # Recording renders every substep, which costs the one-call chunk
      # path. Turn it on when you want the rollout videos.
      save_video: False
      fps: 10
    override_cfg:
      addresses:
        - tcp://${oc.env:GENIESIM_EVAL_HOST,127.0.0.1}:5603
        - tcp://${oc.env:GENIESIM_EVAL_HOST,127.0.0.1}:5604
      task_name: ${env.train.override_cfg.task_name}
      sub_task_name: ${env.train.override_cfg.sub_task_name}

rollout:
  group_name: "RolloutGroup"
  rollout_backend: huggingface
  generation_backend: huggingface
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 2
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 128
  global_batch_size: 512
  seed: 42
  enable_offload: False

  model:
    model_path: ${oc.env:GENIESIM_CHECKPOINT_PATH}
    # The G2 checkpoint predicts 14 joints and 2 grippers.
    action_dim: 16
    num_steps: 10
    add_value_head: True
    openpi_data:
      norm_stats_path: ${..model_path}/assets/norm_stats.json
    openpi:
      config_name: "pi05_geniesim_g2_ah10"
      value_after_vlm: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 200
    min_lr_rate: 0.1
    lr_scheduler: "cosine"

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    enable_gradient_accumulation: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
