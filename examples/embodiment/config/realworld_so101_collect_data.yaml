# SO-101 teleoperation data collection
# Human demonstration collection via leader arm

defaults:
  - env/so101_reach@env.train
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: so101
      placement: 0
  node_groups:
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM0
            calibration_id: FOLLOWER_CALIB  # Replace: follower arm calibration ID
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: so101-collect
    experiment_name: "realworld-so101-collect-data"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: false
  num_data_episodes: 10
  record_task_description: false

env:
  group_name: "EnvGroup"
  enable_offload: false

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: false
    ignore_terminations: true
    no_gripper: false
    teleop:
      - so101_leader:
          port: /dev/ttyACM1
          calibration_id: LEADER_CALIB  # Replace: leader arm calibration ID
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      max_num_steps: 10000
      task_description: TASK_DESCRIPTION  # Replace: task prompt
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false
    data_collection:
      enabled: true
      save_dir: ${runner.logger.log_path}/collected_data
      # Write the finalized LeRobot tree consumed by SO101 SFT and the
      # offline checker. Pickle remains useful for debugging, but cannot be
      # passed directly to the OpenPI dataloader.
      export_format: lerobot
      only_success: true
      robot_type: so101
      fps: 15
      finalize_interval: 1

algorithm:
  collect_only: true
