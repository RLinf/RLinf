defaults:
  - base/embodied_rl
  - env/manikill_put_carrot_on_plate_in_scene@env.train
  - env/manikill_put_carrot_on_plate_in_scene@env.eval
  - model/openvla@actor.model
  - algorithm/ppo@algorithm
  - _self_

runner:
  logger:
    experiment_name: "maniskill_ppo_openvla_quickstart"

algorithm:
  bootstrap_type: always
  ratio_clip_eps: 0.2

env:
  train:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    enable_offload: True
  eval:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    enable_offload: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  pipeline_stage_num: 2
  gpu_memory_utilization: 0.5
  enforce_eager: True
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 7

actor:
  micro_batch_size: 20
  global_batch_size: 160
  model:
    model_path: "gen-robot/openvla-7b-rlvla-warmup"
    add_value_head: True
    is_lora: True
