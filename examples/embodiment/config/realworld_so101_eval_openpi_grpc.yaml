# Robot-side Ray only; the GPU server is external (direct network or SSH).
defaults:
  - realworld_so101_eval_openpi
  - _self_

cluster:
  component_placement:
    rollout:
      node_group: inference
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
      ignore_hardware: true
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM1
            calibration_id: FOLLOWER_CALIB
            max_relative_target: 5
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  rtc:
    enabled: true

rollout:
  rollout_backend: grpc
  grpc:
    mode: external
    server_address: 127.0.0.1:50051
    policy_id: so101-pi05
    timeout_s: 30.0
    startup_timeout_s: 180.0
    group_name: PolicyServerGroup
    server:
      host: 127.0.0.1
      port: 0
      device: cuda:0
      enable_torch_compile: false
      torch_compile_mode: max-autotune-no-cudagraphs
