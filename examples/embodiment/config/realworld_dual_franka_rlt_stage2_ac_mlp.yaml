defaults:
  - env/realworld_dual_franka_tcp_rot6d@env.train
  - env/realworld_dual_franka_tcp_rot6d@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # Same workstation as collection: both arms and the GPU are on this machine.
  num_nodes: 1
  component_placement:
    actor:
      node_group: franka
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: DualFranka
        configs:
          - left_robot_ip: LEFT_ROBOT_IP                    # Replace: left arm FCI IP
            right_robot_ip: RIGHT_ROBOT_IP                  # Replace: right arm FCI IP
            base_camera_serials:
              - BASE_CAMERA_SERIAL                          # Replace: librealsense device serial
            base_camera_type: realsense
            left_camera_serials:
              - LEFT_CAMERA_SERIAL                          # Replace: librealsense device serial
            left_camera_type: realsense
            right_camera_serials:
              - RIGHT_CAMERA_SERIAL                         # Replace: librealsense device serial
            right_camera_type: realsense
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: LEFT_GRIPPER_CONNECTION    # Replace: /dev/serial/by-id/...
            right_gripper_connection: RIGHT_GRIPPER_CONNECTION  # Replace: /dev/serial/by-id/...
            left_controller_node_rank: 0
            right_controller_node_rank: 0
            node_rank: 0
            compliance:
              translational_stiffness: 1000
              rotational_stiffness: 60
              translational_clip: 0.02
              rotational_clip: 0.06
              max_step: 0.02
              max_step_rad: 0.08
              max_delta_tau: 0.2

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "realworld_rlt_stage2_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  # Resume a saved Stage2 training run from a full RLinf checkpoint directory.
  # Do not point this to the Stage1 OpenPI checkpoint.
  resume_dir: null
  # Optional single Stage2 weight file, e.g. actor/model_state_dict/full_weights.pt.
  # For normal Stage2 training from scratch, keep this null.
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  # RLT Stage2 actor loss: -q_weight * Q + bc_weight * BC.
  q_weight: 0.1
  bc_weight: 5

  # Reference-action dropout on the actor input, as in RLT Stage2.
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  # Entropy/alpha is kept at zero; this is not standard maximum-entropy SAC.
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  # Shared by train and eval. Left grip drives the left arm, right grip the right.
  pico: &pico
    zmq_addr: "ipc:///tmp/vr_data.ipc"
    hand: "dual"
    # False so a released grip returns control to the policy. True holds the
    # measured pose on every step and the model action never reaches the arms.
    hold_current_when_inactive: False
    control_trigger: "grip"
    control_threshold: 0.85
    gripper_close_threshold: 0.5
    position_scale: 1.2
    rotation_scale: 1.0
    max_stale_s: 0.2
    calibration:
      enabled: True
      required: True
      auto_calibrate_on_start: True
      button: "trigger"
      threshold: 0.5
      head_forward_axis: "-z"
      base_position: [0.0, 0.0, 0.0]
    left:
      gripper_close_button: "X"
      gripper_open_button: "Y"
    right:
      gripper_close_button: "A"
      gripper_open_button: "B"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    main_image_key: base_0_rgb
    # USB keyboard b switches the rollout from the Stage1 policy to the Stage2 actor.
    # Pico A/B/X/Y stay gripper buttons.
    keyboard_device: /dev/input/by-id/usb-KEYBOARD-event-kbd  # Replace
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    teleop:
      - {pico: {drives: left}}
      - {pico: {drives: right}}
    pico: *pico
    no_gripper: False
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      task_description: TASK_DESCRIPTION  # Replace: prompt for the Stage1 policy
      max_num_steps: 10000
      target_ee_pose:                         # Replace if your workspace differs
        - [0.5, -0.2, 0.5, -3.14, 0.0, 0.0]
        - [0.5,  0.2, 0.5, -3.14, 0.0, 0.0]
      success_hold_steps: 1
      enable_camera_player: False

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    main_image_key: base_0_rgb
    keyboard_device: /dev/input/by-id/usb-KEYBOARD-event-kbd  # Replace
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 1000
    max_steps_per_rollout_epoch: 1000
    use_fixed_reset_state_ids: False
    group_size: 1
    teleop:
      - {pico: {drives: left}}
      - {pico: {drives: right}}
    pico: *pico
    no_gripper: False
    override_cfg:
      is_dummy: False
      use_dense_reward: False
      task_description: TASK_DESCRIPTION  # Replace: prompt for the Stage1 policy
      max_num_steps: 1000
      target_ee_pose:                         # Replace if your workspace differs
        - [0.5, -0.2, 0.5, -3.14, 0.0, 0.0]
        - [0.5,  0.2, 0.5, -3.14, 0.0, 0.0]
      success_hold_steps: 1
      enable_camera_player: False
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  # Synced Stage2 MLP policy used by rollout inference.
  # During training (runner.only_eval=False), rollout builds this from actor.model
  # and then receives fresh weights from the actor via RLinf weight_syncer.
  # Keep model_path null for scratch Stage2 training; do not set it to Stage1.
  # To resume/load Stage2 weights, use runner.resume_dir or runner.ckpt_path.
  model:
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}

  # Frozen Stage1 pi0.5 + RLT token transformer.
  # This is the actual Stage1 model path. Rollout uses it to convert raw env
  # observations into the Stage2 obs dict: z_rl, proprio, ref_chunk.
  rlt_feature_model:
    model_type: "openpi"
    precision: bf16
    is_lora: False
    num_action_chunks: 20
    action_dim: 20
    num_steps: 4
    add_value_head: False
    # Checkpoint produced by examples/sft/config/realworld_rlt_stage1_sft_openpi_pi05.yaml.
    model_path: "/path/to/stage1/checkpoint"  # Replace: dual-arm Stage1 OpenPI checkpoint
    openpi_data:
      # Must match the repo_id used to compute Stage1 OpenPI norm stats.
      repo_id: STAGE1_REPO_ID  # Replace
    openpi:
      task: eval
      config_name: "pi05_dualfranka_tcp_rot6d"
      num_images_in_input: 3
      # Network prediction horizon (Pi0Config.action_horizon). Matches official
      # TrainConfig for config_name pi05_dualfranka_tcp_rot6d. Distinct from
      # action_chunk / num_action_chunks, which is the env-executed (RLT) window.
      action_horizon: 20
      action_chunk: ${actor.model.ref_num_action_chunks}
      action_env_dim: ${rollout.rlt_feature_model.action_dim}
      num_steps: 4
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: False
      # Full dual-arm state is Stage2 proprio: gripper_position (2) then tcp_pose_rot6d (18).
      state_indices: []
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      use_rlt: True
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  # Stage2 head only. Keep model_path null for scratch training; resume/load
  # uses runner.resume_dir or runner.ckpt_path, not the Stage1 OpenPI ckpt.
  model:
    model_type: "rlt_mlp_policy"
    model_path: null

    # RLT AC defaults to fp32 for Q-learning and target-update stability.
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    is_lora: False

    # RLT Stage2 MLP input/output shape.
    z_dim: 2048
    proprio_dim: 20
    action_dim: 20
    num_action_chunks: 10
    ref_num_action_chunks: 20

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False