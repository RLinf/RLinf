defaults:
  - env/realworld_franka_sft_env@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2    # Replace with your Franka IP
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data"
    logger_backends: ["tensorboard"] # wandb, swanlab
  num_data_episodes: 20
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    max_episode_steps: 10000
    override_cfg:
      # Optional per-camera overrides keyed by RealSense serial number.
      # camera_names:
      #   "SERIAL1": global
      #   "SERIAL2": wrist_1
      # camera_crop_regions:
      #   "SERIAL1": [0.4, 0.3, 0.85, 0.7]
      target_ee_pose: [ 0.48080516 , 0.03845225 , 0.12896912 ,-3.13426043 , 0.07689922  ,0.02956389]
      success_hold_steps: 1  # define how many consecutive steps the robot must hold the position to succeed

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: "lerobot"
      only_success: True
      robot_type: "panda"
      fps: 10
