defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - model/pi0_5@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_ppo_openpi_pi05_phyai"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # Correct the behavior/replay policy mismatch at the sample level.
  importance_sampling_fix: True
  importance_sampling_clip: 1.0
  recompute_logprobs: True
env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 240 # max episode steps for truncation
    max_steps_per_rollout_epoch: 240
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  rollout_backend: phyai
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/RLinf-Pi05-LIBERO-SFT" # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}
    model_type: ${actor.model.model_type}
    num_action_chunks: ${actor.model.num_action_chunks}
    action_dim: ${actor.model.action_dim}
    num_steps: ${actor.model.num_steps}
    add_value_head: ${actor.model.add_value_head}
    openpi: ${actor.model.openpi}

  phyai:
    plugin: pi05
    # Override when the PhyAI source tree is mounted elsewhere.
    kernel_config: ${oc.env:PHYAI_KERNEL_CONFIG,/opt/src/phyai/examples/configs/kernel_policies/pi05/rlinf_bf16.yaml}
    max_batch_size: null
    vision_params_dtype: null
    use_cuda_graph: True
    runtime:
      flashinfer_workspace_bytes: 4294967296

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  model:
    model_path: "/path/to/model/RLinf-Pi05-LIBERO-SFT" # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    model_type: "openpi"
    num_action_chunks: 5 # interface for the env
    action_dim: 7
    num_steps: 3
    add_value_head: True
    openpi:
      task: rl
      config_name: "pi05_libero"
      action_horizon: 10
      num_images_in_input: 2
      action_chunk: ${..num_action_chunks}
      num_steps: ${..num_steps}
      action_env_dim: ${..action_dim}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: True
      joint_logprob: False
      ignore_last: True
      noise_level: 0.5
      noise_method: "flow_sde"
      train_expert_only: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
