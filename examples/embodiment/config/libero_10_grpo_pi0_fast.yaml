defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_fast@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_grpo_pi0_fast"
    logger_backends: ["tensorboard"]

  max_epochs: 330
  max_steps: 330
  only_eval: False
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: sequence_token_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  log_entropy_metrics: True
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -20
  clip_log_ratio_max: 20

  filter_rewards: True
  log_group_success_metrics: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    # 16 environments/GPU x 16 GPUs x 4 rollout epochs = 1024 trajectories.
    rollout_epoch: 4
    total_num_envs: 256
    seed: 0
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    # Periodic training eval uses 16 fixed environments per GPU.
    total_num_envs: 256
    seed: 0
    reward_coef: ${algorithm.reward_coef}
    auto_reset: False
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 0.3
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: ${actor.model.pi0_fast.max_action_tokens}

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    precision: ${actor.model.precision}
    pi0_fast:
      # Rollout is inference-only; keeping this disabled also avoids checkpointing
      # enable/disable churn around every KV-cache generation.
      gradient_checkpointing: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  # 1024 trajectories x 52 action chunks = 53,248 samples,
  # split into four exact optimizer batches of 13,312 samples.
  global_batch_size: 13312
  seed: 1234
  enable_offload: False

  model:
    is_lora: True
    lora_rank: 16
    lora_target_scope: "all_linear"
    pi0_fast:
      gradient_checkpointing: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    use_fp32_master_params: True

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
      cast_forward_inputs: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False

weight_syncer:
  patch:
    transport_device: cpu
