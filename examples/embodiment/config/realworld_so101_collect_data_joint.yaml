# SO-101 joint-space demonstration collection.
defaults:
  - env/so101_reach@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: so101
      placement: 0
  node_groups:
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /path/to/follower_serial_port
            calibration_id: "<follower_calibration_id>"
            camera_type: uvc
            camera_serials: ["/dev/v4l/by-id/<camera_id>"]

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: so101-collect
    experiment_name: "realworld-so101-collect-data"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: false
  num_data_episodes: 10
  record_task_description: false

env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: false
    ignore_terminations: false
    no_gripper: false
    teleop:
      - so101_leader:
          port: /path/to/leader_serial_port
          calibration_id: "<leader_calibration_id>"
          align_fps: 30.0
          manual_start_hold_seconds: 3.0
    keyboard_reward_wrapper: null
    so101_episode_wrapper: start_end
    max_episode_steps: null
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      max_num_steps: 10000
      task_description: "<task description>"
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false
      step_frequency: 15.0
      reset_on_init: false
      reset_joint_qpos:
        [-0.06981317, -1.11317483, 0.58689094, 1.45993915, -1.60263420]
      reset_gripper_position: 0.01265823
      reset_duration: 3.0
      reset_joint_speed: 1.3089969390
    data_collection:
      enabled: true
      save_dir: ${runner.logger.log_path}/collected_data
      export_format: lerobot_dataset
      only_success: true
      robot_type: so101
      fps: 15
      finalize_interval: 1
