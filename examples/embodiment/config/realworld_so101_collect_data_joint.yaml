# SO-101 teleoperation data collection
# Human demonstration collection via leader arm

defaults:
  - env/so101_reach@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: so101
      placement: 0
  node_groups:
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM1
            calibration_id: FOLLOWER_CALIB  # Replace: follower arm calibration ID
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: so101-collect
    experiment_name: "realworld-so101-collect-data"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: false
  num_data_episodes: 10
  record_task_description: true

env:
  group_name: "EnvGroup"
  enable_offload: false

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: false
    ignore_terminations: false
    no_gripper: false
    teleop:
      - so101_leader:
          port: /dev/ttyACM0
          calibration_id: LEADER_CALIB  # Replace: leader arm calibration ID
          align_duration_s: 3.0
          align_fps: 30.0
          manual_start_hold_seconds: 3.0
    keyboard_reward_wrapper: start_end
    max_episode_steps: null
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      max_num_steps: 10000
      task_description: "抓取青色目标物体并放到盒子里面"
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false
      step_frequency: 15.0
      reset_on_init: false
      reset_joint_qpos:
        [-0.06981317, -1.11317483, 0.58689094, 1.45993915, -1.60263420]
      reset_gripper_position: 0.01265823
      reset_duration: 5.0
      reset_joint_speed: 0.5235987756
      park_joint_qpos:
        [0.02685122, -1.74072619, 1.66400842, -1.65633664, -2.78408785]
      park_gripper_position: 0.01661392
      park_duration: 5.0
    data_collection:
      enabled: true
      save_dir: ${runner.logger.log_path}/collected_data
      # Write the finalized LeRobot tree consumed by SO101 SFT and the
      # offline checker. Pickle remains useful for debugging, but cannot be
      # passed directly to the OpenPI dataloader.
      export_format: lerobot
      only_success: true
      robot_type: so101
      fps: 15
      finalize_interval: 1
