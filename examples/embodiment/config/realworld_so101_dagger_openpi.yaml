# SO-101 online DAgger training with OpenPI policy
# Base configuration for SO-101 robot with human intervention via leader arm

defaults:
  - env/so101_reach@env.train
  - env/so101_reach@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: inference
      placement: 0
    rollout:
      node_group: inference
      placement: 0
    env:
      node_group: so101
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: so101
      node_ranks: 0
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM0
            calibration_id: FOLLOWER_CALIB
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: so101-openpi
    experiment_name: "realworld-so101-dagger-openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 200
  resume_dir: null
  ckpt_path: null

algorithm:
  dagger:
    # Train on every frame from successful episodes. Human-intervened frames
    # still carry intervene_flag=True and store the executed expert action.
    only_save_expert: True
    online_lerobot:
      enabled: True
      only_success: True
      robot_type: "so101"
      fps: 15
      # Real-world episodes are expensive; archive every completed success.
      finalize_interval: 1
      data_path: ${runner.logger.log_path}/online_lerobot
      rolling_lerobot_window_size: 50000
      min_frames: 1
      lerobot_num_workers: 0

  gamma: 0.99
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    rollout_epoch: 1
    total_num_envs: 1
    smooth_intervene: True
    ignore_terminations: False
    auto_reset: True
    no_gripper: False
    teleop:
      - so101_leader:
          port: /dev/ttyACM1
          calibration_id: LEADER_CALIB
    # For online DAgger, use eval_control rather than start_end: the async env
    # worker does not consume start_end's pre_record / record_reset fields.
    # Pedals: a=start rollout, b=end failure, c=end success.
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      max_num_steps: 10000
      task_description: TASK_DESCRIPTION  # Replace: prompt for the SFT policy
      success_hold_steps: 1
      use_dense_reward: False
      enable_camera_player: False

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    ignore_terminations: False
    auto_reset: True
    no_gripper: False
    teleop: none
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      task_description: ${env.train.override_cfg.task_description}
      max_num_steps: 10000
      success_hold_steps: 1
      use_dense_reward: False
      enable_camera_player: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  sync_weight_nccl_max_ctas: 32
  model:
    # SFT ckpt expected layout:
    #   <model_path>/actor/model_state_dict/full_weights.pt
    #   <model_path>/<openpi_data.repo_id>/norm_stats.json
    model_path: MODEL_PATH  # Replace: node-0 path to DEPLOY_CKPT/global_step_<N>/
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False

  model:
    model_path: ${rollout.model.model_path}
    precision: null
    num_action_chunks: 20
    action_dim: 8
    add_value_head: False
    openpi:
      config_name: "pi05_so101_joint"
      train_expert_only: False
      detach_critic_input: True
      action_chunk: ${actor.model.num_action_chunks}
    openpi_data:
      repo_id: "id_0"

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 4.0
    warmup_style: "cosine"
    lr_warmup_steps: 20
    total_training_steps: 1000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
