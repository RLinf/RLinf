# SO-101 online DAgger training with OpenPI policy
# Human-in-the-loop: leader arm intervention + smooth action blending

defaults:
  - env/so101_reach@env.train
  - env/so101_reach@env.eval
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout,env: all
  node_groups:
    - label: so101_node
      node_ranks: [0]
      hardware:
        type: SO101
        configs:
          - node_rank: 0
            serial_port: /dev/ttyACM0
            calibration_id: FOLLOWER_CALIB
            camera_type: uvc
            camera_serials: [/dev/video0]

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "so101_dagger_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 200
  resume_dir: null
  ckpt_path: null

algorithm:
  dagger:
    only_save_expert: true
    online_lerobot:
      enabled: true
      only_success: true
      robot_type: "so101"
      fps: 15
      finalize_interval: 1
      data_path: ${runner.logger.log_path}/online_lerobot
      rolling_lerobot_window_size: 50000
      min_frames: 1
      lerobot_num_workers: 0

  gamma: 0.99
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger

env:
  group_name: "EnvGroup"
  enable_offload: false

  train:
    rollout_epoch: 1
    total_num_envs: 1
    smooth_intervene: true
    teleop_intervention:
      mode: explicit
      hold_buffer_seconds: 3.0
    ignore_terminations: false
    auto_reset: true
    no_gripper: false
    teleop:
      - so101_leader:
          port: /dev/ttyACM1
          calibration_id: LEADER_CALIB
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      max_num_steps: 10000
      task_description: "TASK_DESCRIPTION"  # Replace with actual task prompt
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    ignore_terminations: false
    auto_reset: true
    no_gripper: false
    teleop: none
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000
    override_cfg:
      task_description: ${env.train.override_cfg.task_description}
      max_num_steps: 10000
      success_hold_steps: 1
      use_dense_reward: false
      enable_camera_player: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
  sync_weight_nccl_max_ctas: 32

  model:
    # SFT checkpoint layout:
    #   <model_path>/actor/model_state_dict/full_weights.pt
    #   <model_path>/<openpi_data.repo_id>/norm_stats.json
    model_path: /path/to/sft_checkpoint/global_step_N
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: false

  model:
    model_path: ${rollout.model.model_path}
    precision: null
    num_action_chunks: 20
    action_dim: 12  # SO-101 leader + follower: (5 joints + gripper) × 2
    add_value_head: false

    openpi:
      config_name: "pi05_so101_joint"
      action_horizon: 20
      discrete_state_input: false
      train_expert_only: false
      detach_critic_input: true
      action_chunk: ${actor.model.num_action_chunks}
      assets_dir: /path/to/openpi_assets
      asset_id: "<repo_id>"

    openpi_data:
      repo_id: "id_0"

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 4.0
    warmup_style: "cosine"
    lr_warmup_steps: 20
    total_training_steps: 1000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
