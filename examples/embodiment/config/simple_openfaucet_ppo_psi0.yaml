defaults:
  - model/psi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  only_eval: false
  max_epochs: 1
  max_steps: 1
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
  rtc:
    enabled: false
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "simple_openfaucet_ppo_psi0"
    logger_backends: ["tensorboard"]

algorithm:
  group_size: 1
  normalize_advantages: true
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  update_epoch: 1
  gamma: 0.99
  gae_lambda: 0.95
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  value_clip: 0.2
  huber_delta: 10.0
  filter_rewards: false

env:
  group_name: EnvGroup
  train:
    env_type: simple
    total_num_envs: 1
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: false
    seed: 0
    group_size: ${algorithm.group_size}
    rollout_epoch: 1
    max_episode_steps: 1000
    max_steps_per_rollout_epoch: 1008
    use_fixed_reset_state_ids: true
    is_eval: false
    reset_dataset:
      path: ${oc.env:SIMPLE_OPENFAUCET_RESET_DIR,/path/to/G1WholebodyOpenFaucetTeleop-v0-reset-states}
      format: lerobot
      dr_level: 0
      episode_start: 0
      num_episodes: 10
    init_params:
      task_id: simple/G1WholebodyOpenFaucetTeleop-v0
      controller_mode: decoupled_wbc
      sim_mode: mujoco_isaac
      headless: true
      render_hz: 50
      stabilization_steps: 300
    video_cfg:
      save_video: false
      info_on_video: false
      fps: 3
      video_base_dir: ${runner.logger.log_path}/video/train

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: true
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:PSI0_OPENFAUCET_RUN_DIR,/path/to/Psi0-SIMPLE-OpenFaucet}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 42
  seed: 42
  enable_offload: true
  model:
    model_path: ${oc.env:PSI0_OPENFAUCET_RUN_DIR,/path/to/Psi0-SIMPLE-OpenFaucet}
    precision: fp32
    add_value_head: true
    psi0:
      sampler: stochastic_transition
      stochastic_noise_scale: 1.0
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false
