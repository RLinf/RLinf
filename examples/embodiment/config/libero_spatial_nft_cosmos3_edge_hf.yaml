# Cosmos3 NFT training with hf rollout and FP32 optimizer/EMA accumulation.
defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- model/cosmos3_edge@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  node_groups: null
  component_placement:
    actor: 0-3
    env: 0-3
    rollout: 0-3
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_spatial_nft_cosmos3_edge_hf
    logger_backends:
    - tensorboard
  max_epochs: 300
  max_steps: 50
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  use_training_pipeline: false
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 8
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: embodied_nft
  loss_agg_func: token-mean
  update_epoch: 1
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 5.0
  filter_rewards: false
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5
  nft_loss_form: mse
  nft_beta: 1.0
  adv_clip_max: 0.5
  nft_weight_mode: adaptive
  nft_weight_scale: 1.0
  nft_target_space: x0
  nft_xcur_source: resample
  nft_tau: 0.5
  nft_clip_ratio: 0.1
  nft_gather_type: action_level
  nft_energy_reduction: mean
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 4
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    # Revisit the same 40 initial states, one complete episode per state.
    total_num_envs: 40
    auto_reset: false
    ignore_terminations: false
    use_ordered_reset_state_ids: true
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}
  recompute_logprobs: false
  collect_prev_infos: true
  collect_final_values: false
actor:
  group_name: ActorGroup
  training_backend: fsdp
  model:
    checkpoint_format: diffusers
    model_path: /path/to/cosmos3-edge-policy-liberoall-10k/model_diffusers
    wan_vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    action_stats_path: /path/to/cosmos-framework/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json
    keys_to_skip_loading: []
    # Keep native parameter names aligned with state_dict keys for patch sync.
    activation_checkpointing_mode: none
  micro_batch_size: 16
  global_batch_size: 1024
  seed: 42
  enable_offload: false
  optim:
    use_fp32_master_params: true
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.99
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp2
    use_orig_params: true
    gradient_checkpointing: false
    reshard_after_forward: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      cast_forward_inputs: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
