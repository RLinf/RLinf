defaults:
  - env/maniskill_pick_cube@env.train
  - env/maniskill_pick_cube@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

vlm_trend_paths:
  policy_checkpoint: /path/to/evaluated_approximately_5pct/actor/model_state_dict/full_weights.pt
  model_path: /path/to/Qwen3-VL-4B-Instruct
  success_checkpoint: /path/to/success/selected_global_step/actor/model_state_dict/full_weights.pt
  potential_checkpoint: /path/to/potential/selected_global_step/actor/model_state_dict/full_weights.pt
  scalar_head: /path/to/scalar_head/best.pt

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor,reward: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: vlm_trend_success_potential_ppo
    logger_backends: ["tensorboard"]
  max_epochs: 160
  max_steps: 160
  only_eval: false
  val_check_interval: 5
  save_interval: 20
  resume_dir: null
  ckpt_path: ${vlm_trend_paths.policy_checkpoint}
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1

algorithm:
  update_epoch: 2
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  bootstrap_type: always
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 1.0
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.9
data:
  rollout_batch_size: 1024

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 1024
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: false
    use_full_state: true
    wrap_obs_mode: simple
    reward_mode: only_success
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    init_params:
      id: "PickCube3View-v1"
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      sim_backend: "gpu"
      sim_config:
        sim_freq: 100
        control_freq: 20
      sensor_configs:
        shader_pack: "minimal"
        width: 224
        height: 224
      human_render_camera_configs:
        shader_pack: "minimal"
        width: 224
        height: 224
      render_mode: all
    use_3rd_view_as_extra: true
  eval:
    rollout_epoch: 1
    total_num_envs: 1024
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: true
    group_size: 1
    use_full_state: true
    wrap_obs_mode: simple
    reward_mode: only_success
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    init_params:
      id: "PickCube3View-v1"
      obs_mode: "rgb"
      control_mode: "pd_joint_delta_pos"
      sim_backend: "gpu"
      sim_config:
        sim_freq: 100
        control_freq: 20
      sensor_configs:
        shader_pack: "minimal"
        width: 224
        height: 224
      human_render_camera_configs:
        shader_pack: "minimal"
        width: 224
        height: 224
      render_mode: all
    use_3rd_view_as_extra: true
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}
  enable_torch_compile: false
  enable_cuda_graph: false

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1600
  global_batch_size: 6400
  seed: 1234
  enable_offload: false
  model:
    model_path: ""
    model_type: "mlp_policy"
    obs_dim: 42
  optim:
    lr: 1.0e-5
    value_lr: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 0.5
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: true
  group_name: "RewardGroup"
  reward_mode: history_buffer
  history_reward_assign: false
  reward_weight: 1.0
  env_reward_weight: 0.0
  model:
    model_path: ${vlm_trend_paths.model_path}
    model_type: "vlm_trend_success_potential"
    lora_path: ${vlm_trend_paths.potential_checkpoint}  # full_weights.pt from VLM SFT, or PEFT adapter dir
    scalar_head_path: ${vlm_trend_paths.scalar_head}
    success_lora_path: ${vlm_trend_paths.success_checkpoint}  # full_weights.pt from VLM SFT, or PEFT adapter dir
    gt_success_bonus: 0.0
    precision: "bf16"
    input_builder_name: vlm_trend_success_potential_input_builder
    input_builder_params:
      default_task_description: "Pick up the red cube and place it on the green spot on the table."
      include_task: true
      num_bins: 10
      video_fps: 24.0
      prompt_template: >-
        You are estimating task-conditioned success potential for a robot
        manipulation state.{task_text} The two synchronized videos show the same
        5-frame history from two camera views. Predict the final state's
        potential as exactly one digit from 0 to {num_bins_max}, where 0 is
        furthest from eventual success and {num_bins_max} is closest.
    success_input_builder_name: vlm_trend_success_potential_input_builder
    success_input_builder_params:
      default_task_description: "Pick up the red cube and place it on the green spot on the table."
      include_task: true
      video_fps: 24.0
      prompt_template: >-
        Estimate task-conditioned success potential for this robot manipulation
        state.{task_text} The two synchronized videos show the same 5-frame
        history from two camera views.
    success_reward_parser_name: vlm_trend_binary_digit_reward_parser
    success_reward_parser_params:
      positive_reward: 1.0
      negative_reward: 0.0
      invalid_reward: 0.0
    potential_scale: 1.0
    potential_gamma: 1.0
    potential_ema_alpha: 0.5
    potential_clip: 0.15
    success_threshold: 0.5
    success_confirmation_windows: 1
    success_bonus: 1.0
    success_max_new_tokens: 3
    history_buffers:
      history_window:
        history_size: 5
        min_history_size: 5
        input_interval: 5
        history_keys:
          - main_images
          - extra_view_images
        input_on_done: true
        input_on_done_full_window: true
    interval_reward: 0.0
    enable_history_offload: true
    infer_micro_batch_size: 32
    subprocessor_kwargs:
      video_processor:
        do_sample_frames: true

critic:
  use_critic_model: false
