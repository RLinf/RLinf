defaults:
  - env/vlnce_server_r2r@env.train
  - env/vlnce_server_r2r@env.eval
  - model@actor.model: activevln
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: ../results/activevln
    project_name: rlinf
    experiment_name: activevln_r2r_grpo
    logger_backends: [tensorboard]
  max_epochs: 2
  max_steps: 2
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 2
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: sequence_token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  recompute_logprobs: True
  log_entropy_metrics: True
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  enable_offload: False
  train:
    rollout_epoch: 1
    reuse_environments: True
  eval:
    rollout_epoch: 1
    group_size: 1
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: False
  collect_final_values: False
  enable_offload: True
  pipeline_stage_num: 1
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 64
  model:
    precision: bf16

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42
  enable_offload: True
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
reward:
  use_reward_model: False
critic:
  use_critic_model: False
weight_syncer:
  patch:
    transport_device: cpu
