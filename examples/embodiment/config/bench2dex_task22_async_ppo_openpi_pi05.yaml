defaults:
  - bench2dex_task22_ppo_openpi_pi05
  - _self_

runner:
  val_check_interval: -1
  logger:
    experiment_name: bench2dex_task22_async_ppo_openpi_pi05

env:
  train:
    enable_offload: false
  eval:
    enable_offload: false

rollout:
  enable_offload: false

actor:
  enable_offload: false

algorithm:
  loss_type: decoupled_actor_critic
  staleness_threshold: 1
  behave_weight_threshold: 2.0
