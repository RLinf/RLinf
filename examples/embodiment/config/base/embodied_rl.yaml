# @package _global_
defaults:
  - /cluster@cluster: collocated
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override /hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "embodied_rl"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

rollout:
  group_name: "RolloutGroup"
  rollout_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  seed: 1234
  enable_offload: True

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
