# SO-101 inference config using gRPC backend
# This config demonstrates how to use remote inference via LeRobot gRPC protocol

defaults:
  - realworld_so101_dagger_openpi
  - _self_

# Enable gRPC backend for rollout worker
rollout:
  use_grpc_backend: true
  grpc:
    server_address: "localhost:50051"  # gRPC server address
    timeout: 30.0  # Request timeout in seconds

# Override for inference-only mode
runner:
  only_eval: true
  val_check_interval: 1
  max_steps: -1

# Environment config for inference
env:
  eval:
    total_num_envs: 1
    num_envs_per_worker: 1
    rollout_epoch: 1
    max_steps_per_rollout_epoch: 200
    vector_env_backend: "sync"
