env_type: g1_mimic

seed: 0
total_num_envs: null
group_size: 1
rollout_epoch: 1
# Training collects one control step per runner request; evaluation must
# cover the longest job (a full clip or a push trial).
max_steps_per_rollout_epoch: 1
auto_reset: False
ignore_terminations: False
is_eval: False

# Reference motions.
motion_path: ${oc.env:SUPERMIMIC_MOTION_PATH,""}
motion_format: lafan1       # lafan1 or bones_seed
num_clips: null             # null loads every clip
motion_on_cpu: False        # keep the library and its FK cache in host memory

# Simulation.
max_episode_seconds: 10.0
action_noise_std: 0.1

# Evaluation only: [tracking] or [push_recovery].
eval_tasks: null
push_recovery:
  speeds: [0.5, 1.0, 2.0, 4.0]
  trials: 4
  direction: random
  frame: world
  push_mode: add
  settle_seconds: 1.0
  max_seconds: 5.0
  speed_threshold: 0.15
  tilt_threshold: 0.35
  torso_ori_threshold: 0.5
  stable_seconds: 0.5
  max_xy_drift: null
  save_trajectory: False

video_cfg:
  save_video: False
  video_base_dir: ${runner.logger.log_path}/video/train
