env_type: real
total_num_envs: null

auto_reset: True
ignore_terminations: True
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 100
max_episode_steps: 1000
# No registered leader device produces the Piper's joint layout.
teleop: none
keyboard_intervention_wrapper: False
# The AgxGripper is continuous, so it is not a no-gripper arm.
no_gripper: False
main_image_key: wrist_1

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "PiperReachEnv-v1"
  num_envs: null
