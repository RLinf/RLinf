env_type: aloha
task_name: AlohaInsertion-v0
task_description: "pick up the socket and the peg and insert the peg into the socket"

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 300
max_episode_steps: 300 # gym-aloha's episode limit

reward_type: success # success: reward_coef on success; staged: gym-aloha's stage reward / 4
use_rel_reward: True
reward_coef: 1.0
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: False
use_ordered_reset_state_ids: False

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params: {}
