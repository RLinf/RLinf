env_type: ladder

seed: 0
total_num_envs: 8
group_size: 1

auto_reset: False
ignore_terminations: False
use_fixed_reset_state_ids: False

max_steps_per_rollout_epoch: 400
max_episode_steps: 400

use_rel_reward: True
reward_coef: 1.0
reward_mode: subgoal_progress
is_eval: True

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  suite: robolab
  task_name: comp_bin_1
  prompt_mode: flat
  action_mode: joint_vel
