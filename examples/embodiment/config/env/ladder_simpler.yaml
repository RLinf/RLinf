env_type: ladder

seed: 0
total_num_envs: 24
group_size: 1

auto_reset: True
ignore_terminations: True
use_fixed_reset_state_ids: False

max_steps_per_rollout_epoch: 300
max_episode_steps: 300

use_rel_reward: True
reward_coef: 1.0
reward_mode: subgoal_progress
is_eval: True

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  suite: simpler
  task_name: all1_plate
  prompt_mode: flat
  action_mode: delta_ee
  shader: default
