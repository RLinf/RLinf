  task_name: 03_wine_glass_plate_balance
  robot_key: multi_xarm7_with_ability
  action_dim: 26
  camera_names: [cam_stereo_left, cam_stereo_right, cam_wrist_left, cam_wrist_right]
  image_size: [480, 640]
