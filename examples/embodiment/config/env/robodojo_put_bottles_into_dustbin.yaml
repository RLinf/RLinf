env_type: robodojo
total_num_envs: null

auto_reset: False
ignore_terminations: False

reward_coef: 1.0
use_custom_reward: True
use_rel_reward: True
center_crop: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 700
max_episode_steps: 700 # ARX-X5 tasks are budgeted 700 control steps

is_eval: False

# Joint layout of the env-local 14-dim state/action vector. "native" is the
# RoboDojo runtime order [left arm, right arm, left gripper, right gripper];
# "aloha" exposes [left arm, left gripper, right arm, right gripper], which is
# what OpenPI Aloha checkpoints (RoboDojo's official Pi_05 included) were
# trained on.
state_action_order: native

# Directory that contains Assets/, not Assets/ itself.
assets_path: ${oc.env:ROBODOJO_ASSETS_ROOT,/workspace/dataset/robodojo}
# Optional JSON with per-task success seeds; null samples reset seeds instead.
seeds_path: null

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

# The runtime bridge tears the simulator down; it cannot suspend and resume.
enable_offload: False

task_config:
  task_name: put_bottles_into_dustbin
  env_cfg_type: arx_x5
  headless: True
  cuda_device: 0
  # The runtime validates and concatenates these four action groups.
  action_dims: [6, 6, 1, 1]
  random: False
  max_episode_steps: ${..max_episode_steps}
  save_dir: ${runner.logger.log_path}
