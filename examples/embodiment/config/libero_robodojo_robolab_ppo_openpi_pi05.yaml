# One Pi0.5 network, three simulators. LIBERO, RoboDojo, and RoboLab keep
# their own cameras, state size, norm stats, and action width. The weights
# are the single checkpoint in actor.model.model_path.
#
# Horizons are multiples of actor.model.num_action_chunks. Each simulator has
# 2 env instances on one worker, so one step is 16 + 16 + 8 chunk-transitions.
# actor.global_batch_size stays 5, and each update mixes 2 + 2 + 1 chunks.
#
# Four GPUs. Env workers follow env.train.envs order, one worker each:
#   GPU 0 LIBERO, GPU 1 RoboDojo, GPU 2 RoboLab.
# Actor and rollout share GPU 3. total_num_envs=6, so each env worker sends
# its 2 envs and the one rollout receives all 6. Replies with different
# action widths go back to their own env ranks. Every env's trajectories
# land on the same actor.
defaults:
  - env/libero_spatial@env.train.envs.libero
  - env/robodojo_put_bottles_into_dustbin@env.train.envs.robodojo
  - env/robolab_droid@env.train.envs.robolab
  - env/libero_spatial@env.eval.envs.libero
  - env/robodojo_put_bottles_into_dustbin@env.eval.envs.robodojo
  - env/robolab_droid@env.eval.envs.robolab
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # One actor process, sharing GPU 3 with the rollout.
    actor: "3"
    rollout: "3"
    env: 0-2

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: "libero_robodojo_robolab_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
  # One trajectory from each env weighs the same, whatever its horizon.
  env_weighting: trajectory

env:
  group_name: EnvGroup
  train:
    envs:
      libero:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-libero/bin/python
        rollout_epoch: 1
        max_episode_steps: 80
        max_steps_per_rollout_epoch: 80
        group_size: 1
        video_cfg:
          save_video: true
          info_on_video: true
          fps: 10
          video_base_dir: ${runner.logger.log_path}/video/train
      robodojo:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-robodojo/bin/python
        rollout_epoch: 1
        auto_reset: true
        ignore_terminations: false
        max_episode_steps: 80
        max_steps_per_rollout_epoch: 80
        group_size: 1
        state_action_order: aloha
        assets_path: /path/to/robodojo
        seeds_path: null
        task_config:
          random: true
        video_cfg:
          save_video: true
          info_on_video: true
          fps: 10
          video_base_dir: ${runner.logger.log_path}/video/train
      robolab:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-robolab/bin/python
        rollout_epoch: 1
        auto_reset: true
        ignore_terminations: false
        max_episode_steps: 40
        max_steps_per_rollout_epoch: 40
        group_size: 1
        init_params:
          task: BananaInBowlTask
          output_dir: ${runner.logger.log_path}/robolab_train/BananaInBowlTask
        video_cfg:
          save_video: true
          info_on_video: true
          fps: 10
          video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    envs:
      libero:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-libero/bin/python
        auto_reset: true
        ignore_terminations: true
        max_episode_steps: 20
        max_steps_per_rollout_epoch: 20
        group_size: 1
        is_eval: true
        video_cfg:
          save_video: false
      robodojo:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-robodojo/bin/python
        auto_reset: true
        ignore_terminations: false
        is_eval: true
        max_episode_steps: 20
        max_steps_per_rollout_epoch: 20
        group_size: 1
        state_action_order: aloha
        assets_path: /path/to/robodojo
        task_config:
          random: false
        video_cfg:
          save_video: false
      robolab:
        total_num_envs: 2
        num_workers: 1
        python_interpreter_path: /path/to/.venv-robolab/bin/python
        auto_reset: false
        ignore_terminations: false
        is_eval: true
        max_episode_steps: 10
        max_steps_per_rollout_epoch: 10
        group_size: 1
        init_params:
          task: BananaInBowlTask
          output_dir: ${runner.logger.log_path}/robolab_eval/BananaInBowlTask
        video_cfg:
          save_video: false

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # 16 LIBERO + 16 RoboDojo + 8 RoboLab chunk-transitions, in batches of 2+2+1.
  micro_batch_size: 1
  global_batch_size: 5
  seed: 42
  enable_offload: false
  mix_envs: true
  model:
    # One Pi0.5 checkpoint for all three envs.
    model_path: /path/to/model/RLinf-Pi05-LIBERO-SFT
    model_type: openpi
    # Widest env action. Each env's actor.model.envs entry slices its own prefix.
    action_dim: 14
    num_action_chunks: 10
    num_steps: 3
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_libero
      action_horizon: 10
      num_images_in_input: 3
      action_env_dim: 14
      model_action_dim: 32
      # Tokenize proprio so 8-dim and 14-dim states share this network.
      discrete_state_input: true
      value_after_vlm: true
      train_expert_only: true
      torch_compile: false
    envs:
      libero:
        config_name: pi05_libero
        action_dim: 7
        # Same stats the LIBERO SFT checkpoint was trained with. Per-env
        # pipelines do not inherit the checkpoint assets on their own, so
        # leaving this unset feeds raw state in and sends normalized
        # actions to the controller.
        norm_stats_path: ${actor.model.model_path}/physical-intelligence/libero/norm_stats.json
      robodojo:
        config_name: pi05_aloha_robotwin
        action_dim: 14
        adapt_to_pi: false
        # This checkpoint only ships LIBERO stats. Point this at the
        # RoboDojo SFT norm_stats.json before expecting that policy to act
        # on the right scale.
        norm_stats_path: null
      robolab:
        config_name: pi05_droid_robolab
        action_dim: 8
        # This checkpoint only ships LIBERO stats. Point this at the
        # RoboLab SFT norm_stats.json before expecting that policy to act
        # on the right scale.
        norm_stats_path: null
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
