defaults:
  - env/bench2dex@env.train
  - env/bench2dex@env.eval
  - model/pi05_bench2dex@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: bench2dex_task64_grpo_openpi_pi05
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 4
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  log_group_success_metrics: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: true
    auto_reset: false
    ignore_terminations: false
    seed: 0
    is_eval: false
    max_episode_steps: 665
    max_steps_per_rollout_epoch: 680
    init_params:
      task: 64_sports_ball_cup_sort
      embodiment: multi_panda_with_allegro
      anchor_dir: null
      anchor_hdf5: null
      episode_manifest: null
      generalization_profile: inv_cov
      generalization_split: seen
      inv_cov_seed: 0
      output_dir: ${runner.logger.log_path}/simulator/train
      policy_name: pi05
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    is_eval: true
    max_episode_steps: 665
    max_steps_per_rollout_epoch: 680
    init_params:
      task: 64_sports_ball_cup_sort
      embodiment: multi_panda_with_allegro
      anchor_hdf5: null
      output_dir: ${runner.logger.log_path}/benchmark/eval
      policy_name: pi05

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 136
  seed: 42
  enable_offload: false
  model:
    add_value_head: false
    openpi:
      task: rl
      noise_method: flow_sde
      train_expert_only: true
  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
