multi_iiwa7_with_sharpa:
  config:
    prim_path: /World/Objects/GlobalRobot
    spawn:
      usd_path: Robots_p/kuka+sharpa/usd/multi_iiwa7_with_sharpa.usd
      rigid_props:
        disable_gravity: false
        max_depenetration_velocity: 5.0
      articulation_props:
        articulation_enabled: true
        enabled_self_collisions: false
        solver_position_iteration_count: 16
        solver_velocity_iteration_count: 1
        fix_root_link: true
      collision_props:
        collision_enabled: true
      activate_contact_sensors: false
    init_state:
      pos:
      - -0.35
      - -0.5
      - 0.75
      rot:
      - 0.7071067811865476
      - 0.0
      - 0.0
      - 0.7071067811865475
      joint_pos:
        A1: -1.57
        A2: -1.57
        A3: 0.0
        A4: -1.57
        A5: 0.0
        A6: 0.0
        A7: 0.0
        multi_A1: 1.57
        multi_A2: -1.57
        multi_A3: 0.0
        multi_A4: -1.57
        multi_A5: 0.0
        multi_A6: 0.0
        multi_A7: 0.0
        left_(thumb|index|middle|ring|pinky)_.*: 0.0
        multi_right_(thumb|index|middle|ring|pinky)_.*: 0.0
      joint_vel:
        .*: 0.0
    actuators:
      left_iiwa_shoulder:
        joint_names_expr:
        - A[1-4]
        effort_limit_sim: 500.0
        velocity_limit_sim: 1.0
        stiffness: 4000.0
        damping: 120.0
        friction: 0.0
        armature: 5.0e-06
      left_iiwa_wrist:
        joint_names_expr:
        - A[5-7]
        effort_limit_sim: 500.0
        velocity_limit_sim: 1.0
        stiffness: 4000.0
        damping: 120.0
        friction: 0.0
        armature: 5.0e-06
      right_iiwa_shoulder:
        joint_names_expr:
        - multi_A[1-4]
        effort_limit_sim: 500.0
        velocity_limit_sim: 1.0
        stiffness: 4000.0
        damping: 120.0
        friction: 0.0
        armature: 5.0e-06
      right_iiwa_wrist:
        joint_names_expr:
        - multi_A[5-7]
        effort_limit_sim: 500.0
        velocity_limit_sim: 1.0
        stiffness: 4000.0
        damping: 120.0
        friction: 0.0
        armature: 5.0e-06
      left_sharpa:
        joint_names_expr:
        - left_(thumb|index|middle|ring|pinky)_.*
        effort_limit_sim: 200.0
        velocity_limit_sim: 4.0
