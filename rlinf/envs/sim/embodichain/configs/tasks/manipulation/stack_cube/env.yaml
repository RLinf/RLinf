environment_id: rlinf_stack_cube
physics: default
max_episodes: 1
max_episode_steps: 600
num_envs: 1
arena_space: 2.5
simulation:
  light:
    direct:
    - uid: main_light
      light_type: sun
      color:
      - 1
      - 1
      - 1
      intensity: 3.0
      direction:
      - 0
      - 0
      - -1
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.2
      - 0.8
      - 0.05
      visual_material:
        base_color:
        - 0.09
        - 0.09
        - 0.09
        - 1
        roughness: 0.9
        uid: table_material
    body_type: kinematic
    init_pos:
    - 0.5
    - 0
    - -0.025
  rigid_object:
  - uid: blue
    shape:
      shape_type: Cube
      size:
      - 0.0468
      - 0.0468
      - 0.0468
      visual_material:
        base_color:
        - 0.02
        - 0.02
        - 0.8
        - 1
        roughness: 0.7
        uid: blue_material
    body_type: dynamic
    init_pos:
    - 0.4
    - 0
    - 0.0234
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 1.0
        dynamic_friction: 1.0
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.0
      rigid_props:
        min_position_iters: 32
        min_velocity_iters: 8
  - uid: red
    shape:
      shape_type: Cube
      size:
      - 0.0468
      - 0.0468
      - 0.0468
      visual_material:
        base_color:
        - 0.8
        - 0.02
        - 0.02
        - 1
        roughness: 0.7
        uid: red_material
    body_type: dynamic
    init_pos:
    - 0.55
    - 0.05
    - 0.0234
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 1.0
        dynamic_friction: 1.0
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.0
      rigid_props:
        min_position_iters: 32
        min_velocity_iters: 8
  - uid: green
    shape:
      shape_type: Cube
      size:
      - 0.0468
      - 0.0468
      - 0.0468
      visual_material:
        base_color:
        - 0.02
        - 0.65
        - 0.02
        - 1
        roughness: 0.7
        uid: green_material
    body_type: dynamic
    init_pos:
    - 0.6
    - -0.1
    - 0.0234
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 1.0
        dynamic_friction: 1.0
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.0
      rigid_props:
        min_position_iters: 32
        min_velocity_iters: 8
  rigid_object_group: []
  articulation: []
env:
  target_control_frequency: 20
  rewards:
    success:
      func: success_reward
      mode: add
      # IsaacLab applies weight 20 * step_dt 0.05; EmbodiChain uses weight directly.
      weight: 1.0
      params: {}
  events: {}
  dataset: {}
