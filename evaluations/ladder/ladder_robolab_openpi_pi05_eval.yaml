defaults:
  - env/ladder_robolab@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "ladder_robolab_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 8
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    is_eval: True
    seed: 42
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/openpi-pi05-droid"
    model_type: "openpi"
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    add_value_head: True
    openpi:
      task: eval
      config_name: "pi05_droid_polaris"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${rollout.model.num_steps}
      value_after_vlm: True
      detach_critic_input: True
