defaults:
  - env/ladder_simpler@env.eval
  - model/starvla@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "ladder_simpler_starvla_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  enable_offload: False

  eval:
    rollout_epoch: 1
    total_num_envs: 24
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: oxe_bridge
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/StarVLA-Qwen3VL-GR00T-Bridge-RT-1"
    action_dim: 7
    num_action_chunks: 4
    unnorm_key: oxe_bridge
    add_value_head: False
    action_stats_source: "minmax"
    starvla:
      framework_name: "QwenGR00T"
      expected_action_dim: ${rollout.model.action_dim}
      expected_num_action_chunks: ${rollout.model.num_action_chunks}
      enable_state_input: False
