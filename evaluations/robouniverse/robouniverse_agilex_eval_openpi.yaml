defaults:
  - env/robouniverse_agilex@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: ./logs/robouniverse
    project_name: rlinf
    experiment_name: robouniverse_agilex_eval_openpi
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    auto_reset: false
    ignore_terminations: false
    is_eval: true
    seed: 0
    init_params:
      data_root: /path/to/RoboUniverse-10K
      split: heldout500
      robot: agilex
      sim_python: /isaac-sim/python.sh
      accept_isaac_eula: false

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/openpi_robouniverse_agilex_checkpoint
    model_type: openpi
    action_dim: 16
    num_action_chunks: 15
    num_steps: 10
    add_value_head: false
    openpi:
      task: eval
      config_name: pi05_robouniverse_agilex
      num_images_in_input: 2
      eval_batch_size: 1
      eval_seed: 0
      torch_compile: false
