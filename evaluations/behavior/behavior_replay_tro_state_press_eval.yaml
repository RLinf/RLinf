# Press-only tro_state replay evaluation for BEHAVIOR turning_on_radio.
#
# Semantics:
# - Press-only evaluation starts from cached press-stage tro_state states.
# - Robot already holds the radio; move_to_radio and pickup_from_support are bypassed.
# - Success is evaluated by reaching stage 3 (press radio).
#
# The openpi block contains only fields present in clean's OpenPi0Config
# (action_level_value / noise_action_indices / noise_horizon_mode are omitted).
# held_in_hand_filter from the old config is not supported in clean and omitted.
#
# Provide the press-stage tro_state data directory via the PRESS_TRO_STATE_DIR
# env var, and override the model checkpoint on the CLI, e.g.:
#   export PRESS_TRO_STATE_DIR=/path/to/press_states
#   rollout.model.model_path=/path/to/pi05-turning_on_radio-sft-torch
defaults:
  - env/behavior_r1pro@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout,env: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_replay_tro_state_press_eval"
    logger_backends: ["tensorboard"]

  only_eval: True

  max_epochs: 1000
  max_steps: 1

  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 4
    total_num_envs: 32
    auto_reset: False
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_rel_reward: False
    is_eval: True
    group_size: 1
    seed: 0
    prompt_override: "press radio"
    success_stage_idx: 3
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 1024
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    omni_config:
      env:
        action_frequency: 30
        physics_frequency: 120
        rendering_frequency: 30
      task:
        # The directory should contain press-stage tro_state files indexed by
        # activity_instance_id. This dataset is not included in the repository;
        # point PRESS_TRO_STATE_DIR at your own press-stage tro_state data.
        activity_instance_dir: ${oc.env:PRESS_TRO_STATE_DIR}
        # 100 heldout press ids (50 success + 50 failure), local_id 0-99.
        activity_instance_id: "0-99"
        instance_file_format: tro_state
        instance_resample_mode: offline
        online_object_sampling: False
        use_presampled_robot_pose: True
        reward_config:
          # `reward_mode: stage` is kept verbatim for old-config compatibility.
          # It is a no-op in clean (behavior_reward_mode only handles
          # stage_sparse/weighted/cumulative); the press success signal is
          # driven by success_stage_idx above.
          reward_mode: stage
          task_specific_reward_name: turning_on_radio

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    # TODO: set to your checkpoint path, or override on the CLI.
    model_path: "/path/to/model/pi05-turning_on_radio-sft-torch"
    precision: null
    model_type: "openpi"
    add_value_head: True
    num_images_in_input: 3
    proprio_dim: 32
    action_dim: 23
    num_action_chunks: 32
    openpi:
      config_name: "pi05_behavior"
      detach_critic_input: True
      joint_logprob: False
      action_env_dim: ${rollout.model.action_dim}
      noise_method: "flow_sde"
      noise_level: 0.0
      value_after_vlm: True
      ignore_last: False
      num_steps: 5
