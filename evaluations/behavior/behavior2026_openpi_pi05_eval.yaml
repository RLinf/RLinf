defaults:
  - behavior_openpi_pi05_base
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  logger:
    experiment_name: "behavior2026_openpi_pi05_eval"

env:
  eval:
    env_type: behavior2026
    is_eval: true
    max_episode_steps: null  # Use the official limit for the selected task.
    max_steps_per_rollout_epoch: null  # Round the limit up to whole action chunks.

rollout:
  model:
    model_path: /path/to/RLinf-Pi05-BEHAVIOR-1K-PT50-CS32
