# OpenWAM (RoboTwin study checkpoint, dual-system joint self-attention) on RoboTwin place_dual_shoes.
# Generated by toolkits/openwam/gen_robotwin_eval_recipes.py; edit the generator, not this file.
defaults:
  - env/robotwin_openwam_aloha@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Keep the SAPIEN environments off the OpenWAM rollout GPU.
  component_placement:
    env: 0
    rollout: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_place_dual_shoes_openwam_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  # Override the default values in env/robotwin_openwam_aloha
  eval:
    rollout_epoch: 1
    # RoboTwin's VectorEnv.step waits at most 120 s per sub-environment and the
    # sub-environments of one env worker run under a shared lock, at roughly 1 s
    # per planned ee target: keep envs-per-worker x 32 x 1 s under that budget
    # (2 per worker is safe; 4 times out). Scale trajectories with rollout_epoch
    # or more env GPUs instead.
    total_num_envs: 2
    use_custom_reward: False
    use_rel_reward: True
    auto_reset: True
    ignore_terminations: True
    # RoboTwin's step limit for place_dual_shoes is 600; OpenWAM executes whole
    # 32-action chunks, so the budget is rounded up to 608.
    max_episode_steps: 608
    max_steps_per_rollout_epoch: 608
    reward_coef: 1.0
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/path/to/robotwin_assets"
    seeds_path: null   # no RLinf eval seeds for this task yet: random RoboTwin seeds
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      task_name: place_dual_shoes
      step_lim: 608

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: "openwam"
    precision: bf16
    is_lora: false
    model_path: /mnt/data/wangyuran/openwam_checkpoints/OpenWAM_Study_Checkpoints/architecture_study/robotwin_dual_system_joint_self_attention
    device: cuda
    load_to_device: false
    ckpt_name: null
    num_frames: 33
    num_action_chunks: 32   # OpenWAM's RoboTwin protocol executes the full 32-step chunk
    action_dim: 20
    height: 384
    width: 320
    denoise_steps: 10
    openwam:
      inference_horizon: null
