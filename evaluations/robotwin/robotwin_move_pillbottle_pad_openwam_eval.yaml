# OpenWAM (RoboTwin study checkpoint, dual-system joint self-attention) on RoboTwin move_pillbottle_pad.
# Generated by toolkits/openwam/gen_robotwin_eval_recipes.py; edit the generator, not this file.
defaults:
  - env/robotwin_openwam_aloha@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Keep the SAPIEN environments off the OpenWAM rollout GPU.
  component_placement:
    env: 0
    rollout: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_move_pillbottle_pad_openwam_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  # Override the default values in env/robotwin_openwam_aloha
  eval:
    rollout_epoch: 1
    # The sub-environments of one env worker plan their ee targets under a
    # shared lock (about 25 to 30 s per 32-step chunk each), so more envs per
    # worker only serialize; scale trajectories with rollout_epoch or more env
    # GPUs instead. robotwin_step_timeout_s (preset) bounds each chunk wait.
    total_num_envs: 2
    use_custom_reward: False
    use_rel_reward: True
    auto_reset: True
    ignore_terminations: True
    # RoboTwin's step limit for move_pillbottle_pad is 400; OpenWAM executes whole
    # 32-action chunks, so the budget is rounded up to 416.
    max_episode_steps: 416
    max_steps_per_rollout_epoch: 416
    reward_coef: 1.0
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/path/to/robotwin_assets"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      task_name: move_pillbottle_pad
      step_lim: 416

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: "openwam"
    precision: bf16
    is_lora: false
    model_path: /path/to/openwam-robotwin-checkpoint
    device: cuda
    load_to_device: true
    ckpt_name: null
    num_frames: 33
    num_action_chunks: 32   # OpenWAM's RoboTwin protocol executes the full 32-step chunk
    action_dim: 20
    height: 384
    width: 320
    denoise_steps: 10
    openwam:
      inference_horizon: null
