defaults:
  - env/robotwin_click_bell@env.eval
  - _self_

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: node
      placement: 0
    rollout:
      node_group: dream
      placement: 0
  node_groups:
    - label: dream
      node_ranks: "0"
      env_configs:
        - node_ranks: "0"
          python_interpreter_path: ${oc.env:DREAM_ROLLOUT_PYTHON,null}

runner:
  task_type: embodied_eval
  only_eval: true
  val_check_interval: -1
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: robotwin_dream
    logger_backends: [tensorboard]

env:
  group_name: EnvGroup
  eval:
    total_num_envs: 1
    max_steps_per_rollout_epoch: 432
    rollout_epoch: 10
    ignore_terminations: true
    is_eval: true
    skip_intermediate_renders: false
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      info_on_video: false
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      collect_data: false
      eval_video_log: false
      save_path: ${runner.logger.log_path}/robotwin
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: RolloutGroup
  rollout_backend: dream
  pipeline_stage_num: 1
  collect_prev_infos: false
  model:
    model_type: dream
    checkpoint: dreamlabs/dream-1-beta
    action_dim: 14
    num_action_chunks: 48
  dream:
    arm: ${oc.env:DREAM_IK_ARM_FILE}
    action_hz: 20
    timeout_ms: 30000
