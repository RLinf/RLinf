defaults:
  - env/robotwin_click_bell@env.eval
  - _self_
  - dream_task: click_bell
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    env,rollout:
      node_group: node
      placement: 0

runner:
  task_type: embodied_eval
  only_eval: true
  val_check_interval: -1
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: robotwin_dream
    logger_backends: [tensorboard]

env:
  group_name: EnvGroup
  eval:
    total_num_envs: 1
    instruction_type: unseen
    rollout_epoch: 10
    ignore_terminations: true
    is_eval: true
    skip_intermediate_renders: false
    seeds: [100100001, 100100002, 100100003, 100100004, 100100005, 100100006, 100100007, 100100008, 100100009, 100100010]
    video_cfg:
      info_on_video: false
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      collect_data: false
      eval_video_log: false
      save_path: ${runner.logger.log_path}/robotwin
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: RolloutGroup
  rollout_backend: dream
  pipeline_stage_num: 1
  collect_prev_infos: false
  model:
    model_type: dream
    checkpoint: dreamlabs/dream-1-beta
    action_dim: 14
    num_action_chunks: 48
  dream:
    head: eef
    arm: ${oc.env:DREAM_IK_ARM_FILE}
    action_hz: 20
    timeout_ms: 30000
