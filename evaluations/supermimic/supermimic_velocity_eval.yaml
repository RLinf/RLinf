# Evaluate a checkpoint trained with supermimic_velocity.yaml.
defaults:
  - supermimic_velocity
  - supermimic_eval_common
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  logger:
    experiment_name: supermimic_velocity_eval

eval:
  velocity: g2
