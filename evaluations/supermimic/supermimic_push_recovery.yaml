# Standing-pose push evaluation for the original 680-d goal / 93-d observation.
# Policy overrides preserve its existing checkpoint interface.
defaults:
- supermimic_lafan1_zita
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
runner:
  logger:
    log_path: ../results/eval/${runner.logger.experiment_name}
    experiment_name: supermimic_push_recovery
  only_eval: true
  save_interval: -1
algorithm:
  total_updates: 320000
  warmup_sim_steps: 40
  wm_only_updates: 0
  reward_anchor: torso
  input_norm: none
  residual_frame: heading
  wm_state_loss: paper
  critic_features: root4
  matmul: tf32
  goal_encoding: paper
  obs_dim: 93
  goal_frame_dim: 68
  termination_head: learned
env:
  num_envs: 1
  motion_path: static_standing
  com_sampling: per_reset
eval:
  checkpoint: null
  seed: 0
  motion: false
  velocity: none
  velocity_smoke_seconds: 10.0
  velocity_smoke_start_clip: 0
  velocity_smoke_commands: null
  g2_trials: 4
  g2_seconds: 5.0
  g2_steady_seconds: 2.0
  g2_batch: 448
  output_dir: null
  speeds:
  - 0.5
  - 1.0
  - 2.0
  - 4.0
  direction: random
  frame: world
  push_mode: add
  trials: 4
  settle_seconds: 1.0
  max_seconds: 5.0
  speed_threshold: 0.15
  tilt_threshold: 0.35
  torso_ori_threshold: 0.5
  stable_seconds: 0.5
  max_xy_drift: null
  save_trajectory: false
