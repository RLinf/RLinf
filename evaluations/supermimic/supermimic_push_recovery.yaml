# Standing push recovery (Section 4.3) of a SuperMimic checkpoint.
# Set runner.ckpt_path to the policy's full_weights.pt and, for a MaxCoord
# checkpoint, rollout.model.representation=maxcoord.
defaults:
  - env/g1_mimic@env.eval
  - model/supermimic@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  only_eval: True
  ckpt_path: null
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  logger:
    log_path: ../results/eval
    project_name: rlinf
    experiment_name: supermimic_push_recovery
    logger_backends: ["tensorboard"]
  eval_export:
    enabled: True
    output_dir: null         # default: <log_path>/<experiment_name>/eval_results

env:
  group_name: EnvGroup
  eval:
    # 4 speeds x 4 trials, one trial per env.
    total_num_envs: 16
    is_eval: True
    eval_tasks: [push_recovery]
    # 1 s settle + 5 s after the push.
    max_steps_per_rollout_epoch: 300
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: False
  pipeline_stage_num: 1
  model:
    representation: gencoord
