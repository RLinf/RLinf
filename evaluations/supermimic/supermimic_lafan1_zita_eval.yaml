# Tracking and velocity evaluation; inherits the matching training interface.
defaults:
- supermimic_lafan1_zita
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
runner:
  logger:
    log_path: ../results/eval/${runner.logger.experiment_name}
    experiment_name: supermimic_lafan1_zita_eval
  only_eval: true
env:
  num_envs: 40
eval:
  checkpoint: null
  seed: 0
  motion: true
  velocity: none
  velocity_smoke_seconds: 10.0
  velocity_smoke_start_clip: 0
  velocity_smoke_commands: null
  g2_trials: 4
  g2_seconds: 5.0
  g2_steady_seconds: 2.0
  g2_batch: 448
  output_dir: null
