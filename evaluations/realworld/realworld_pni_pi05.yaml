defaults:
  - env/realworld_block_peg_insertion@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: ROBOT_IP # Replace with your robot's IP address
            node_rank: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld-eval-pi05-pni"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: "/path/to/ckpt.pt"

env:
  group_name: "EnvGroup"
  enable_offload: False

  eval:
    rollout_epoch: 20
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    keyboard_reward_wrapper: null
    use_spacemouse: False
    max_episode_steps: 720
    max_steps_per_rollout_epoch: 720

    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

    override_cfg:
      target_ee_pose: TARGET_EE_POSE
      camera_serials: ["SERIAL1", "SERIAL2"]
      is_dummy: False
      use_dense_reward: False
      max_num_steps: ${env.eval.max_episode_steps}
      binary_gripper_threshold: 0.5
      enable_gripper_penalty: False
      enable_camera_player: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  enable_torch_compile: False
  enable_cuda_graph: False
  is_lora: False
  model:
    precision: null
    model_type: "openpi"
    model_path: "/path/to/model"
    num_action_chunks: 10
    action_dim: 7
    num_steps: 4
    add_value_head: False
    openpi:
      config_name: "pi05_realworld"
      detach_critic_input: True
      num_images_in_input: 2
      train_expert_only: False
