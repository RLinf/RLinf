defaults:
  - env/realworld_dual_yam_joint@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    rollout:
      node_group: gpu
      placement: 0
    env:
      node_group: yam
      placement: 0
  node_groups:
    - label: gpu
      node_ranks: 0
    - label: yam
      node_ranks: 1
      hardware:
        type: DualYam
        configs:
          - node_rank: 1

runner:
  task_type: embodied_eval
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: dual_yam_openpi_eval
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: 1
  only_eval: true
  val_check_interval: -1

env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    total_num_envs: 1
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    rollout_epoch: 1
    teleop: none
    video_cfg:
      save_video: true
    override_cfg:
      task_description: ${oc.env:YAM_TASK_DESCRIPTION}
      max_num_steps: 300
      reset:
        enabled: false
      park_on_close:
        enabled: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false
  model:
    model_path: /path/to/yam_sft/checkpoints/global_step_30000
    precision: bf16
    num_action_chunks: 5
    action_dim: 14
    rewrite_chunk_gripper: false
    openpi:
      task: eval
      config_name: pi05_yam_joint
    openpi_data:
      norm_stats_path: /path/to/yam_dataset/norm_stats.json
