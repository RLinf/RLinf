defaults:
  - env/libero_10@env.eval
  - model/molmoact2@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_molmoact2_eval"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    # Full LIBERO-Long defaults: 20 envs x 25 episodes = 500 trajectories.
    # The other task suites have their own libero_<suite>_molmoact2_eval.yaml.
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 13000
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    seed: 1000
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    # MolmoAct2 runs continuous-action inference; token sampling params are
    # unused, but the HF rollout worker still reads this block.
    do_sample: False
    temperature_train: 0.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  # MolmoAct2 keeps one action queue per batch index, so the batch composition
  # must stay stable across calls: keep a single pipeline stage.
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/MolmoAct2-LIBERO" # https://huggingface.co/allenai/MolmoAct2-LIBERO
    model_type: "molmoact2"
