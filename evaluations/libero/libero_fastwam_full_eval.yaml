# Full FastWAM/LIBERO benchmark through RLinf's native EmbodiedEvalRunner.
#
# The default suite is LIBERO-Spatial. Override task_suite_name for Goal/Object.
# Four RLinf worker pairs each host five environments. With termination signals
# ignored until truncation, every slot runs exactly 25 episodes and the batch
# covers all 500 fixed initial states once. This config intentionally uses four
# GPUs; use the suite-specific LIBERO-10 limits noted below.
defaults:
  - env/libero_spatial@env.eval
  - model/fastwam@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-3

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_fastwam_full_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    # Match FastWAM's released LIBERO evaluator base seed. RLinf's existing
    # per-rank seed offset remains unchanged.
    seed: 42
    rollout_epoch: 1
    total_num_envs: 20
    auto_reset: true
    ignore_terminations: true
    # FastWAM upstream: 30 open-gripper no-op steps followed by 400 controller
    # steps for Spatial/Goal/Object. For LIBERO-10 override to 700 and 17500.
    num_steps_wait: 30
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 10000
    group_size: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    is_eval: true
    libero_variant: standard
    perturbation_suffix: null
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_type: "fastwam"
    # Match FastWAM's released evaluator, which inherits the global seed 42.
    seed: 42
    # Replace both placeholders with the checkpoint and dataset-stats files to evaluate.
    model_path: /path/to/FASTWAM_SFT_CKPT
    dataset_stats_path: /path/to/FASTWAM_DATASET_STATS
