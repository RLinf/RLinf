defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 4
    rollout: 4

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_pi05_eval_phyai"
    logger_backends: ["tensorboard"]

  only_eval: True

env:
  group_name: "EnvGroup"

  eval:
    init_params:
      camera_heights: 360
      camera_widths: 360
    rollout_epoch: 1
    # LIBERO-Spatial: 10 tasks x 50 trials = 500 init states. With total_num_envs parallel envs,
    # set max_steps_per_rollout_epoch to ceil(500/total_num_envs) * max_episode_steps so auto_reset
    # cycles through the full suite within one env.eval.rollout_epoch (see vla-eval.rst).
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 1920  # 4 * max_episode_steps -> ~512 trajectories
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  rollout_backend: "phyai"
  pipeline_stage_num: 1

  phyai:
    serving_mode: "worker_http"
    gateway_url: "http://127.0.0.1:30000"
    http_timeout_s: 600
    http_max_retries: 0
    http_retry_backoff_s: 1.0

  model:
    model_type: "openpi"
    action_horizon: 16
    num_action_chunks: 16
    openpi:
      task: eval
