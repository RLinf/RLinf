defaults:
  - env/libero_spatial@env.eval
  - model/gr00t_n1d7@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: "0"
    rollout: "0"

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: libero_spatial_gr00t_n1d7_eval
    logger_backends: ["tensorboard"]
  only_eval: true

env:
  group_name: EnvGroup
  eval:
    # 40 environments x 5 epochs covers the first 20 fixed states per task.
    total_num_envs: 40
    rollout_epoch: 5
    auto_reset: true
    # Run every trajectory to the step cap and report success_once.
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    use_fixed_reset_state_ids: true
    is_eval: true
    seed: 42
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/exported/GR00T-N1.7-SFT
    backbone_model_path: /path/to/Cosmos-Reason2-2B
    num_action_chunks: 8
    add_value_head: false
