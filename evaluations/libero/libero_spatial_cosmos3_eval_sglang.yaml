defaults:
  - env/libero_10@env.eval
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_eval_cosmos3_sglang"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    init_params: {ignore_done: true}
    rollout_epoch: 1
    total_num_envs: 256
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 520
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
    is_eval: True

    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  rollout_backend: "sglang"
  enable_offload: False
  pipeline_stage_num: 1
  return_logprobs: false
  sampling_params:
    do_sample: false
    max_new_tokens: 1

  sglang:
    serving_mode: "embodied"
    http_timeout_s: 600
    http_max_retries: 5
    http_retry_backoff_s: 1.0
    seed: 123
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    launch_server: true
    launch_router: false
    server_type: embodied
    group_name: SGLangServerGroup
    router_group_name: SGLangRouterGroup
    server:
      model_path: ${rollout.model.model_path}
      backend: sglang
      pipeline_class_name: Cosmos3OmniDiffusersPipeline
      tp_size: ${..tensor_parallel_size}
      num_gpus: 1  # launcher/placement key: should be TP size * PP size * CFG degree * SP degree
      attention_backend: FA  # FA or TORCH_SDPA
      dit_cpu_offload: false
      cfg_parallel_degree: 1
      sp_degree: 1
      batching_max_size: 8

  model:
    model_type: "cosmos3"
    precision: bf16
    raw_action_dim: 10  # model action representation: 3 trans + 6 rot6d + 1 gripper
    action_dim: 7  # env action dim (libero: 3 trans + 3 axis-angle + 1 gripper)
    model_path: /mnt/public/rhy/dataset/sft_3000/model_diffusers
    # https://github.com/NVIDIA/cosmos-framework/blob/main/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json
    action_stats_path: /mnt/public/rhy/cosmos_dagger/RLinf/.venv/cosmos-framework/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json
    action_normalization: "quantile_rot"
    embodiment_tag: "libero_sim"
    is_lora: False
    num_action_chunks: 10
    action_mode: "policy"
    action_fps: 20.0
    fps: 20
    num_inference_steps: 30
    shift: 5.0
    guidance: 1.0
    native_eval: true
    image_size: 256
    resolution: "256"
    action_view_point: "concat_view"
    num_frames: 17
    size: "320x192"
