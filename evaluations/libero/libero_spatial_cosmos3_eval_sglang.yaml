defaults:
  - env/libero_spatial@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_eval_cosmos3_sglang"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 1920
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  rollout_backend: "sglang"
  enable_offload: False
  pipeline_stage_num: 2
  return_logprobs: false
  sampling_params:
    do_sample: false
    max_new_tokens: 1

  sglang:
    serving_mode: "embodied"
    http_timeout_s: 600
    http_max_retries: 5
    http_retry_backoff_s: 1.0
    seed: 1140
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    launch_server: true
    launch_router: false
    server_type: embodied
    group_name: SGLangServerGroup
    router_group_name: SGLangRouterGroup
    server:
      model_path: ${rollout.model.model_path}
      backend: sglang
      pipeline_class_name: Cosmos3OmniDiffusersPipeline
      tp_size: ${..tensor_parallel_size}
      num_gpus: 1  # launcher/placement key: should be TP size * PP size * CFG degree * SP degree
      attention_backend: FA  # FA or TORCH_SDPA
      dit_cpu_offload: false
      cfg_parallel_degree: 1
      sp_degree: 1

  model:
    model_type: "cosmos3"
    precision: bf16
    raw_action_dim: 10  # model action representation: 3 trans + 6 rot6d + 1 gripper
    action_dim: 7  # env action dim (libero: 3 trans + 3 axis-angle + 1 gripper)
    model_path: path/to/Cosmos3-Nano
    # https://github.com/NVIDIA/cosmos-framework/blob/main/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json
    action_stats_path: path/to/libero_native_frame_wise_relative_rot6d.json
    action_normalization: "quantile_rot"
    embodiment_tag: "libero_sim"
    is_lora: False
    num_action_chunks: 16
    action_mode: "policy"
    action_fps: 20.0
    fps: 20
    num_inference_steps: 30
    action_view_point: "ego_view"
    num_frames: 17
    size: "320x192"