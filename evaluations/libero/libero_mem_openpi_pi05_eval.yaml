defaults:
  - env/libero_mem@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: libero_mem_openpi_pi05_eval
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: /path/to/short_memory_checkpoint
    num_action_chunks: 5
    num_steps: 5
    openpi:
      task: eval
      config_name: pi05_libero
      action_horizon: 10
      discrete_state_input: False
      short_memory: True
      short_memory_temporal_layers: [3, 7, 11, 15]
      short_memory_drop_history_layer: 15
    openpi_data:
      norm_stats_path: /path/to/libero-mem/norm_stats.json
