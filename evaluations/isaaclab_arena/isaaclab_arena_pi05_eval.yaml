defaults:
  - /env/isaaclab_arena@env.eval
  - /model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: ./logs/isaaclab_arena
    project_name: rlinf
    experiment_name: isaaclab_arena_pi05
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    is_eval: true

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /path/to/model/RLinf-Pi05-RoboLab-droid-jointpos
    action_dim: 8
    num_action_chunks: 15
    num_steps: 10
    openpi:
      task: eval
      config_name: pi05_droid_robolab
      pytorch_numerics: true
      eval_batch_size: 1
      eval_seed: 0
      sample_compile: false
      torch_compile: false
