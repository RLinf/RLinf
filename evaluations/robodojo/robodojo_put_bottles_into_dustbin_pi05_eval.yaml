defaults:
  - env/robodojo_put_bottles_into_dustbin@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # One Isaac Sim process and one policy replica on GPU 0. Add ranks here (and
    # raise total_num_envs) to scale out; the two keys stay separate so either
    # side can be overridden on its own.
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robodojo_put_bottles_into_dustbin_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    # One episode per saved layout: 55 layouts in seeds_path with one env.
    rollout_epoch: 55
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 700
    max_steps_per_rollout_epoch: 700
    group_size: 1
    use_fixed_reset_state_ids: False
    is_eval: True
    # The official Pi_05 checkpoint was trained on the ALOHA joint layout.
    state_action_order: aloha
    # `task_config.random: False` replays the official layouts under
    # Assets/Eval_Layout, whose ids are 0..N-1. The env samples reset seeds from
    # `success_seeds` when it is set, and a random id would miss the layout list.
    seeds_path: ${oc.env:REPO_PATH}/evaluations/robodojo/put_bottles_into_dustbin_seeds.json
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      task_name: put_bottles_into_dustbin
      env_cfg_type: arx_x5
      headless: True
      cuda_device: 0
      action_dims: [6, 6, 1, 1]
      random: False
      max_episode_steps: ${..max_episode_steps}
      save_dir: ${runner.logger.log_path}

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  pipeline_stage_num: 1
  model:
    precision: bf16
    model_path: "/path/to/model/pi05_robodojo_arx_x5"
    num_action_chunks: 50
    action_dim: 14
    num_steps: 10
    openpi:
      task: eval
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      action_env_dim: 14
      model_action_dim: 32
      # RoboDojo runs inside Isaac Sim; keep the eager path.
      torch_compile: False
    openpi_data:
      # Official RoboDojo Pi_05 config: no Aloha joint/gripper realignment.
      adapt_to_pi: False
      norm_stats_path: ${..model_path}/arx_x5_sim/norm_stats.json
