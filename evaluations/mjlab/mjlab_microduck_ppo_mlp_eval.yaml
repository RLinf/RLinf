defaults:
  - env/mjlab_microduck@env.eval
  - model/mlp_policy@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "mjlab_microduck_ppo_mlp_eval"
    logger_backends: ["tensorboard"] # wandb, swanlab

  only_eval: True
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 16
    max_steps_per_rollout_epoch: 1000
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  rollout_backend: "huggingface"
  enable_offload: false
  pipeline_stage_num: 1

  model:
    policy_setup: locomotion
    obs_dim: 61
    critic_obs_dim: 76
    action_dim: 14
    num_action_chunks: 1
    hidden_sizes: [512, 256, 128]
    critic_hidden_sizes: [512, 256, 128]
    activation: elu
    init_logstd: 0.0
    obs_normalization: true
    obs_norm_eps: 1.0e-2
    add_value_head: True
    precision: "32"
    model_path: ""

  enable_torch_compile: False
  enable_cuda_graph: False
