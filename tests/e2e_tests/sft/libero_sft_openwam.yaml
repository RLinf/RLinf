defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - model/openwam@actor.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_sft_openwam"
    logger_backends: null

  max_epochs: -1
  max_steps: 1
  val_check_interval: -1
  save_interval: -1
  log_interval: 1
  resume_dir: null

data:
  # OpenWAM's native LIBERO (LeRobot v3) dataset root; the reader comes from
  # the checkpoint's config.yaml.
  train_data_paths: /workspace/dataset/data/sft-ci-data/openwam-libero
  num_workers: 0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 2
  seed: 42

  model:
    model_path: /workspace/dataset/OpenWAM/OpenWAM-Alpha-Sim-LIBERO
    # bf16 master weights keep the two-rank smoke within memory; the
    # libero_sft_openwam recipe trains with fp32 master weights.
    precision: bf16

  optim:
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.05
    total_training_steps: 1

  fsdp_config:
    # Same FSDP2 layout as libero_sft_openwam: the DiT / action blocks stay in
    # the root unit and the frozen Wan VAE residual blocks form the sub-units.
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    reshard_after_forward: true
    wrap_policy:
      module_classes_to_wrap: [ResidualBlock]
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false
