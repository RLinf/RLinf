defaults:
  - env/robodojo_put_bottles_into_dustbin@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results/robodojo_put_bottles_into_dustbin_pi05_eval"
    project_name: rlinf
    experiment_name: "test_robodojo_put_bottles_into_dustbin_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    # Smoke test: one layout, one 50-step episode.
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    state_action_order: aloha
    seeds_path: ${oc.env:REPO_PATH}/evaluations/robodojo/put_bottles_into_dustbin_seeds.json
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    task_config:
      task_name: put_bottles_into_dustbin
      env_cfg_type: arx_x5
      headless: True
      cuda_device: 0
      action_dims: [6, 6, 1, 1]
      random: False
      max_episode_steps: ${..max_episode_steps}
      save_dir: ${runner.logger.log_path}

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  pipeline_stage_num: 1
  model:
    precision: bf16
    # Converted with `jax_to_openpi`; the raw JAX checkpoint is not loadable.
    model_path: /workspace/dataset/robodojo/ckpt/RoboDojo/Pi_05_robodojo_arx_x5
    num_action_chunks: 50
    action_dim: 14
    num_steps: 10
    openpi:
      task: eval
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      action_env_dim: 14
      model_action_dim: 32
      torch_compile: False
    openpi_data:
      adapt_to_pi: False
      norm_stats_path: ${..model_path}/arx_x5_sim/norm_stats.json
