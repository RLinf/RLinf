defaults:
  - env/libero_spatial@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "logs/ci/phyai-gateway/rlinf"
    project_name: rlinf
    experiment_name: "libero_spatial_pi05_eval_phyai"
    logger_backends: []

  only_eval: True

env:
  group_name: "EnvGroup"

  eval:
    init_params:
      camera_heights: 360
      camera_widths: 360
    rollout_epoch: 1
    # Keep the CI workload bounded while exercising the complete Gateway path.
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  rollout_backend: "phyai"
  pipeline_stage_num: 1

  phyai:
    serving_mode: "gateway"
    model_name: "pi05"
    gateway_url: null
    max_batch_size: 8
    checkpoint_dir: /path/to/pi05_libero_finetuned_v044  # https://huggingface.co/lerobot/pi05_libero_finetuned_v044
    tokenizer_dir: /path/to/paligemma-3b-pt-224  # https://huggingface.co/google/paligemma-3b-pt-224
    log_dir: "logs/ci/phyai-gateway"
    http_timeout_s: 120
    http_max_retries: 0
    http_retry_backoff_s: 1.0
    server:
      plugin: pi05
      plugin_args:
        inputs_image_shape:
          - [360, 360, 3]
          - [360, 360, 3]
      config:
        device:
          target: cuda
          params_dtype: bfloat16
        runtime:
          use_cuda_graph: true
          flashinfer_workspace_bytes: 2147483648
      deployment:
        mode: auto
      server:
        workers: 1
      adapter:
        factory: phyai.server.backends.pi05:PI05Backend
        args:
          image_names: [main_images, wrist_images]
          state_dim: 8
          action_dim: 7

  model:
    model_type: "openpi"
    num_action_chunks: 16
    openpi:
      task: eval
