defaults:
  - env/libero_spatial@env.eval
  - model/gr00t_n1d7@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-1

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results/libero_spatial_gr00t_n1d7_eval"
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    # Two predicted chunks per environment exercise the deterministic eval path.
    max_episode_steps: 32
    max_steps_per_rollout_epoch: 32
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    skip_intermediate_renders: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/workspace/dataset/GR00T-N1.7-LIBERO/libero_spatial"
    backbone_model_path: "/workspace/dataset/Cosmos-Reason2-2B"
    model_type: "gr00t_n1d7"
    embodiment_tag: "libero_sim"
    add_value_head: False
