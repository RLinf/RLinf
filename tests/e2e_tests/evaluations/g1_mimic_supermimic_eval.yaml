# Tracking evaluation on two ranks of the update-5 checkpoint that the resumed
# g1_mimic_supermimic run saves, on the clip in SUPERMIMIC_MOTION_PATH.
# Mirrors evaluations/supermimic/supermimic_lafan1_eval.yaml.
defaults:
  - env/g1_mimic@env.eval
  - model/supermimic@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-1

runner:
  task_type: embodied_eval
  only_eval: True
  ckpt_path: /workspace/results/g1_mimic_supermimic/ci-test/checkpoints/global_step_5/actor/model_state_dict/full_weights.pt
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  logger:
    log_path: /workspace/results/g1_mimic_supermimic_eval
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: ["tensorboard"]
  eval_export:
    enabled: True
    output_dir: null

env:
  group_name: EnvGroup
  eval:
    total_num_envs: 2
    num_clips: 1
    is_eval: True
    eval_tasks: [tracking]
    motion_on_cpu: True
    max_steps_per_rollout_epoch: 64  # frames in the standing clip
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: False
  pipeline_stage_num: 1
  model:
    representation: gencoord
    torch_compile: False
