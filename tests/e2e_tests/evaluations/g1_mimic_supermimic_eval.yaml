# Tracking evaluation on two ranks of the checkpoint that g1_mimic_supermimic
# saves, on the clip in SUPERMIMIC_MOTION_PATH.
# Mirrors evaluations/supermimic/supermimic_lafan1_eval.yaml.
defaults:
  - supermimic_lafan1_gencoord
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied_eval
  only_eval: True
  ckpt_path: /workspace/results/g1_mimic_supermimic/ci-test/checkpoints/global_step_3/actor/model_state_dict/full_weights.pt
  logger:
    log_path: /workspace/results/g1_mimic_supermimic_eval
    experiment_name: ci-test
  eval_export:
    enabled: True

rollout:
  model: ${actor.model}

actor:
  model:
    torch_compile: False

env:
  train:
    num_clips: 1
    motion_on_cpu: True
  eval:
    total_num_envs: 2
    num_clips: 1
    motion_on_cpu: True
    max_steps_per_rollout_epoch: 64  # frames in the standing clip
