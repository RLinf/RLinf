# Usage: bash tests/e2e_tests/offline_rl/run_recap_value_model_sft.sh recap_value_model_sft_libero_no_eval
#
# Regression test for: Timer 'run_eval' has not been recorded.
# Trigger condition: val_check_interval > 0 AND eval_data_paths is empty.
# Expected behavior after fix: training completes; time/evaluate ~= 0 is logged.
# Without the fix this config crashes at step 1 with
#   ValueError: Timer 'run_eval' has not been recorded.

defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: sft
  logger:
    log_path: "/workspace/results/libero_sft_value_no_eval"
    project_name: rlinf
    experiment_name: "libero_sft_value_no_eval"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  # check_progress() also validates on the last step, so a single step is
  # enough to reach run_eval with an empty eval_data_loaders.
  max_steps: 1
  val_check_interval: 10
  save_interval: -1

data:
  tag: fail300

  train_data_paths:
    - dataset_path: "/workspace/dataset/data/sft-ci-data/recap/libero_10_3shot"
      type: "sft"
      weight: 1.0
      robot_type: "libero"
      model_type: "pi05"

  # Empty eval data reproduces the empty eval_data_loaders path in run_eval.
  eval_data_paths: []

  train_num_workers: 1
  eval_num_workers: 1
  prefetch_factor: 1
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: "libero"
  model_type: "pi05"
  balance_weights: true
  seed: 42

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 4
  seed: 0

  model:
    precision: bf16
    siglip_path: "/workspace/dataset/siglip2-so400m-patch14-224"
    gemma3_path: "/workspace/dataset/gemma-3-270m"
    tokenizer_path: "/workspace/dataset/gemma-3-270m"
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 8000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
