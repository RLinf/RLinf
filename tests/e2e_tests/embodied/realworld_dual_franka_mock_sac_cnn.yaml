# A dual-arm real-world run against faked vendor SDKs.
#
# The dummy variant of this config sets is_dummy, which skips the hardware
# entirely: no robot is built, no camera opened, no wrapper stack driven by
# real observations. This one leaves those paths on and fakes what is on the
# other end of the cable, so the parts, the robot composition, the wrapper
# stack and the runner all run as they would on a bench.
#
# run.sh installs the fakes when the config name contains "mock".
defaults:
  - env/realworld_dual_franka_joint@env.train
  - env/realworld_dual_franka_joint@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    # The env worker has to sit in the group that carries the robot, or it is
    # handed a bare HardwareInfo and cannot find its Franka.
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: DualFranka
        # Two arms the discovery is told about rather than finding: the fake
        # SDK answers for both, and there is nothing at either address to ping.
        # Each arm's wrist camera is declared per side, which is what reaches
        # the robot as arm_cameras.
        configs:
          - node_rank: 0
            disable_validate: true
            left_robot_ip: 0.0.0.0
            right_robot_ip: 0.0.0.1
            left_camera_serials: ["MOCK0001"]
            left_camera_type: realsense
            right_camera_serials: ["MOCK0002"]
            right_camera_type: realsense
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: /dev/mock-left-gripper
            right_gripper_connection: /dev/mock-right-gripper
            left_controller_node_rank: 0
            right_controller_node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/realworld_dual_franka_mock_sac_cnn
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01  # Soft update coefficient for target networks

  entropy_tuning:
    alpha_type: softplus # choose from ["softplus", "exp", "fixed_alpha"], set to "softplus" or "exp" to enable automatic entropy tuning
    initial_alpha: 0.01  # Initial temperature value
    target_entropy: -16  # Target entropy (-action_dim)
    optim:
      lr: 3.0e-4  # Learning rate for temperature parameter
      lr_scheduler: torch_constant
      clip_grad: 10.0

  # Replay buffer settings
  replay_buffer:
    enable_cache: True
    cache_size: 100 # number of trajectories cached in memory
    sample_window_size: 100 # number of latest trajectories to sample from for replay buffer
    min_buffer_size: 0  # Minimum buffer size before training starts
    auto_save: False

  target_update_freq: 1  # Frequency of target network updates
env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      # Not dummy: every hardware path runs. run.sh installs the fake vendor
      # SDKs, so what answers is a robot that is not there.
      is_dummy: False
      left_camera_serials: ["MOCK0001", ]
      right_camera_serials: ["MOCK0002", ]
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      left_camera_serials: ["MOCK0001", ]
      right_camera_serials: ["MOCK0002", ]

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    precision: ${actor.model.precision}
    model_path: "/workspace/dataset/resnet"

  enable_torch_compile: True
  enable_cuda_graph: False
actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_path: "/workspace/dataset/resnet"
    # The dual-arm env serves 224x224 frames; the CNN default is 128.
    image_size: [3, 224, 224]
    state_dim: 68
    action_dim: 16

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
