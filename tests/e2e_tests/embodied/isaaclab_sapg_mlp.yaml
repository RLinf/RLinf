defaults:
  - env/isaaclab_dex_hand@env.train
  - env/isaaclab_dex_hand@env.eval
  - model/sapg_mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/isaaclab_sapg_mlp
    project_name: rlinf
    experiment_name: "isaaclab_allegro_sapg_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 3
  max_steps: -1

  only_eval: False
  val_check_interval: 1
  save_interval: -1

  seq_length: 1
  max_prompt_length: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: gae
  # "sapg" selects the SAPG actor worker and the PPO actor-critic loss with
  # importance-sampled leader aggregation (see rlinf/algorithms/sapg.py).
  loss_type: sapg
  loss_agg_func: token-mean
  kl_beta: 0.0
  # SAPG drives exploration through a per-block entropy term in the policy
  # loss, not a global entropy bonus, so the standard bonus stays 0.
  entropy_bonus: 0

  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  value_clip: 0.2
  huber_delta: null
  critic_coef: 4.0
  bounds_loss_coef: 0.0001

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 1.0

env:
  group_name: EnvGroup

  train:
    rollout_epoch: 1
    total_num_envs: 48
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 8
    max_episode_steps: 16

    use_rel_reward: False
    reward_coef: ${algorithm.reward_coef}
    is_eval: False
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 12
    max_steps_per_rollout_epoch: 32
    max_episode_steps: 16
    group_size: ${algorithm.group_size}

    use_rel_reward: False
    reward_coef: ${algorithm.reward_coef}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  enable_offload: false
  collect_transitions: true
  pipeline_stage_num: 1

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 64
  seed: 42
  enable_offload: false

  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false

    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

    amp_autocast:
      enabled: false
      precision: "bf16"

    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
