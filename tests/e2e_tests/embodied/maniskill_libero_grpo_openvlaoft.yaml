# One OpenVLA-OFT policy trains and evaluates on ManiSkill and LIBERO at once.
# Both modes are heterogeneous: they list the two envs under `envs`, and each of
# the two env workers hosts one of them.
defaults:
  - env/libero_goal@env.train.envs.libero_goal
  - env/maniskill_put_on_plate_in_scene_25_main@env.train.envs.maniskill
  - env/libero_goal@env.eval.envs.libero_goal
  - env/maniskill_ood_template@env.eval.envs.maniskill
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/maniskill_libero_grpo_openvlaoft
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: 1
  save_interval: -1

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 2

  reward_type: action_level  # action_level or chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    # LIBERO sends a 256x256 main and wrist view, ManiSkill one 640x480 view.
    # The policy reads the main view and the task, so both send just those.
    policy_obs:
      keys: [main_images, task_descriptions]
      image_size: [256, 256]
    # Override the default values in env/libero_goal and
    # env/maniskill_put_on_plate_in_scene_25_main.
    envs:
      libero_goal:
        total_num_envs: 8
        max_episode_steps: 8
        max_steps_per_rollout_epoch: 8
        group_size: ${algorithm.group_size}
        reset_gripper_open: False
      maniskill:
        total_num_envs: 8
        max_episode_steps: 8
        max_steps_per_rollout_epoch: 8
        group_size: ${algorithm.group_size}
  eval:
    rollout_epoch: 1
    policy_obs:
      keys: [main_images, task_descriptions]
      image_size: [256, 256]
    # Override the default values in env/libero_goal and env/maniskill_ood_template.
    envs:
      libero_goal:
        total_num_envs: 4
        auto_reset: True
        ignore_terminations: True
        max_episode_steps: 8
        max_steps_per_rollout_epoch: 8
        reset_gripper_open: False
        is_eval: True
        video_cfg:
          save_video: False
          video_base_dir: ${runner.logger.log_path}/video/eval
      maniskill:
        total_num_envs: 4
        max_episode_steps: 8
        max_steps_per_rollout_epoch: 8
        # The eval template fixes the simulator's own horizon at 80 steps.
        init_params:
          max_episode_steps: 8
        video_cfg:
          save_video: False

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_type: "openvla_oft"
    model_path: "/workspace/dataset/Openvla-oft-SFT-libero-goal-traj1/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 2
  global_batch_size: 16
  seed: 1234
  enable_offload: True

  # Override the default values in model/openvla_oft
  model:
    model_type: "openvla_oft"
    model_path: "/workspace/dataset/Openvla-oft-SFT-libero-goal-traj1/"

    unnorm_key: libero_goal_no_noops
    is_lora: True
    lora_rank: 32
    lora_path: /workspace/dataset/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora/lora_adapter
    max_prompt_length: 128

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 10.0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp2"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
