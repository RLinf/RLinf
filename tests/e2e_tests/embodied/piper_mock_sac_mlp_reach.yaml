# A real-world AgileX Piper run against faked vendor SDKs.
#
# The arm reports six joints and a continuous gripper, so the action is seven
# wide. The observation also carries the arm's own tool pose, making the
# flattened state 14 wide: 6 joints + 7 pose values + 1 gripper. Cameras are
# configured so the camera path opens and reads, even though an MLP policy
# ignores the frames.
#
# run.sh installs the fakes when the config name contains "mock".
defaults:
  - env/piper_reach@env.train
  - env/piper_reach@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    # The env worker has to sit in the group that carries the robot, or it is
    # handed a bare HardwareInfo and cannot find it.
    env:
      node_group: piper
      placement: 0
  node_groups:
    - label: piper
      node_ranks: 0
      hardware:
        type: Piper
        configs:
          - node_rank: 0
            can_channel: can0

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/piper_mock_sac_mlp_reach
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    # One target entropy unit per action dimension.
    target_entropy: -7
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 0
    auto_save: True

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      camera_serials: ["MOCK0001", "MOCK0002"]
      enable_camera_player: False
      use_dense_reward: True
      max_num_steps: 10
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      camera_serials: ["MOCK0001", "MOCK0002"]
      enable_camera_player: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: mlp_policy
    model_path: ""
    # Six arm joints plus the gripper.
    action_dim: 7
    # Six joints, a seven-value tool pose, and the gripper opening.
    obs_dim: 14
    image_num: 0
    precision: "32"
    add_value_head: False
    add_q_head: True

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
