defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results/musa_maniskill_async_ppo_openpi_pi05"
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  staleness_threshold: 1
  behave_weight_threshold: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"
  enable_offload: False
  # Override the default values in env/maniskill_put_on_plate_in_scene_25_main
  train:
    rollout_epoch: 1
    # The CPU sim backend cannot vectorise inside one process: one env per rank.
    total_num_envs: 2
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 20 # max episode steps for truncation
    max_steps_per_rollout_epoch: 20
    init_params:
      use_multiple_plates: False
      # SAPIEN's GPU physx backend needs CUDA.
      sim_backend: "cpu"
      # No CUDA means SAPIEN falls back to a "cpu" render device its Vulkan
      # renderer rejects, so name a PCI device and let it pick the software one.
      render_backend: "pci:0000:00:00.0"
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 20
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      use_multiple_plates: False
      sim_backend: "cpu"
      render_backend: "pci:0000:00:00.0"

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/workspace/dataset/RLinf-Pi05-ManiSkill-25Main-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 2
  seed: 0
  enable_offload: False
  # Override the default values in model/pi0_5
  model:
    model_path: "/workspace/dataset/RLinf-Pi05-ManiSkill-25Main-SFT"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 5 # interface for the env
    num_steps: 4
    # openpi specific parameters
    openpi:
      value_after_vlm: True
      config_name: "pi05_maniskill"
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 8
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True # False for flow_sde, True for flow_noise
    policy_setup: widowx_bridge

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
