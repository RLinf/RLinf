defaults:
  - robotwin_click_bell_grpo_lingbotvlav2
  - _self_

hydra:
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

algorithm:
  # Two groups of two rollouts on the four smoke envs.
  group_size: 2

cluster:
  component_placement:
    actor, env, rollout: 0-1

runner:
  max_epochs: 2
  max_steps: 2
  val_check_interval: -1
  save_interval: 2
  logger:
    experiment_name: robotwin_vla2_grpo_smoke

env:
  train:
    total_num_envs: 4
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    video_cfg:
      save_video: false
    task_config:
      step_lim: 100
  eval:
    total_num_envs: 4
    video_cfg:
      save_video: false

actor:
  global_batch_size: 4
  # Two envs per rollout rank on the four smoke envs, so rollout and replay
  # still share one MoE/GEMM batch shape.
  micro_batch_size: 2
  model:
    forward_micro_batch_size: 2
    model_path: /workspace/dataset/lingbot-vla-v2-6b-robotwin/checkpoints/global_step_50000/hf_ckpt
    tokenizer_path: /workspace/dataset/Qwen3-VL-4B-Instruct
    lingbotvlav2:
      training_config_path: /workspace/dataset/lingbot-vla-v2-6b-robotwin/lingbotvla_cli.yaml
      robot_config_path: ${oc.env:LINGBOT_VLA_V2_PATH}/configs/robot_configs/robotwin.yaml
      stats_path: ${oc.env:LINGBOT_VLA_V2_PATH}/assets/norm_stats/robotwin.json
