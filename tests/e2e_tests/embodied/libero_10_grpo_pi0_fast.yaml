defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/pi0_fast@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: ../results/libero_10_grpo_pi0_fast
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]

  # The first run saves global_step_1. Resume validation overrides max_steps=2.
  max_epochs: 2
  max_steps: 1
  only_eval: False
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 2
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: sequence_token_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  log_entropy_metrics: True
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -20
  clip_log_ratio_max: 20
  filter_rewards: True
  log_group_success_metrics: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 4
    seed: 0
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    seed: 0
    auto_reset: False
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 0.3
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: ${actor.model.pi0_fast.max_action_tokens}

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    precision: ${actor.model.precision}
    pi0_fast:
      gradient_checkpointing: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 4
  seed: 1234
  enable_offload: False

  model:
    is_lora: True
    lora_rank: 2
    lora_target_scope: "all_linear"
    pi0_fast:
      gradient_checkpointing: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    use_fp32_master_params: True

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
      cast_forward_inputs: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False

weight_syncer:
  patch:
    transport_device: cpu
