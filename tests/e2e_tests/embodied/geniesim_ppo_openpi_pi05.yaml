# One PPO update against an externally managed GenieSim server.
defaults:
- env/geniesim@env.train
- env/geniesim@env.eval
- model/pi0_5_geniesim@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    env: 0
runner:
  task_type: embodied
  logger:
    log_path: ../results/geniesim-smoke
    project_name: rlinf
    experiment_name: geniesim_ppo_smoke
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: false
  eval_policy_path: null
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: false
    max_episode_steps: 20
    max_steps_per_rollout_epoch: 20
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
    override_cfg:
      addresses: null
      task_name: table_task_1_g2_op
      sub_task_name: pick_block_color
      cycle_work_items: true
      address: ${oc.env:GENIESIM_SERVER_ADDR}
      nonfinite_state_recovery: false
  eval:
    seed: -1
    rollout_epoch: 4
    total_num_envs: 2
    auto_reset: false
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
    video_cfg:
      save_video: false
      info_on_video: true
      fps: 10
      video_base_dir: ${runner.logger.log_path}/video/eval
    override_cfg:
      addresses: null
      task_name: ${env.train.override_cfg.task_name}
      sub_task_name: ${env.train.override_cfg.sub_task_name}
      cycle_work_items: true
      address: ${oc.env:GENIESIM_EVAL_SERVER_ADDR,tcp://127.0.0.1:5602}
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 4
  seed: 42
  enable_offload: true
  model:
    model_path: ${oc.env:GENIESIM_CHECKPOINT_PATH}
    add_value_head: true
    openpi:
      value_after_vlm: true
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 1
    min_lr_rate: 0.1
    lr_scheduler: cosine
    num_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    enable_gradient_accumulation: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
