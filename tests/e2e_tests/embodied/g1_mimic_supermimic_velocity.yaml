# g1_mimic_supermimic with velocity tracking on two GPUs, so the actor and
# env groups each run two ranks.
defaults:
  - supermimic_lafan1_goal730
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  component_placement:
    actor,env,rollout: 0-1

runner:
  logger:
    log_path: /workspace/results/g1_mimic_supermimic_velocity
    experiment_name: ci-test
  max_epochs: 3
  save_interval: 3
  val_check_interval: 3
  eval_export:
    enabled: True

algorithm:
  termination_head: learned
  replay_length: 32
  warmup_sim_steps: 16
  updates_per_env_step: 2.0
  wm_only_updates: 1
  wm_batches: 1
  wm_window_batch: 16
  imagine_batch: 16
  critic_epochs: 1
  critic_minibatches: 1

actor:
  model:
    torch_compile: False
    goal_encoding: paper
    obs_dim: 93
    critic_features: root4
    input_norm: none
    wm_state_loss: paper
    velocity_tracking: True

env:
  train:
    total_num_envs: 8
    num_clips: 1
    motion_on_cpu: True
  eval:
    total_num_envs: 2
    num_clips: 1
    motion_on_cpu: True
    max_steps_per_rollout_epoch: 64  # frames in the standing clip
