# Integration uses the public base or a short SFT export with reference statistics.
defaults:
  - embodichain_franka_stack_cube_ppo_openpi_pi05_smoke
  - _self_

hydra:
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

runner:
  logger:
    log_path: ${oc.env:STACK_CI_RUN,/workspace/results/embodichain_stack_cube_pi05}/ppo
    experiment_name: ci-test
    logger_backends: [tensorboard]
  max_epochs: 1
  val_check_interval: -1
  save_interval: 1

algorithm:
  update_epoch: 1

env:
  eval:
    video_cfg:
      save_video: false

cluster:
  component_placement:
    actor,rollout:
      placement: ${oc.env:STACK_CUBE_PPO_POLICY_PLACEMENT,0}
    env:
      placement: ${oc.env:STACK_CUBE_PPO_SIM_PLACEMENT,1}
