defaults:
  - env/libero_10@env.eval
  - model/molmoact2@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    # MolmoAct2 runs in fp32 (~22 GB) and evaluates one env at a time, so a
    # single GPU is enough and keeps total_num_envs divisible by the world size.
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: /workspace/results/libero_10_molmoact2_eval
    project_name: rlinf
    experiment_name: "ci-test"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    # Smoke test only: 2 envs x 1 episode, not a benchmark run. Keep the episode
    # length a multiple of the policy's 10-step action queue (see model preset).
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    seed: 1000
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    # MolmoAct2 runs continuous-action inference; token sampling params are
    # unused, but the HF rollout worker still reads this block.
    do_sample: False
    temperature_train: 0.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  # MolmoAct2 keeps one action queue per batch index, so the batch composition
  # must stay stable across calls: keep a single pipeline stage.
  pipeline_stage_num: 1

  model:
    model_path: "/workspace/dataset/MolmoAct2-LIBERO" # https://huggingface.co/allenai/MolmoAct2-LIBERO
    model_type: "molmoact2"
