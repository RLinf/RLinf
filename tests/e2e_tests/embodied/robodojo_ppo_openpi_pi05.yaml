defaults:
  - env/robodojo_put_bottles_into_dustbin@env.train
  - env/robodojo_put_bottles_into_dustbin@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  max_epochs: 1
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  logger:
    log_path: /workspace/results/robodojo_ppo_openpi_pi05
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    enable_offload: false
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    state_action_order: aloha
    seeds_path: null
    task_config:
      random: true
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: false
    enable_offload: false
    is_eval: true
    max_episode_steps: 50
    max_steps_per_rollout_epoch: 50
    state_action_order: aloha
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robodojo/seeds/eval_seeds.json
    task_config:
      random: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: false
  model:
    model_path: /workspace/dataset/robodojo/ckpt/RoboDojo/Pi_05_robodojo_arx_x5
    action_dim: 14
    num_action_chunks: 50
    num_steps: 10
    add_value_head: true
    openpi_data:
      adapt_to_pi: false
      norm_stats_path: ${..model_path}/assets/norm_stats.json
    openpi:
      task: rl
      config_name: pi05_aloha_robotwin
      num_images_in_input: 3
      action_env_dim: 14
      model_action_dim: 32
      value_after_vlm: true
      torch_compile: false
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    enable_gradient_accumulation: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
