# QAM reference: 2726d767c9a0a7a46d49693f0391f73dc2cf58ac.
# This smoke test runs one independent seed on one GPU.
hydra:
  run:
    dir: .
  output_subdir: null

seeds: [10001]
gpu_start: 0
gpu_end: 0
data:
  dataset_type: ogbench
  task_name: antmaze-large-navigate-singletask-task1-v0
env:
  env_type: ogbench
  task_name: antmaze-large-navigate-singletask-task1-v0
algorithm:
  loss_type: qam
actor:
  lr: 0.0003
  batch_size: 8
  updates_per_call: 2
  model:
    model_type: qam_policy
    precision: fp32
    is_lora: false
    load_to_device: false
    obs_dim: 29
    action_dim: 8
    actor_hidden_dims: [16, 16]
    value_hidden_dims: [16, 16]
    actor_layer_norm: false
    value_layer_norm: true
    horizon_length: 1
    action_chunking: true
    num_qs: 2
    rho: 0.5
    discount: 0.99
    tau: 0.005
    flow_steps: 3
    best_of_n: 1
    inv_temp: 10.0
    residual: false
    fql_alpha: 0.0
    edit_scale: 0.0
runner:
  max_epochs: 8
  max_steps: 8
  offline_steps: 4
  online_steps: 4
  start_training: 1
  val_check_interval: 4
  save_interval: 4
  log_interval: 2
  eval_episodes: 1
  only_eval: false
  per_worker_log: true
  resume_dir: null
  logger:
    log_path: logs
    project_name: rlinf-qam
    experiment_name: qam-ci-smoke
    logger_backends: [tensorboard]
