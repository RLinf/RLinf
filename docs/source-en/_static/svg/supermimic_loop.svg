<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #FFFFFF; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; }
    .item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #334155; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
  </style>

  <!-- Clean background for light/dark mode readability -->
  <rect class="bg" x="0" y="0" width="960" height="275" rx="12"/>

  <!-- Phase 1: Collect -->
  <rect x="20" y="24" width="276" height="176" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <rect x="36" y="38" width="66" height="22" rx="11" fill="#2563EB"/>
  <text class="badge-text" x="69" y="53" text-anchor="middle">PHASE 1</text>
  <text class="card-title" x="36" y="84">Collect in MuJoCo Warp</text>
  <text class="card-sub" x="36" y="104" fill="#1D4ED8">Simulation &amp; Replay Buffer</text>
  <line x1="36" y1="114" x2="280" y2="114" stroke="#BFDBFE" stroke-width="1.2"/>
  <text class="item" x="36" y="136">• 4096 parallel G1 envs at 50 Hz</text>
  <text class="item" x="36" y="158">• Return-based clip reset sampling</text>
  <text class="item" x="36" y="180">• Store transitions in local replay</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="296" y1="112" x2="338" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Fit World Model -->
  <rect x="342" y="24" width="276" height="176" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
  <rect x="358" y="38" width="66" height="22" rx="11" fill="#D97706"/>
  <text class="badge-text" x="391" y="53" text-anchor="middle">PHASE 2</text>
  <text class="card-title" x="358" y="84">Fit World Model (k = 8)</text>
  <text class="card-sub" x="358" y="104" fill="#B45309">Differentiable Dynamics</text>
  <line x1="358" y1="114" x2="602" y2="114" stroke="#FDE68A" stroke-width="1.2"/>
  <text class="item" x="358" y="136">• 10 batches × 2048 replay windows</text>
  <text class="item" x="358" y="158">• Predict velocity increments &amp; integrate</text>
  <text class="item" x="358" y="180">• Bryson-weighted per-channel MSE</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="618" y1="112" x2="660" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: Imagine & Optimize -->
  <rect x="664" y="24" width="276" height="176" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <rect x="680" y="38" width="66" height="22" rx="11" fill="#059669"/>
  <text class="badge-text" x="713" y="53" text-anchor="middle">PHASE 3</text>
  <text class="card-title" x="680" y="84">Imagine &amp; Optimize (H = 32)</text>
  <text class="card-sub" x="680" y="104" fill="#047857">Policy &amp; Critic Update</text>
  <line x1="680" y1="114" x2="924" y2="114" stroke="#A7F3D0" stroke-width="1.2"/>
  <text class="item" x="680" y="136">• Roll out policy in frozen world model</text>
  <text class="item" x="680" y="158">• Backprop tracking return + soft survival</text>
  <text class="item" x="680" y="180">• Fit critic to GAE lambda-returns</text>

  <!-- Feedback Loop: Phase 3 -> Phase 1 -->
  <path d="M 802 200 L 802 238 Q 802 246 794 246 L 166 246 Q 158 246 158 238 L 158 206"
        fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-loop)"/>
  <rect x="348" y="233" width="264" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text class="edge-label" x="480" y="249" text-anchor="middle">Sync updated policy weights to rollout</text>
</svg>
