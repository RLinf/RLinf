<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">FlexRLT · Online learning</title>
<desc id="desc">Rollout extracts frozen VLA features and reference actions. A trainable actor proposes action chunks; optional STEAM and expert models control routing. The environment supplies executed transitions to replay. Learning updates actor and critic; actor weights return to rollout.</desc>
