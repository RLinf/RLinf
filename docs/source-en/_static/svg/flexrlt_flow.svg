<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 535" role="img" aria-labelledby="title desc">
<title id="title">FlexRLT online training</title>
<desc id="desc">A frozen VLA extracts features and reference actions. A compact actor proposes actions. Optional STEAM routing selects the action source. Replay stores transitions; learning updates only actor and critic and synchronizes the actor back to rollout.</desc>
