<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="RLinf hardware tiers from single GPU to multi-node clusters">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Tier 1 -->
  <g filter="url(#shadow)">
    <rect x="24" y="26" width="214" height="168" rx="12" fill="#f8fafc" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="24" y="26" width="214" height="38" rx="12" fill="#0d9488"/>
    <rect x="24" y="52" width="214" height="12" fill="#0d9488"/>
    <text x="131" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">1 GPU (24 GB+)</text>
    <text x="131" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Entry &amp; Prototyping</text>
    <text x="131" y="114" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">MLP / CNN simulation RL</text>
    <text x="131" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">VLA evaluation &amp; LoRA SFT</text>
    <text x="131" y="158" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Real-robot data &amp; deploy</text>
  </g>

  <!-- Tier 2 -->
  <g filter="url(#shadow)">
    <rect x="256" y="26" width="214" height="168" rx="12" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="256" y="26" width="214" height="38" rx="12" fill="#0284c7"/>
    <rect x="256" y="52" width="214" height="12" fill="#0284c7"/>
    <text x="363" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">1–2 GPUs (40–80 GB)</text>
    <text x="363" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Single-Workstation RL</text>
    <text x="363" y="114" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">OpenVLA / OpenPI quickstart</text>
    <text x="363" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Collocated PPO / GRPO</text>
    <text x="363" y="158" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Small LLM reasoning RL</text>
  </g>

  <!-- Tier 3 -->
  <g filter="url(#shadow)">
    <rect x="488" y="26" width="214" height="168" rx="12" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="488" y="26" width="214" height="38" rx="12" fill="#4f46e5"/>
    <rect x="488" y="52" width="214" height="12" fill="#4f46e5"/>
    <text x="595" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">4–8 GPUs (80 GB)</text>
    <text x="595" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Full Benchmark Recipes</text>
    <text x="595" y="114" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Full-parameter VLA SFT &amp; RL</text>
    <text x="595" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">LIBERO / ManiSkill / RoboTwin</text>
    <text x="595" y="158" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">7B–14B reasoning &amp; agent RL</text>
  </g>

  <!-- Tier 4 -->
  <g filter="url(#shadow)">
    <rect x="720" y="26" width="216" height="168" rx="12" fill="#f8fafc" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="720" y="26" width="216" height="38" rx="12" fill="#7c3aed"/>
    <rect x="720" y="52" width="216" height="12" fill="#7c3aed"/>
    <text x="828" y="50" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Multi-Node (8xH100+)</text>
    <text x="828" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0f172a">Cluster Scale</text>
    <text x="828" y="114" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Disaggregated &amp; hybrid runs</text>
    <text x="828" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">Megatron + SGLang / vLLM</text>
    <text x="828" y="158" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#475569">World models &amp; fleet RL</text>
  </g>
</svg>
