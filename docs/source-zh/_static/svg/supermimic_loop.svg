<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="960" height="275">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #FFFFFF; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 600; }
    .item { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12.5px; fill: #334155; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
  </style>

  <!-- 白色圆角底板，保证浅色/深色主题清晰 -->
  <rect class="bg" x="0" y="0" width="960" height="275" rx="12"/>

  <!-- 阶段 1：仿真采集 -->
  <rect x="20" y="24" width="276" height="176" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <rect x="36" y="38" width="58" height="22" rx="11" fill="#2563EB"/>
  <text class="badge-text" x="65" y="53" text-anchor="middle">阶段 1</text>
  <text class="card-title" x="36" y="84">MuJoCo Warp 仿真采集</text>
  <text class="card-sub" x="36" y="104" fill="#1D4ED8">并行仿真与 Replay Buffer</text>
  <line x1="36" y1="114" x2="280" y2="114" stroke="#BFDBFE" stroke-width="1.2"/>
  <text class="item" x="36" y="136">• 4096 个 G1 环境以 50 Hz 并行步进</text>
  <text class="item" x="36" y="158">• 按回报分箱重采样高难度起始帧</text>
  <text class="item" x="36" y="180">• 将状态转移写入各卡本地 replay</text>

  <!-- 箭头 1 -> 2 -->
  <line x1="296" y1="112" x2="338" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 2：拟合世界模型 -->
  <rect x="342" y="24" width="276" height="176" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
  <rect x="358" y="38" width="58" height="22" rx="11" fill="#D97706"/>
  <text class="badge-text" x="387" y="53" text-anchor="middle">阶段 2</text>
  <text class="card-title" x="358" y="84">拟合世界模型（k = 8）</text>
  <text class="card-sub" x="358" y="104" fill="#B45309">可微动力学预测</text>
  <line x1="358" y1="114" x2="602" y2="114" stroke="#FDE68A" stroke-width="1.2"/>
  <text class="item" x="358" y="136">• 每轮 10 批 × 2048 条连续窗口</text>
  <text class="item" x="358" y="158">• 预测速度增量并半隐式积分位姿</text>
  <text class="item" x="358" y="180">• Bryson 规则通道加权 MSE 损失</text>

  <!-- 箭头 2 -> 3 -->
  <line x1="618" y1="112" x2="660" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 3：想象与优化 -->
  <rect x="664" y="24" width="276" height="176" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
  <rect x="680" y="38" width="58" height="22" rx="11" fill="#059669"/>
  <text class="badge-text" x="709" y="53" text-anchor="middle">阶段 3</text>
  <text class="card-title" x="680" y="84">想象轨迹与优化（H = 32）</text>
  <text class="card-sub" x="680" y="104" fill="#047857">Policy 与 Critic 更新</text>
  <line x1="680" y1="114" x2="924" y2="114" stroke="#A7F3D0" stroke-width="1.2"/>
  <text class="item" x="680" y="136">• 在冻结的世界模型中前向推演 32 步</text>
  <text class="item" x="680" y="158">• 沿可微奖励与软终止反传至 policy</text>
  <text class="item" x="680" y="180">• 用想象轨迹上的 GAE 目标拟合 critic</text>

  <!-- 闭环箭头：阶段 3 -> 阶段 1 -->
  <path d="M 802 200 L 802 238 Q 802 246 794 246 L 166 246 Q 158 246 158 238 L 158 206"
        fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-loop)"/>
  <rect x="358" y="233" width="244" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text class="edge-label" x="480" y="249" text-anchor="middle">同步更新后的 policy 权重到 rollout</text>
</svg>
