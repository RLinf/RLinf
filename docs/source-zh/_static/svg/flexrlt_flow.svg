<text x="354.5" y="154" text-anchor="middle" font-size="21" font-weight="700" fill="#314259">冻结 VLA</text>
<text x="354.5" y="183" text-anchor="middle" font-size="15" font-weight="400" fill="#314259">prefix 表示 + 参考动作</text>
<rect x="515" y="118" width="205" height="96" rx="12" fill="#ffead5" stroke="#d4dce8"/>
<text x="617.5" y="154" text-anchor="middle" font-size="21" font-weight="700" fill="#314259">可训练 Actor</text>
<text x="617.5" y="183" text-anchor="middle" font-size="15" font-weight="400" fill="#314259">输出动作块</text>
