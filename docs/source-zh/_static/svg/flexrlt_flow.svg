<text x="884.0" y="183" text-anchor="middle" font-size="15" font-weight="400" fill="#314259">参考动作 / Actor / Expert</text>
<rect x="1030" y="118" width="180" height="96" rx="12" fill="#eaf0f7" stroke="#d4dce8"/>
<text x="1120.0" y="154" text-anchor="middle" font-size="21" font-weight="700" fill="#314259">执行动作</text>
<text x="1120.0" y="183" text-anchor="middle" font-size="15" font-weight="400" fill="#314259">环境返回奖励</text>
<rect x="768" y="279" width="232" height="96" rx="12" fill="#dcf4e8" stroke="#d4dce8"/>
<text x="884.0" y="315" text-anchor="middle" font-size="21" font-weight="700" fill="#314259">STEAM Gate（可选）</text>
