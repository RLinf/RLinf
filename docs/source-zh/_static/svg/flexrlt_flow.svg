<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 535" role="img" aria-labelledby="title desc">
<title id="title">FlexRLT 在线训练流程</title>
<desc id="desc">A frozen VLA extracts features and reference actions. A compact actor proposes actions. Optional STEAM routing selects the action source. Replay stores transitions; learning updates only actor and critic and synchronizes the actor back to rollout.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#536b86"/></marker><marker id="learn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b85b13"/></marker></defs>
<rect width="1240" height="535" rx="16" fill="#f7f9fc"/>
<g font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
