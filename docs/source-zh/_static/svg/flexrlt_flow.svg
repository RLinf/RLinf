<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">FlexRLT · 在线学习流程</title>
<desc id="desc">冻结 VLA 提取表示和参考动作。Actor 输出动作块，STEAM 与专家模型参与动作选择。环境中的实际动作与状态转移进入回放，训练端更新 Actor 和 Critic，并同步 Actor 权重。</desc>
