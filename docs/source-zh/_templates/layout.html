{%- extends "!layout.html" %}

{%- block extrahead %}
{{ super() }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<script>
// Sphinx AI Configuration - Injected during build process
window.SPHINX_AI_CONFIG = {
  typesense: {
    host: '{{ typesense_host | default("localhost") }}',
    port: {{ typesense_port | default(8108) }},
    protocol: '{{ typesense_protocol | default("http") }}',
    apiKey: '{{ typesense_api_key | default("") }}',
    collectionName: '{{ typesense_collection | default("sphinx_docs") }}',
    enableVectorSearch: {{ 'false' if typesense_enable_vector_search == 'false' else 'true' }},
    stopwordsSet: '{{ typesense_stopwords_set | default("") }}'
  },
  build: {
    environment: '{{ sphinx_env | default("development") }}',
    debug: {{ 'true' if sphinx_debug == 'true' else 'false' }},
    buildTime: new Date().toISOString()
  },
  debug: {{ 'true' if sphinx_debug == 'true' else 'false' }}
};

// Status logging
(function() {
  const config = window.SPHINX_AI_CONFIG;
  const hasTypesense = !!(config.typesense.apiKey && config.typesense.apiKey.trim());
  
  if (config.debug) {
    console.log('Sphinx AI Configuration:', {
      environment: config.build.environment,
      typesenseConfigured: hasTypesense,
      debug: config.debug
    });
  }
  
  // Display mode message
  if (!hasTypesense) {
    console.log('🔧 Sphinx AI: Running in demo mode - configure Typesense API key for full functionality');
  } else {
    console.log('✅ Sphinx AI: Typesense configured and ready');
  }
})();
</script>
{%- endblock %}

{%- block docs_navbar %}
<button class="pst-navbar-icon sidebar-toggle primary-toggle rlinf-sidebar-toggle d-print-none" aria-label="{{ _('Site navigation') }}">
  <span class="fa-solid fa-bars"></span>
</button>
{% include "askai.html" %}
{%- endblock %}
