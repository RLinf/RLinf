name: Scheduler Tests


on:
  workflow_call:

jobs:
  static-auto-placement-test:
    runs-on: reason
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create reason environment
        run: |
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          export MEGATRON_PATH=/workspace/dataset/Megatron-LM
          bash requirements/install.sh agentic

      - name: auto-placement
        timeout-minutes: 20
        run: |
          export REPO_PATH=$(pwd)
          source .venv/bin/activate
          bash tests/e2e_tests/auto_placement/run.sh

      - name: Clean up
        if: always()
        run: |
          rm -rf .venv ../results

  dynamic-scheduler-reason-qwen-grpo-test:
    runs-on: reason
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: rlinf

      - name: Create reason environment
        run: |
          cd rlinf
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          export MEGATRON_PATH=/workspace/dataset/Megatron-LM
          # One venv per engine: sglang and vllm pin the same kernel libraries to
          # different versions, so a shared venv breaks whichever is installed first.
          # params_resharding_release only supports Python <= 3.11.
          bash requirements/install.sh agentic --python 3.11.14 --engine sglang
          bash requirements/install.sh agentic --python 3.11.14 --venv .venv-vllm --engine vllm

      - name: Megatron SGLang
        timeout-minutes: 20
        run: |
          source rlinf/.venv/bin/activate
          export PYTHONPATH=/workspace/dataset/Megatron-LM-011:/workspace/dataset/params_resharding_release
          cd rlinf
          export REPO_PATH=$(pwd)
          bash tests/e2e_tests/dynamic_scheduler/run.sh qwen2.5-1.5b-grpo-dynamic-mg-sgl

      - name: Megatron vLLM
        timeout-minutes: 20
        run: |
          source rlinf/.venv-vllm/bin/activate
          export PYTHONPATH=/workspace/dataset/Megatron-LM-011:/workspace/dataset/params_resharding_release
          cd rlinf
          export REPO_PATH=$(pwd)
          bash tests/e2e_tests/dynamic_scheduler/run.sh qwen2.5-1.5b-grpo-dynamic-mg-vllm

      - name: Clean up
        if: always()
        run: |
          rm -rf rlinf/.venv rlinf/.venv-vllm results /workspace/results/grpo-1.5b-dynamic-mg-sgl
