name: Publish rlinf-cli to PyPI

on:
  push:
    branches:
      - main
    paths:
      - "cli/**"
  workflow_dispatch:

concurrency:
  group: publish-rlinf-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish rlinf-cli
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check whether version is already published on PyPI
        id: check_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("cli/pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          status="$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/rlinf-cli/${version}/json")"
          if [ "$status" = "200" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "### rlinf-cli ${version} already published"
              echo "Skipped upload because \`rlinf-cli==${version}\` already exists on PyPI. Bump \`version\` in \`cli/pyproject.toml\` to publish a new release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "rlinf-cli ${version} is already on PyPI; skipping publish."
          elif [ "$status" = "404" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "rlinf-cli ${version} not found on PyPI; proceeding with build and publish."
          else
            echo "Unexpected HTTP status ${status} querying PyPI for rlinf-cli ${version}." >&2
            exit 1
          fi

      - name: Build rlinf-cli distributions
        if: steps.check_version.outputs.should_publish == 'true'
        run: uv build ./cli --out-dir dist

      - name: Smoke-test built wheel
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          uvx --isolated --from dist/rlinf_cli-*.whl rlinf --version
          uvx --isolated --from dist/rlinf_cli-*.whl rlinf install --list

      - name: Publish to PyPI
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            uv publish --token "$PYPI_API_TOKEN" dist/rlinf_cli-*.tar.gz dist/rlinf_cli-*.whl
          else
            uv publish --trusted-publishing always dist/rlinf_cli-*.tar.gz dist/rlinf_cli-*.whl
          fi
          {
            echo "### Published rlinf-cli ${{ steps.check_version.outputs.version }}"
            echo "Uploaded to https://pypi.org/project/rlinf-cli/${{ steps.check_version.outputs.version }}/"
          } >> "$GITHUB_STEP_SUMMARY"
