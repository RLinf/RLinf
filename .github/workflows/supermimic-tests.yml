name: SuperMimic End-to-End Tests

on:
  workflow_call:

jobs:
  # The real entry points need mjlab and a GPU. The same file holds the small
  # CPU numerical regressions; a second GPU enables the NCCL/RCCL case.
  supermimic-tests-cuda:
    runs-on: reason
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create environment and install dependencies
        run: |
          unset UV_DEFAULT_INDEX
          bash requirements/install.sh --no-flash-attn embodied --env supermimic

      - name: Run numerical regressions and end-to-end tests
        timeout-minutes: 60
        run: |
          export PYTHONPATH=$(pwd)
          export MUJOCO_GL=disable
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          export SUPERMIMIC_SCAN_EAGER=1 SUPERMIMIC_FK_EAGER=1
          source .venv/bin/activate
          python -c 'import torch, mjlab, mujoco_warp; assert torch.cuda.is_available(), "GPU unavailable"'
          python -m pytest tests/e2e_tests/embodied/test_supermimic.py -q -rs

      - name: Clean up
        if: always()
        run: |
          rm -rf .venv
          uv cache prune
