name: Unit Tests

on:
  workflow_call:

jobs:
  unit-tests-cuda:
    runs-on: reason
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create environment and install dependencies
        run: |
          unset UV_DEFAULT_INDEX
          bash requirements/install.sh --no-flash-attn embodied --env dummy
          source .venv/bin/activate
          uv pip install "transformers<=5.9.0"

      - name: Run pytest
        timeout-minutes: 40
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests/unit_tests
          source .venv/bin/activate
          for file in tests/unit_tests/test_*.py; do
              code=0
              pytest "$file" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done

      - name: Run doctest
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          pytest --doctest-modules rlinf/scheduler

      - name: Clean up
        run: |
          rm -rf .venv
          uv cache prune

  unit-tests-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create environment and install dependencies
        run: |
          pip install uv
          uv venv
          source .venv/bin/activate
          UV_TORCH_BACKEND=auto uv sync
          uv pip install gymnasium imageio opencv-python
          uv pip install "transformers<=5.9.0"

      - name: Run pytest
        timeout-minutes: 40
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests/unit_tests:$PYTHONPATH 
          source .venv/bin/activate
          for file in tests/unit_tests/test_*.py; do
              code=0
              pytest "$file" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done

  unit-tests-rocm:
    runs-on: rocm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create ROCm environment and install dependencies
        run: |
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          bash requirements/install.sh --platform amd --no-flash-attn embodied --env dummy
          source .venv/bin/activate
          uv pip install "transformers<=5.9.0"

      - name: Run unit tests
        timeout-minutes: 40
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests/unit_tests:$PYTHONPATH
          source .venv/bin/activate
          for file in tests/unit_tests/test_*.py; do
              code=0
              pytest "$file" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done

      - name: Clean up
        run: |
          rm -rf .venv
          uv cache prune

  unit-tests-ascend:
    runs-on: ascend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create CANN environment and install dependencies
        run: |
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          bash requirements/install.sh --platform ascend --no-flash-attn embodied --env dummy
          source .venv/bin/activate
          uv pip install "transformers<=5.9.0"

      - name: Run unit tests
        timeout-minutes: 60
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests/unit_tests:$PYTHONPATH
          source .venv/bin/activate
          for file in tests/unit_tests/test_*.py; do
              code=0
              pytest "$file" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done

      - name: Clean up
        run: |
          rm -rf .venv
          uv cache prune

  unit-tests-musa:
    runs-on: musa
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create MUSA environment and install dependencies
        run: |
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          bash requirements/install.sh --platform musa embodied --env dummy
          source .venv/bin/activate
          uv pip install "transformers<=5.9.0"

      - name: Run unit tests
        timeout-minutes: 60
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests/unit_tests:$PYTHONPATH
          # This runner reports 255 CPUs, and the image's BLAS sizes its thread
          # pool from that. Left alone it segfaults inside numpy.linalg, so the
          # tests are pinned to one thread each: they do small matrix work, and
          # pinning also makes the run faster.
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          source .venv/bin/activate
          for file in tests/unit_tests/test_*.py; do
              code=0
              pytest "$file" -m "not placement" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done
          # A placement test hosts parts in real workers. The MUSA image
          # reserves a very large address space in every process, so placing
          # parts over and over in one process leaves it unable to allocate
          # thread-local storage for the next worker, and the run dies rather
          # than reporting a test. Give each of them a fresh process.
          placement_tests=$(pytest --collect-only -qq -m placement tests/unit_tests | grep '::')
          if [ -z "$placement_tests" ]; then
              echo "No placement tests were collected; the marker or the path is wrong."
              exit 1
          fi
          for test in $placement_tests; do
              code=0
              pytest "tests/unit_tests/$test" || code=$?
              ray stop
              [ $code -eq 0 ] || exit $code
          done

      - name: Clean up
        run: |
          rm -rf .venv
          uv cache prune

  package-build-test:
    runs-on: embodied
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create environment and install dependencies
        shell: bash
        run: |
          uv venv
          source .venv/bin/activate
          uv build
          export WHL_FILE=$(ls $(pwd)/dist/rlinf-*.whl)
          export REQ_DIR=$(pwd)/requirements/agentic
          cd
          unset UV_DEFAULT_INDEX
          export UV_PATH=/workspace/dataset/.uv
          export UV_LINK_MODE=symlink
          export UV_CACHE_DIR=/workspace/dataset/.uv_cache
          export UV_PYTHON_INSTALL_DIR=/workspace/dataset/.uv_python
          uv pip install $WHL_FILE[embodied]
          uv pip install $WHL_FILE[agentic]
          env -u UV_TORCH_BACKEND uv pip install -r $REQ_DIR/vllm_0.8.5_cu12.txt
          env -u UV_TORCH_BACKEND uv pip install --no-deps vllm==0.8.5
          env -u UV_TORCH_BACKEND uv pip install -r $REQ_DIR/sglang_0.4.6.post5_cu12.txt
          cd -

      - name: Check package import
        shell: bash
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          export PACKAGE_PATH=$(pwd)
          export PYTHONPATH=/workspace/dataset/Megatron-LM:$PYTHONPATH
          cd
          python $PACKAGE_PATH/tests/unit_tests/check_import_rlinf_package.py
          cd -
      
      - name: Clean up
        run: |
          rm -rf .venv
          uv cache prune

  package-structure-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check missing __init__.py under rlinf
        run: python tests/unit_tests/check_missing_init.py
